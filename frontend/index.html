<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Clipping Studio ? Clipping OS</title>
  <style>
    :root {
      --bg: #07080e;
      --surface: #0e101a;
      --surface-2: #141826;
      --text: #f5f7fc;
      --muted: #98a2b8;
      --border: rgba(148, 163, 184, 0.16);
      --glow: rgba(129, 140, 248, 0.55);
      --accent: #7c5cff;
      --accent-2: #22d3ee;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --dur: 280ms;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background:
        radial-gradient(880px 420px at 82% -8%, rgba(124, 92, 255, 0.16), transparent 60%),
        radial-gradient(680px 380px at 8% 20%, rgba(34, 211, 238, 0.08), transparent 55%),
        var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    .lit {
      position: relative;
      background: linear-gradient(180deg, rgba(20, 24, 38, 0.94), rgba(13, 16, 26, 0.96));
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
    }

    .lit::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 16px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(129, 140, 248, 0.52), rgba(34, 211, 238, 0.14), rgba(124, 92, 255, 0.4));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0.48;
      pointer-events: none;
      transition: opacity var(--dur) var(--ease);
    }

    .lit:hover {
      border-color: var(--glow);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.58), 0 0 24px rgba(124, 92, 255, 0.16);
    }

    .lit:hover::before { opacity: 0.95; }

    .shell {
      max-width: 1380px;
      margin: 0 auto;
      padding: 22px;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    /* LEFT COLUMN: DOCKED MOTION THUMBNAIL + COLLAPSING 3-DOT/LINE TRIGGER */
    .left-rail {
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: sticky;
      top: 22px;
    }

    .motion-card { padding: 14px; }

    .motion-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      background: radial-gradient(circle at 30% 30%, rgba(124, 92, 255, 0.35), rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(129, 140, 248, 0.34);
      transition: aspect-ratio var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }

    .motion-bg-anim {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(125deg, rgba(124, 92, 255, 0.32), transparent 55%),
        linear-gradient(305deg, rgba(34, 211, 238, 0.22), transparent 50%),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 24px);
      animation: drift 6s linear infinite;
    }

    @keyframes drift {
      0% { transform: scale(1) translateX(0); }
      50% { transform: scale(1.05) translateX(-8px); }
      100% { transform: scale(1) translateX(0); }
    }

    .motion-overlay {
      position: relative;
      z-index: 1;
      height: 100%;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .motion-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      background: rgba(7, 8, 14, 0.72);
      border: 1px solid rgba(129, 140, 248, 0.4);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 8px var(--accent-2);
    }

    .dock-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 32px;
      padding: 0;
      border: none;
      background: transparent;
      box-shadow: none;
      color: #fff;
      cursor: pointer;
      transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
    }

    .dock-trigger:hover {
      transform: scale(1.08);
    }

    .dock-dots, .dock-lines {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: all var(--dur) var(--ease);
    }

    

    .dock-lines {
      flex-direction: column;
      gap: 3.5px;
    }

    .dock-lines i {
      width: 16px;
      height: 2px;
      border-radius: 2px;
      background: #fff;
      display: block;
      transition: all var(--dur) var(--ease);
    }

    .dock-trigger.is-open .dock-dots,
    .dock-trigger.is-open .dock-lines i:not(.line-zero) {
      opacity: 0;
      width: 0;
      margin: 0;
      transform: scaleX(0);
    }

    .dock-trigger.is-open .dock-lines { gap: 0; }

    .dock-trigger.is-open .dock-lines i.line-zero {
      width: 22px;
      height: 2.5px;
      background: #fff;
      box-shadow: 0 0 10px var(--accent-2);
    }

    .motion-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.76rem;
      color: #e2e8f0;
      background: rgba(7, 8, 14, 0.68);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* SECTION DRAWER WITH ~280ms OPEN / CLOSE MOTION */
    .section-drawer {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transform: translateY(-8px) scale(0.985);
      pointer-events: none;
      transition:
        max-height var(--dur) var(--ease),
        opacity var(--dur) var(--ease),
        transform var(--dur) var(--ease);
    }

    .section-drawer.open {
      max-height: 920px;
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .drawer-inner {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sec-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 11px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 180ms var(--ease);
    }

    .sec-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(129, 140, 248, 0.25);
    }

    .sec-btn.active {
      color: #fff;
      background: linear-gradient(90deg, rgba(124, 92, 255, 0.24), rgba(34, 211, 238, 0.08));
      border-color: rgba(129, 140, 248, 0.55);
      box-shadow: 0 0 18px rgba(124, 92, 255, 0.16);
    }

    .sec-num {
      font-size: 0.75rem;
      color: var(--accent-2);
      font-weight: 700;
    }

    /* RIGHT WORKSPACE: PERSISTENT PORTRAIT THUMBNAIL + TOP CLOSE BUTTON + ACTIVE PANEL */
    .workspace {
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-width: 0;
    }

    .topbar {
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .topbar h1 { margin: 0; font-size: 1.2rem; letter-spacing: -0.02em; }
    .topbar p { margin: 2px 0 0; font-size: 0.84rem; color: var(--muted); }

    .btn-grad {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid rgba(165, 180, 252, 0.55);
      background: linear-gradient(135deg, #7c5cff, #5642e6);
      color: #fff;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 180ms var(--ease), box-shadow 180ms var(--ease);
    }

    .btn-grad:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(124, 92, 255, 0.36);
    }

    /* Layering so portrait thumbnail stays visible behind/beside active section panel */
    .stage-arena {
      position: relative;
      display: grid;
      grid-template-columns: 236px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
      transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
    }

    .stage-arena.closing {
      opacity: 0;
      transform: translateY(8px) scale(0.985);
    }

    .portrait-showcase {
      position: sticky;
      top: 22px;
      z-index: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .portrait-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      border-radius: 13px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 22%, rgba(124, 92, 255, 0.38), rgba(10, 13, 24, 0.96));
      border: 1px solid rgba(129, 140, 248, 0.55);
      box-shadow: 0 0 28px rgba(124, 92, 255, 0.24);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
    }

    .portrait-motion-layer {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(124, 92, 255, 0.16), transparent 45%, rgba(34, 211, 238, 0.14)),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 20px);
      animation: portraitPulse 5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes portraitPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .portrait-top-bar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .portrait-badge {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(7, 8, 14, 0.82);
      border: 1px solid rgba(34, 211, 238, 0.45);
      color: var(--accent-2);
    }

    .portrait-close-btn {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(9, 11, 19, 0.86);
      color: #fff;
      font-size: 0.9rem;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all 180ms var(--ease);
    }

    .portrait-close-btn:hover {
      border-color: var(--accent-2);
      background: rgba(124, 92, 255, 0.35);
      transform: scale(1.06);
    }

    .portrait-meta {
      position: relative;
      z-index: 2;
      background: rgba(7, 8, 14, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 0.76rem;
    }

    .active-page-card {
      position: relative;
      z-index: 2;
      padding: 20px;
      border-color: rgba(129, 140, 248, 0.48);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.52), 0 0 28px rgba(124, 92, 255, 0.16);
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .active-page-card.entering {
      opacity: 0;
      transform: translateY(10px) scale(0.988);
    }

    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .page-head h2 { margin: 0; font-size: 1.08rem; }

    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

    .sub-box {
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(9, 11, 19, 0.72);
    }

    .sub-box h3 { margin: 0 0 8px; font-size: 0.9rem; }
    .sub-box p { margin: 0; font-size: 0.82rem; color: var(--muted); }

    .cap-list {
      margin: 8px 0 0;
      padding-left: 16px;
      font-size: 0.79rem;
      color: var(--muted);
      display: grid;
      gap: 4px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .field label { font-size: 0.78rem; color: var(--muted); }

    input, select, textarea {
      width: 100%;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #090b13;
      color: var(--text);
      font-size: 0.85rem;
    }

    .project-list { display: flex; flex-direction: column; gap: 8px; }
    .project-item {
      padding: 11px 13px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: rgba(9, 11, 19, 0.7);
      font-size: 0.84rem;
    }

    @media (max-width: 1020px) {
      .shell { grid-template-columns: 1fr; }
      .left-rail, .portrait-showcase { position: static; }
      .stage-arena { grid-template-columns: 1fr; }
      .portrait-frame { max-width: 240px; margin: 0 auto; }
    }

    @media (max-width: 720px) {
      .grid-3, .grid-2 { grid-template-columns: 1fr; }
    }
  </style>

      function setDrawerOpen(isOpen) {
        drawer.classList.toggle("open", isOpen);

        document.body.classList.toggle("bg-blurred", isOpen);
        panel.classList.toggle("section-lit", isOpen);
        const lbl = document.getElementById("motionLabel");
        if (lbl) lbl.textContent = isOpen ? "Line 0 ? Drawer Open" : "Tap trigger for sections";
      }

      function activateSection(key) {
        const sec = sections[key] || sections.overview;
        secButtons.forEach(b => b.classList.toggle("active", b.dataset.sec === key));

        document.getElementById("topTitle").textContent = sec.title;
        document.getElementById("topSub").textContent = sec.sub;
        document.getElementById("panelHeading").textContent = sec.title;
        document.getElementById("portraitTag").textContent = `PORTRAIT ? ${sec.num}`;
        document.getElementById("portraitTitle").textContent = sec.title;

        panel.classList.add("entering");
        setTimeout(() => {
          document.getElementById("panelBody").innerHTML = sec.render();
          panel.classList.remove("entering");
        }, 90);
      }

      function closeWithMotion() {
        setDrawerOpen(false);
        arena.classList.add("closing");
        setTimeout(() => {
          activateSection("overview");
          arena.classList.remove("closing");
        }, 220);
      }

      trigger.addEventListener("click", () => {
        setDrawerOpen(!drawer.classList.contains("open"));
      });

      secButtons.forEach(btn => {
        btn.addEventListener("click", () => {
          activateSection(btn.dataset.sec);
          setDrawerOpen(false);
        });
      });

      openStudioBtn.addEventListener("click", () => {
        activateSection("studio");
        setDrawerOpen(false);
      });

      closeBtn.addEventListener("click", closeWithMotion);

      async function syncProjects() {
        try {
          const res = await fetch("/api/projects", { credentials: "include" });
          if (!res.ok) return;
          const data = await res.json();
          projectsCache = Array.isArray(data) ? data : (data.projects || []);
          const activeKey = document.querySelector(".sec-btn.active")?.dataset.sec || "overview";
          if (activeKey === "overview" || activeKey === "studio") {
            document.getElementById("panelBody").innerHTML = sections[activeKey].render();
          }
        } catch (_) {}
      }

      activateSection("overview");
      syncProjects();
    })();
  </script>

      "#sectionDrawer a",
      ".left-rail button[data-section]",
      ".left-rail .nav-item",
      "[data-tab]"
    ];
    const items = document.querySelectorAll(selectors.join(", "));
    let idx = 0;
    items.forEach((el) => {
      if (el.id === "dockMenuTrigger" || el.querySelector(".cos-sec-icon")) return;
      const svg = window.COS_SECTION_ICONS[idx % window.COS_SECTION_ICONS.length];
      const badge = document.createElement("span");
      badge.className = "cos-sec-icon";
      badge.setAttribute("aria-hidden", "true");
      badge.innerHTML = svg;
      el.prepend(badge);
      idx++;
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", attachIcons);
  } else {
    attachIcons();
  }
})();
</script>

</body>
</html>

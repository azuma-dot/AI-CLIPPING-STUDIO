<script id="cos-caption-title-lab-script">
(function () {
  window.__cosCapLabLockedOpen = false;
  let cachedCapBox = null;

  function getStudioState() {
    try { return JSON.parse(localStorage.getItem("cos_studio_state_v2") || "{}"); } catch (_) { return {}; }
  }

  function setStudioState(patch) {
    try {
      const next = Object.assign({}, getStudioState(), patch);
      localStorage.setItem("cos_studio_state_v2", JSON.stringify(next));
    } catch (_) {}
  }

  function getActiveProjectId() {
    const sel = document.getElementById("cosCtxProjectSelect");
    if (sel && sel.value && sel.value !== "undefined") return sel.value;
    const st = getStudioState();
    if (st.activeProjectId && st.activeProjectId !== "undefined") return String(st.activeProjectId);
    return "proj-bf2e1fae";
  }

  function getActiveClipFilename() {
    const topSel = document.getElementById("cosCtxClipSelect");
    if (topSel && topSel.value && topSel.value.endsWith(".mp4")) return topSel.value;
    const st = getStudioState();
    return (st.activeClipFilename && st.activeClipFilename.endsWith(".mp4")) ? st.activeClipFilename : "";
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function normalizeLabel(el) {
    return (el.textContent || "")
      .replace(/\bPage\s*\d+\s*of\s*\d+\b/gi, "")
      .replace(/\s+/g, " ")
      .trim()
      .toLowerCase();
  }

  function isCaptionTitleNavLabel(lbl) {
    return /^caption\s*(?:&|and)\s*title\s*lab$/i.test(lbl);
  }

  function getStageElement() {
    const host = document.getElementById("cosStudioArchitecture");
    if (!host) return null;
    return host.querySelector(".cos-tool-stage") || host;
  }

  function hideOtherStagePanelsForCap(stage) {
    if (!stage) return;
    Array.from(stage.children).forEach((ch) => {
      if (
        ch.id === "cosAutoAiBanner" ||
        ch.id === "cosCaptionTitleLabBox" ||
        ch.classList.contains("cos-ai-tab-status-bar") ||
        ch.querySelector("[data-cos-thumb-primary='1']") ||
        ch.querySelector("[data-cos-anim-primary='1']")
      ) {
        return;
      }
      if (ch.style.display !== "none") {
        ch.setAttribute("data-cos-hidden-custom", "1");
        ch.style.display = "none";
      }
    });
  }

  function closeCapLabView(restoreStage) {
    window.__cosCapLabLockedOpen = false;
    cachedCapBox = null;
    document.querySelectorAll("#cosCaptionTitleLabBox").forEach((el) => el.remove());
    if (restoreStage) {
      const stage = getStageElement();
      if (stage) {
        Array.from(stage.children).forEach((ch) => {
          if (ch.hasAttribute("data-cos-hidden-custom")) {
            ch.style.display = "";
            ch.removeAttribute("data-cos-hidden-custom");
          }
        });
      }
    }
  }

  function openCapLabView(navBtn) {
    // Release other custom panel locks cleanly
    window.__cosThumbLockedOpen = false;
    window.__cosThumbOpening = false;
    window.__cosAnimLockedOpen = false;
    window.__cosHookLabLockedOpen = false;
    document.querySelectorAll("#cosThumbnailStudioBox, #cosAnimationsStudioBox, #cosHookLabBox").forEach((el) => el.remove());
    document.querySelectorAll("[data-cos-thumb-primary='1'], [data-cos-anim-primary='1'], .cos-anim-nav-tab").forEach((t) => {
      t.classList.remove("active");
      t.setAttribute("aria-selected", "false");
    });

    window.__cosCapLabLockedOpen = true;

    const stage = getStageElement();
    if (!stage) return;

    if (navBtn) {
      document.querySelectorAll("#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a").forEach((b) => {
        if (b !== navBtn) b.classList.remove("active");
      });
      navBtn.classList.add("active");
    }

    hideOtherStagePanelsForCap(stage);

    const pid = getActiveProjectId();
    const preferredFn = getActiveClipFilename();

    const statusBar = stage.querySelector(".cos-ai-tab-status-bar");
    if (statusBar) {
      statusBar.innerHTML = `
        <span>Section: <strong>Optimization</strong> &bull; Active Tool: <strong>Caption &amp; Title Lab</strong></span>
        <span>Project: <strong>${escapeHtml(pid)}</strong>${preferredFn ? ` &bull; Clip: <strong>${escapeHtml(preferredFn)}</strong>` : ""}</span>
      `;
    }

    const existing = document.getElementById("cosCaptionTitleLabBox");
    if (existing) {
      existing.style.display = "";
      return;
    }

    const box = document.createElement("div");
    box.id = "cosCaptionTitleLabBox";
    box.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;">
        <div>
          <div style="font-size:11.5px;font-weight:700;color:#38bdf8;text-transform:uppercase;letter-spacing:0.04em;">
            Optimization &bull; 2. Caption &amp; Title Lab
          </div>
          <h2 style="margin:2px 0 4px 0;font-size:20px;font-weight:800;color:#ffffff;">AI Viral Titles, Social Descriptions &amp; Kinetic Subtitles</h2>
          <div style="font-size:12.5px;color:#94a3b8;">Generate high-CTR titles, post descriptions, and hashtags?then edit timed captions and burn styled subtitles or export .SRT.</div>
        </div>
      </div>

      <div class="cos-ctl-summary-bar">
        <div data-role="summary-text" style="font-size:12px;color:#e2e8f0;">
          Extracting timed speech segments &amp; generating title/caption copy...
        </div>
        <button type="button" data-role="copy-all-btn" class="cos-ctl-copy-btn" style="padding:6px 11px;font-size:11px;background:#0ea5e9;color:#082f49;font-weight:800;">
          Copy Full Publish Pack
        </button>
      </div>

      <div class="cos-ctl-layout">
        <div class="cos-ctl-preview-card">
          <div class="cos-ctl-video-wrap">
            <video data-role="preview-video" controls muted loop playsinline></video>
            <div class="cos-ctl-live-sub" data-role="live-sub">WATCH THIS CLOSELY BEFORE YOU SCROLL</div>
          </div>
          <div style="font-size:11px;color:#94a3b8;text-align:center;">
            Live Styled Caption Preview
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;">
            <button type="button" data-role="export-srt-btn" class="cos-ctl-copy-btn" style="padding:8px;text-align:center;font-size:11px;">
              Export .SRT File
            </button>
            <a data-role="download-link" href="#" download style="display:none;padding:8px;border-radius:7px;background:#10b981;color:#022c22;font-size:11px;font-weight:800;text-align:center;text-decoration:none;">
              Download MP4
            </a>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:12px;">
          <div>
            <div style="font-size:11.5px;font-weight:700;color:#cbd5e1;margin-bottom:4px;">1. Source Clip</div>
            <select data-role="clip-sel" class="cos-ctl-select">
              <option value="${escapeHtml(preferredFn)}">${escapeHtml(preferredFn || (pid + ".mp4"))}</option>
            </select>
          </div>

          <div>
            <div style="font-size:11.5px;font-weight:700;color:#6ee7b7;margin-bottom:5px;">
              2. High-CTR Video Titles (Click Copy on Any Formula)
            </div>
            <div class="cos-ctl-titles-grid" data-role="titles-grid"></div>
          </div>

          <div style="padding:10px 12px;border-radius:11px;background:rgba(10,14,28,0.76);border:1px solid rgba(56,189,248,0.28);display:flex;flex-direction:column;gap:7px;">
            <div style="font-size:11px;font-weight:800;color:#38bdf8;text-transform:uppercase;letter-spacing:0.04em;">
              3. Social Description, Pinned Comment &amp; Hashtags
            </div>
            <div style="display:flex;gap:6px;align-items:flex-start;">
              <textarea data-role="short-cap" class="cos-ctl-textarea" rows="2"></textarea>
              <button type="button" class="cos-ctl-copy-btn" data-copy="short-cap">Copy</button>
            </div>
            <div style="display:flex;gap:6px;align-items:center;">
              <input type="text" data-role="pin-comment" class="cos-ctl-input">
              <button type="button" class="cos-ctl-copy-btn" data-copy="pin-comment">Copy</button>
            </div>
            <div style="display:flex;gap:6px;align-items:center;">
              <input type="text" data-role="hashtags" class="cos-ctl-input">
              <button type="button" class="cos-ctl-copy-btn" data-copy="hashtags">Copy</button>
            </div>
          </div>

          <div class="cos-ctl-row-3">
            <div>
              <label style="display:block;font-size:11px;font-weight:700;color:#cbd5e1;margin-bottom:3px;">4. Subtitle Visual Style</label>
              <select data-role="style-sel" class="cos-ctl-select">
                <option value="hormozi_bold" selected>Hormozi Viral Yellow</option>
                <option value="glass_pill">Clean Dark Glass Pill</option>
                <option value="neon_cyan">Neon Cyan Spotlight</option>
                <option value="minimal_clean">Minimal Clean White</option>
              </select>
            </div>
            <div>
              <label style="display:block;font-size:11px;font-weight:700;color:#cbd5e1;margin-bottom:3px;">Screen Position</label>
              <select data-role="pos-sel" class="cos-ctl-select">
                <option value="center_bottom" selected>Center-Bottom (Shorts Safe)</option>
                <option value="lower_third">Lower Third</option>
                <option value="upper_mid">Upper-Middle</option>
              </select>
            </div>
            <div>
              <label style="display:block;font-size:11px;font-weight:700;color:#cbd5e1;margin-bottom:3px;">Text Casing</label>
              <select data-role="case-sel" class="cos-ctl-select">
                <option value="upper" selected>UPPERCASE PUNCH</option>
                <option value="title">Title Case</option>
                <option value="natural">Natural Transcript</option>
              </select>
            </div>
          </div>

          <div>
            <div style="font-size:11.5px;font-weight:700;color:#cbd5e1;margin-bottom:5px;">
              5. Edit Timed Captions Before Burning
            </div>
            <div class="cos-ctl-seg-list" data-role="seg-list"></div>
          </div>

          <button type="button" class="cos-ctl-render-btn" data-role="render-btn">
            Burn Styled Captions Into Clip (MP4 + .SRT)
          </button>

          <div data-role="status-box" style="padding:9px 11px;border-radius:9px;background:rgba(10,14,28,0.75);border:1px solid rgba(56,189,248,0.28);font-size:12px;color:#cbd5e1;">
            Caption &amp; Title Lab ready for project <strong>${escapeHtml(pid)}</strong>.
          </div>
        </div>
      </div>
    `;

    stage.appendChild(box);
    cachedCapBox = box;

    const q = (sel) => box.querySelector(sel);
    const summaryEl = q("[data-role='summary-text']");
    const copyAllBtn = q("[data-role='copy-all-btn']");
    const videoEl = q("[data-role='preview-video']");
    const liveSubEl = q("[data-role='live-sub']");
    const exportSrtBtn = q("[data-role='export-srt-btn']");
    const dlLink = q("[data-role='download-link']");
    const clipSel = q("[data-role='clip-sel']");
    const titlesGrid = q("[data-role='titles-grid']");
    const shortCapInp = q("[data-role='short-cap']");
    const pinCommentInp = q("[data-role='pin-comment']");
    const hashtagsInp = q("[data-role='hashtags']");
    const styleSel = q("[data-role='style-sel']");
    const posSel = q("[data-role='pos-sel']");
    const caseSel = q("[data-role='case-sel']");
    const segListEl = q("[data-role='seg-list']");
    const renderBtn = q("[data-role='render-btn']");
    const statusBox = q("[data-role='status-box']");

    let currentSegments = [];
    let latestTitles = [];

    function applyCaseFormat(txt) {
      const m = caseSel.value;
      if (m === "upper") return txt.toUpperCase();
      if (m === "title") return txt.replace(/\b\w/g, (c) => c.toUpperCase());
      return txt;
    }

    function syncLiveSubtitleStyle() {
      const st = styleSel.value;
      const pos = posSel.value;
      const firstTxt = (currentSegments[0] && currentSegments[0].text) ? currentSegments[0].text : "Watch this closely before you scroll";
      liveSubEl.textContent = applyCaseFormat(firstTxt);

      liveSubEl.style.bottom = pos === "center_bottom" ? "24%" : (pos === "lower_third" ? "11%" : "auto");
      liveSubEl.style.top = pos === "upper_mid" ? "16%" : "auto";

      if (st === "glass_pill") {
        liveSubEl.style.fontFamily = "Arial, sans-serif";
        liveSubEl.style.color = "#ffffff";
        liveSubEl.style.background = "rgba(15, 23, 42, 0.86)";
        liveSubEl.style.textShadow = "none";
      } else if (st === "neon_cyan") {
        liveSubEl.style.fontFamily = "Impact, 'Arial Black', sans-serif";
        liveSubEl.style.color = "#38bdf8";
        liveSubEl.style.background = "transparent";
        liveSubEl.style.textShadow = "0 2px 6px rgba(0,0,0,0.95), 0 0 4px #000";
      } else if (st === "minimal_clean") {
        liveSubEl.style.fontFamily = "'Trebuchet MS', sans-serif";
        liveSubEl.style.color = "#ffffff";
        liveSubEl.style.background = "rgba(0,0,0,0.45)";
        liveSubEl.style.textShadow = "0 1px 4px #000";
      } else {
        liveSubEl.style.fontFamily = "Impact, 'Arial Black', sans-serif";
        liveSubEl.style.color = "#facc15";
        liveSubEl.style.background = "transparent";
        liveSubEl.style.textShadow = "0 2px 6px rgba(0,0,0,0.95), 0 0 4px #000";
      }
    }

    function renderSegmentInputs() {
      segListEl.innerHTML = currentSegments.map((seg, i) => `
        <div class="cos-ctl-seg-row">
          <span style="font-size:10.5px;color:#94a3b8;font-family:monospace;">${Number(seg.start).toFixed(1)}s?${Number(seg.end).toFixed(1)}s</span>
          <input type="text" class="cos-ctl-input" data-seg-idx="${i}" value="${escapeHtml(seg.text)}">
        </div>
      `).join("");

      segListEl.querySelectorAll("input[data-seg-idx]").forEach((inp) => {
        inp.addEventListener("input", () => {
          const idx = Number(inp.getAttribute("data-seg-idx") || 0);
          if (currentSegments[idx]) {
            currentSegments[idx].text = inp.value;
            if (idx === 0) syncLiveSubtitleStyle();
          }
        });
      });
    }

    function renderTitleCards() {
      titlesGrid.innerHTML = latestTitles.map((t, idx) => `
        <div class="cos-ctl-title-card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
            <span style="font-size:10px;font-weight:800;color:#38bdf8;text-transform:uppercase;">${escapeHtml(t.formula)}</span>
            <span style="font-size:10px;font-weight:800;color:#6ee7b7;">${escapeHtml(t.ctr)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
            <span style="font-size:11.5px;font-weight:800;color:#ffffff;">${escapeHtml(t.text)}</span>
            <button type="button" class="cos-ctl-copy-btn" data-title-idx="${idx}">Copy</button>
          </div>
        </div>
      `).join("");

      titlesGrid.querySelectorAll("button[data-title-idx]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.getAttribute("data-title-idx") || 0);
          const item = latestTitles[idx];
          if (!item) return;
          navigator.clipboard?.writeText(item.text).catch(() => {});
          const old = btn.textContent;
          btn.textContent = "Copied!";
          setTimeout(() => { btn.textContent = old; }, 1200);
        });
      });
    }

    async function analyzeClip(fn) {
      summaryEl.textContent = "Analyzing transcript, pacing & generating high-CTR titles...";
      const resp = await fetch("/api/cos-caption-lab-analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ project_id: pid, clip_filename: fn })
      }).then((r) => r.json()).catch(() => ({}));

      if (resp && resp.ok) {
        summaryEl.innerHTML = `Niche: <strong style="color:#6ee7b7;">${escapeHtml(resp.niche)}</strong> &bull; <strong>${resp.word_count}</strong> words (${resp.wpm} WPM) &bull; <strong>${(resp.segments || []).length}</strong> timed caption lines`;
        videoEl.src = resp.video_url;
        videoEl.load();
        liveSubEl.style.display = "block";

        currentSegments = Array.isArray(resp.segments) ? resp.segments : [];
        latestTitles = Array.isArray(resp.titles) ? resp.titles : [];
        shortCapInp.value = resp.short_caption || "";
        pinCommentInp.value = resp.pinned_comment || "";
        hashtagsInp.value = resp.hashtags || "";

        renderTitleCards();
        renderSegmentInputs();
        syncLiveSubtitleStyle();
      } else {
        summaryEl.textContent = resp.detail || "Select a rendered clip to load captions and titles.";
      }
    }

    box.querySelectorAll("[data-copy]").forEach((cBtn) => {
      cBtn.addEventListener("click", () => {
        const role = cBtn.getAttribute("data-copy");
        const el = q(`[data-role='${role}']`);
        if (!el) return;
        el.select();
        navigator.clipboard?.writeText(el.value).catch(() => {});
        const old = cBtn.textContent;
        cBtn.textContent = "Copied!";
        setTimeout(() => { cBtn.textContent = old; }, 1200);
      });
    });

    copyAllBtn.addEventListener("click", () => {
      const topTitle = latestTitles[0] ? latestTitles[0].text : "";
      const pack = [
        `TITLE: ${topTitle}`,
        "",
        `DESCRIPTION:\n${shortCapInp.value}`,
        "",
        `PINNED COMMENT:\n${pinCommentInp.value}`,
        "",
        `HASHTAGS:\n${hashtagsInp.value}`
      ].join("\n");
      navigator.clipboard?.writeText(pack).catch(() => {});
      const old = copyAllBtn.textContent;
      copyAllBtn.textContent = "Full Pack Copied!";
      setTimeout(() => { copyAllBtn.textContent = old; }, 1400);
    });

    [styleSel, posSel, caseSel].forEach((el) => el.addEventListener("change", syncLiveSubtitleStyle));

    clipSel.addEventListener("change", () => {
      setStudioState({ activeClipFilename: clipSel.value });
      analyzeClip(clipSel.value);
    });

    async function runRender(srtOnly) {
      renderBtn.disabled = true;
      renderBtn.textContent = srtOnly ? "Exporting .SRT..." : "Burning Styled Captions into MP4...";
      statusBox.textContent = srtOnly ? "Generating clean .SRT subtitle file..." : "Rendering kinetic captions onto your clip...";

      const resp = await fetch("/api/cos-caption-lab-render", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          project_id: pid,
          clip_filename: clipSel.value,
          segments: currentSegments,
          style_id: styleSel.value,
          pos_id: posSel.value,
          case_mode: caseSel.value,
          export_srt_only: srtOnly
        })
      }).then((r) => r.json()).catch((err) => ({ detail: String(err) }));

      renderBtn.disabled = false;
      renderBtn.textContent = "Burn Styled Captions Into Clip (MP4 + .SRT)";

      if (resp && resp.ok) {
        if (srtOnly && resp.srt) {
          const a = document.createElement("a");
          a.href = resp.srt.url;
          a.download = resp.srt.filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          statusBox.innerHTML = `<strong style="color:#6ee7b7;">Exported .SRT!</strong> Saved <strong>${escapeHtml(resp.srt.filename)}</strong> (${resp.srt.size_kb} KB).`;
        } else if (resp.clip) {
          setStudioState({ activeClipFilename: resp.clip.filename });
          liveSubEl.style.display = "none";
          videoEl.src = resp.clip.url;
          videoEl.load();
          videoEl.play().catch(() => {});
          dlLink.href = resp.clip.url;
          dlLink.download = resp.clip.filename;
          dlLink.style.display = "block";
          statusBox.innerHTML = `<strong style="color:#6ee7b7;">Captioned Clip Rendered!</strong> Saved <strong>${escapeHtml(resp.clip.filename)}</strong> (${resp.clip.size_mb} MB) + <strong>${escapeHtml(resp.srt.filename)}</strong>.`;
        }
      } else {
        statusBox.textContent = resp.detail || "Could not render captions.";
      }
    }

    exportSrtBtn.addEventListener("click", () => runRender(true));
    renderBtn.addEventListener("click", () => runRender(false));

    fetch(`/api/cos-output-clips/${encodeURIComponent(pid)}`)
      .then((r) => r.json())
      .then((data) => {
        const clips = Array.isArray(data.clips) ? data.clips : [];
        if (clips.length) {
          const active = clips.find((c) => c.filename === preferredFn) || clips[0];
          clipSel.innerHTML = clips.map((c) =>
            `<option value="${escapeHtml(c.filename)}" ${c.filename === active.filename ? "selected" : ""}>${escapeHtml(c.title)} (${c.size_mb} MB)</option>`
          ).join("");
          analyzeClip(active.filename);
        } else {
          analyzeClip("");
        }
      })
      .catch(() => analyzeClip(preferredFn));
  }

  function findCapLabNavTarget(target) {
    if (!target || target.closest("#cosCaptionTitleLabBox")) return null;
    return Array.from(document.querySelectorAll("#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a, #cosStudioArchitecture button, #cosStudioArchitecture a, [role='tab'], .cos-subtool-btn, .cos-tab-btn"))
      .find((el) => el.contains(target) && isCaptionTitleNavLabel(normalizeLabel(el))) || null;
  }

  ["pointerdown", "click"].forEach((evtType) => {
    document.addEventListener(evtType, function (e) {
      const capNav = findCapLabNavTarget(e.target);
      if (capNav) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        openCapLabView(capNav);
        return;
      }

      if (evtType !== "click" || !e.isTrusted) return;

      const otherNav = e.target.closest(
        "#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a, #cosStudioArchitecture button, #cosStudioArchitecture a, [role='tab'], [data-tool], [data-page], [data-subtool], .cos-subtool-btn, .cos-tab-btn"
      );
      if (otherNav && !otherNav.closest("#cosCaptionTitleLabBox") && !otherNav.closest("#cosAutoAiBanner")) {
        const lbl = normalizeLabel(otherNav);
        const isOtherCustom = /^thumbnail\s*designer$/i.test(lbl) || /^animations?$/i.test(lbl) || /^hook\s*laboratory$/i.test(lbl) || /^caption\s*(?:&|and)\s*title\s*lab$/i.test(lbl) || /^clip\s*quality\s*inspect[eo]r$/i.test(lbl) || /^a\s*\/?\s*b\s*testing\s*lab$/i.test(lbl) || /^viral\s*score\s*analysis$/i.test(lbl) || /^export\s*center$/i.test(lbl);
        closeCapLabView(!isOtherCustom);
      }
    }, true);
  });

  setTimeout(() => {
    const activeCapBtn = Array.from(document.querySelectorAll("#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a"))
      .find((el) => isCaptionTitleNavLabel(normalizeLabel(el)) && (el.classList.contains("active") || el.getAttribute("aria-selected") === "true"));
    if (activeCapBtn) {
      openCapLabView(activeCapBtn);
    }
  }, 350);

  setInterval(() => {
    if (window.__cosCapLabLockedOpen) {
      const stage = getStageElement();
      if (stage) {
        hideOtherStagePanelsForCap(stage);
        if (!document.getElementById("cosCaptionTitleLabBox") && cachedCapBox) {
          stage.appendChild(cachedCapBox);
        }
      }
    }
  }, 250);
})();
</script>

<script id="cos-clip-quality-inspector-script">
(function () {
  window.__cosCqiLockedOpen = false;
  let cachedCqiBox = null;

  function getStudioState() {
    try { return JSON.parse(localStorage.getItem("cos_studio_state_v2") || "{}"); } catch (_) { return {}; }
  }

  function setStudioState(patch) {
    try {
      const next = Object.assign({}, getStudioState(), patch);
      localStorage.setItem("cos_studio_state_v2", JSON.stringify(next));
    } catch (_) {}
  }

  function getActiveProjectId() {
    const sel = document.getElementById("cosCtxProjectSelect");
    if (sel && sel.value && sel.value !== "undefined") return sel.value;
    const st = getStudioState();
    if (st.activeProjectId && st.activeProjectId !== "undefined") return String(st.activeProjectId);
    return "proj-bf2e1fae";
  }

  function getActiveClipFilename() {
    const topSel = document.getElementById("cosCtxClipSelect");
    if (topSel && topSel.value && topSel.value.endsWith(".mp4")) return topSel.value;
    const st = getStudioState();
    return (st.activeClipFilename && st.activeClipFilename.endsWith(".mp4")) ? st.activeClipFilename : "";
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function normalizeLabel(el) {
    return (el.textContent || "")
      .replace(/\bPage\s*\d+\s*of\s*\d+\b/gi, "")
      .replace(/\s+/g, " ")
      .trim()
      .toLowerCase();
  }

  function isClipQualityNavLabel(lbl) {
    return /^clip\s*quality\s*inspect[eo]r$/i.test(lbl);
  }

  function getStageElement() {
    const host = document.getElementById("cosStudioArchitecture");
    if (!host) return null;
    return host.querySelector(".cos-tool-stage") || host;
  }

  function hideOtherStagePanelsForCqi(stage) {
    if (!stage) return;
    Array.from(stage.children).forEach((ch) => {
      if (
        ch.id === "cosAutoAiBanner" ||
        ch.id === "cosClipQualityInspectorBox" ||
        ch.classList.contains("cos-ai-tab-status-bar") ||
        ch.querySelector("[data-cos-thumb-primary='1']") ||
        ch.querySelector("[data-cos-anim-primary='1']")
      ) {
        return;
      }
      if (ch.style.display !== "none") {
        ch.setAttribute("data-cos-hidden-custom", "1");
        ch.style.display = "none";
      }
    });
  }

  function closeCqiView(restoreStage) {
    window.__cosCqiLockedOpen = false;
    cachedCqiBox = null;
    document.querySelectorAll("#cosClipQualityInspectorBox").forEach((el) => el.remove());
    if (restoreStage) {
      const stage = getStageElement();
      if (stage) {
        Array.from(stage.children).forEach((ch) => {
          if (ch.hasAttribute("data-cos-hidden-custom")) {
            ch.style.display = "";
            ch.removeAttribute("data-cos-hidden-custom");
          }
        });
      }
    }
  }

  function openCqiView(navBtn) {
    // Release other custom panel locks cleanly
    window.__cosThumbLockedOpen = false;
    window.__cosThumbOpening = false;
    window.__cosAnimLockedOpen = false;
    window.__cosHookLabLockedOpen = false;
    window.__cosCapLabLockedOpen = false;
    document.querySelectorAll("#cosThumbnailStudioBox, #cosAnimationsStudioBox, #cosHookLabBox, #cosCaptionTitleLabBox").forEach((el) => el.remove());
    document.querySelectorAll("[data-cos-thumb-primary='1'], [data-cos-anim-primary='1'], .cos-anim-nav-tab").forEach((t) => {
      t.classList.remove("active");
      t.setAttribute("aria-selected", "false");
    });

    window.__cosCqiLockedOpen = true;

    const stage = getStageElement();
    if (!stage) return;

    if (navBtn) {
      document.querySelectorAll("#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a").forEach((b) => {
        if (b !== navBtn) b.classList.remove("active");
      });
      navBtn.classList.add("active");
    }

    hideOtherStagePanelsForCqi(stage);

    const pid = getActiveProjectId();
    const preferredFn = getActiveClipFilename();

    const statusBar = stage.querySelector(".cos-ai-tab-status-bar");
    if (statusBar) {
      statusBar.innerHTML = `
        <span>Section: <strong>Optimization</strong> &bull; Active Tool: <strong>Clip Quality Inspector</strong></span>
        <span>Project: <strong>${escapeHtml(pid)}</strong>${preferredFn ? ` &bull; Clip: <strong>${escapeHtml(preferredFn)}</strong>` : ""}</span>
      `;
    }

    const existing = document.getElementById("cosClipQualityInspectorBox");
    if (existing) {
      existing.style.display = "";
      return;
    }

    const box = document.createElement("div");
    box.id = "cosClipQualityInspectorBox";
    box.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;">
        <div>
          <div style="font-size:11.5px;font-weight:700;color:#6ee7b7;text-transform:uppercase;letter-spacing:0.04em;">
            Optimization &bull; 3. Clip Quality Inspector
          </div>
          <h2 style="margin:2px 0 4px 0;font-size:20px;font-weight:800;color:#ffffff;">Broadcast Technical QC &amp; Auto-Master Inspector</h2>
          <div style="font-size:12.5px;color:#94a3b8;">Inspect resolution, H.264 yuv420p compatibility, -14 LUFS audio loudness, black frames, and visual sharpness?then repair issues in one click.</div>
        </div>
      </div>

      <div class="cos-cqi-header-card">
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="cos-cqi-grade-badge">
            <span style="font-size:20px;" data-role="qc-grade">--</span>
            <span style="font-size:9.5px;" data-role="qc-score">--/100</span>
          </div>
          <div>
            <div style="font-size:13px;font-weight:800;color:#ffffff;" data-role="qc-headline">Running technical stream &amp; frame diagnostics...</div>
            <div style="font-size:11.5px;color:#cbd5e1;margin-top:2px;" data-role="qc-sub">Probing video codec, pixel format, audio peaks, black frames &amp; sharpness...</div>
          </div>
        </div>
        <div style="display:flex;gap:7px;flex-wrap:wrap;">
          <button type="button" data-role="rescan-btn" class="cos-cqi-sec-btn">Re-Inspect Clip</button>
          <a data-role="report-link" href="#" download class="cos-cqi-sec-btn" style="display:none;">Download QC JSON</a>
        </div>
      </div>

      <div class="cos-cqi-grid" data-role="checks-grid"></div>

      <div class="cos-cqi-layout">
        <div class="cos-cqi-preview-card">
          <div class="cos-cqi-video-wrap">
            <video data-role="preview-video" controls playsinline></video>
          </div>
          <div style="font-size:11px;color:#94a3b8;text-align:center;" data-role="preview-meta">
            Active Clip Preview
          </div>
          <a data-role="download-link" href="#" download style="display:none;padding:9px 10px;border-radius:10px;background:#10b981;color:#022c22;font-size:12px;font-weight:800;text-align:center;text-decoration:none;">
            Download QC-Mastered MP4
          </a>
        </div>

        <div style="display:flex;flex-direction:column;gap:12px;">
          <div>
            <div style="font-size:11.5px;font-weight:700;color:#cbd5e1;margin-bottom:4px;">1. Select Clip to Inspect</div>
            <select data-role="clip-sel" class="cos-cqi-select">
              <option value="${escapeHtml(preferredFn)}">${escapeHtml(preferredFn || (pid + ".mp4"))}</option>
            </select>
          </div>

          <div class="cos-cqi-fix-box">
            <div style="font-size:11.5px;font-weight:800;color:#a5b4fc;text-transform:uppercase;letter-spacing:0.04em;">
              2. Automated Broadcast &amp; Social Repair Settings
            </div>
            <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#e2e8f0;cursor:pointer;">
              <input type="checkbox" data-role="fix-audio" checked style="accent-color:#10b981;">
              Normalize Audio Loudness to -14 LUFS + Anti-Clip Limiter
            </label>
            <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#e2e8f0;cursor:pointer;">
              <input type="checkbox" data-role="fix-codec" checked style="accent-color:#10b981;">
              Enforce H.264 (yuv420p) + Even Dimensions + Web Faststart
            </label>
            <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#e2e8f0;cursor:pointer;">
              <input type="checkbox" data-role="fix-clarity" checked style="accent-color:#10b981;">
              Boost Edge Sharpness &amp; Mobile OLED Contrast Balance
            </label>
            <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#e2e8f0;cursor:pointer;">
              <input type="checkbox" data-role="fix-upscale" style="accent-color:#6366f1;">
              Upscale &amp; Pad Sub-1080p Clips to Full 1080p HD
            </label>

            <button type="button" class="cos-cqi-fix-btn" data-role="fix-btn">
              Auto-Repair &amp; Render QC-Mastered Clip
            </button>
          </div>

          <div data-role="status-box" style="padding:9px 11px;border-radius:9px;background:rgba(10,14,28,0.75);border:1px solid rgba(16,185,129,0.28);font-size:12px;color:#cbd5e1;">
            Clip Quality Inspector ready for project <strong>${escapeHtml(pid)}</strong>.
          </div>
        </div>
      </div>
    `;

    stage.appendChild(box);
    cachedCqiBox = box;

    const q = (sel) => box.querySelector(sel);
    const gradeEl = q("[data-role='qc-grade']");
    const scoreEl = q("[data-role='qc-score']");
    const headlineEl = q("[data-role='qc-headline']");
    const subEl = q("[data-role='qc-sub']");
    const rescanBtn = q("[data-role='rescan-btn']");
    const reportLink = q("[data-role='report-link']");
    const checksGrid = q("[data-role='checks-grid']");
    const videoEl = q("[data-role='preview-video']");
    const previewMeta = q("[data-role='preview-meta']");
    const dlLink = q("[data-role='download-link']");
    const clipSel = q("[data-role='clip-sel']");
    const fixAudioChk = q("[data-role='fix-audio']");
    const fixCodecChk = q("[data-role='fix-codec']");
    const fixClarityChk = q("[data-role='fix-clarity']");
    const fixUpscaleChk = q("[data-role='fix-upscale']");
    const fixBtn = q("[data-role='fix-btn']");
    const statusBox = q("[data-role='status-box']");

    function renderDiagnosticCards(checks) {
      checksGrid.innerHTML = (checks || []).map((c) => {
        const badgeColor = c.status === "pass" ? "#6ee7b7" : (c.status === "warn" ? "#fbbf24" : "#fda4af");
        const borderCol = c.status === "pass" ? "rgba(16, 185, 129, 0.35)" : (c.status === "warn" ? "rgba(251, 191, 36, 0.38)" : "rgba(244, 63, 94, 0.45)");
        return `
          <div class="cos-cqi-card" style="border-color:${borderCol};">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
              <span style="font-size:10px;font-weight:900;color:${badgeColor};letter-spacing:0.03em;">${escapeHtml(c.badge)}</span>
            </div>
            <div style="font-size:12px;font-weight:800;color:#ffffff;">${escapeHtml(c.title)}</div>
            <div style="font-size:10.5px;color:#94a3b8;line-height:1.35;">${escapeHtml(c.detail)}</div>
          </div>
        `;
      }).join("");
    }

    async function inspectClip(fn) {
      headlineEl.textContent = "Inspecting video stream, audio loudness, black frames & sharpness...";
      const resp = await fetch("/api/cos-quality-inspector-scan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ project_id: pid, clip_filename: fn })
      }).then((r) => r.json()).catch(() => ({}));

      if (resp && resp.ok) {
        gradeEl.textContent = resp.grade || "A";
        scoreEl.textContent = `${resp.score || 90}/100`;
        const m = resp.metrics || {};
        headlineEl.innerHTML = `QC Report: <strong>${escapeHtml(resp.clip_filename)}</strong> ? Grade <strong>${escapeHtml(resp.grade)}</strong> (${resp.score}/100)`;
        subEl.textContent = `${m.width}x${m.height} ? ${m.v_codec.toUpperCase()} (${m.pix_fmt}) ? ${m.fps} fps ? Audio ${Number(m.mean_volume_db || -16).toFixed(1)} dB ? Sharpness ${m.sharpness_score}/100`;
        videoEl.src = resp.video_url;
        videoEl.load();
        previewMeta.textContent = `${resp.clip_filename} (${m.size_mb} MB ? ${m.duration}s)`;

        if (resp.report_url) {
          reportLink.href = resp.report_url;
          reportLink.download = resp.report_filename || "qc_report.json";
          reportLink.style.display = "inline-block";
        }
        renderDiagnosticCards(resp.checks || []);
      } else {
        gradeEl.textContent = "--";
        scoreEl.textContent = "--/100";
        headlineEl.textContent = resp.detail || "Select a rendered clip to run quality inspection.";
      }
    }

    rescanBtn.addEventListener("click", () => inspectClip(clipSel.value));
    clipSel.addEventListener("change", () => {
      setStudioState({ activeClipFilename: clipSel.value });
      inspectClip(clipSel.value);
    });

    fixBtn.addEventListener("click", async () => {
      fixBtn.disabled = true;
      fixBtn.textContent = "Mastering & Repairing Clip...";
      statusBox.textContent = "Applying broadcast -14 LUFS audio normalization, yuv420p encoding & clarity mastering...";

      const resp = await fetch("/api/cos-quality-inspector-fix", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          project_id: pid,
          clip_filename: clipSel.value,
          fix_audio: fixAudioChk.checked,
          fix_codec: fixCodecChk.checked,
          fix_clarity: fixClarityChk.checked,
          fix_upscale_1080: fixUpscaleChk.checked
        })
      }).then((r) => r.json()).catch((err) => ({ detail: String(err) }));

      fixBtn.disabled = false;
      fixBtn.textContent = "Auto-Repair & Render QC-Mastered Clip";

      if (resp && resp.ok && resp.clip) {
        setStudioState({ activeClipFilename: resp.clip.filename });
        gradeEl.textContent = resp.after_grade || "A+";
        scoreEl.textContent = `${resp.after_score}/100`;
        headlineEl.innerHTML = `QC Mastered: <strong>${escapeHtml(resp.clip.filename)}</strong> ? Score improved ${resp.before_score} ? <strong>${resp.after_score}/100</strong>`;
        renderDiagnosticCards(resp.checks || []);

        videoEl.src = resp.clip.url;
        videoEl.load();
        videoEl.play().catch(() => {});
        dlLink.href = resp.clip.url;
        dlLink.download = resp.clip.filename;
        dlLink.style.display = "block";
        statusBox.innerHTML = `<strong style="color:#6ee7b7;">QC Master Complete!</strong> Quality Score boosted <strong>${resp.before_score} ? ${resp.after_score}/100</strong>. Saved <strong>${escapeHtml(resp.clip.filename)}</strong> (${resp.clip.size_mb} MB).`;
      } else {
        statusBox.textContent = resp.detail || "Could not repair clip.";
      }
    });

    fetch(`/api/cos-output-clips/${encodeURIComponent(pid)}`)
      .then((r) => r.json())
      .then((data) => {
        const clips = Array.isArray(data.clips) ? data.clips : [];
        if (clips.length) {
          const active = clips.find((c) => c.filename === preferredFn) || clips[0];
          clipSel.innerHTML = clips.map((c) =>
            `<option value="${escapeHtml(c.filename)}" ${c.filename === active.filename ? "selected" : ""}>${escapeHtml(c.title)} (${c.size_mb} MB)</option>`
          ).join("");
          inspectClip(active.filename);
        } else {
          inspectClip("");
        }
      })
      .catch(() => inspectClip(preferredFn));
  }

  function findCqiNavTarget(target) {
    if (!target || target.closest("#cosClipQualityInspectorBox")) return null;
    return Array.from(document.querySelectorAll("#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a, #cosStudioArchitecture button, #cosStudioArchitecture a, [role='tab'], .cos-subtool-btn, .cos-tab-btn"))
      .find((el) => el.contains(target) && isClipQualityNavLabel(normalizeLabel(el))) || null;
  }

  ["pointerdown", "click"].forEach((evtType) => {
    document.addEventListener(evtType, function (e) {
      const cqiNav = findCqiNavTarget(e.target);
      if (cqiNav) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        openCqiView(cqiNav);
        return;
      }

      if (evtType !== "click" || !e.isTrusted) return;

      const otherNav = e.target.closest(
        "#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a, #cosStudioArchitecture button, #cosStudioArchitecture a, [role='tab'], [data-tool], [data-page], [data-subtool], .cos-subtool-btn, .cos-tab-btn"
      );
      if (otherNav && !otherNav.closest("#cosClipQualityInspectorBox") && !otherNav.closest("#cosAutoAiBanner")) {
        const lbl = normalizeLabel(otherNav);
        const isOtherCustom = /^thumbnail\s*designer$/i.test(lbl) || /^animations?$/i.test(lbl) || /^hook\s*laboratory$/i.test(lbl) || /^caption\s*(?:&|and)\s*title\s*lab$/i.test(lbl) || /^clip\s*quality\s*inspect[eo]r$/i.test(lbl) || /^a\s*\/?\s*b\s*testing\s*lab$/i.test(lbl) || /^viral\s*score\s*analysis$/i.test(lbl) || /^export\s*center$/i.test(lbl);
        closeCqiView(!isOtherCustom);
      }
    }, true);
  });

  setTimeout(() => {
    const activeCqiBtn = Array.from(document.querySelectorAll("#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a"))
      .find((el) => isClipQualityNavLabel(normalizeLabel(el)) && (el.classList.contains("active") || el.getAttribute("aria-selected") === "true"));
    if (activeCqiBtn) {
      openCqiView(activeCqiBtn);
    }
  }, 350);

  setInterval(() => {
    if (window.__cosCqiLockedOpen) {
      const stage = getStageElement();
      if (stage) {
        hideOtherStagePanelsForCqi(stage);
        if (!document.getElementById("cosClipQualityInspectorBox") && cachedCqiBox) {

  }

  function setStudioState(patch) {
    try {
      const next = Object.assign({}, getStudioState(), patch);

  function getActiveProjectId() {
    const sel = document.getElementById("cosCtxProjectSelect");
    if (sel && sel.value && sel.value !== "undefined") return sel.value;

  function getActiveClipFilename() {

      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

      if (stVal === "none") {

      }
      ovBox.style.display = "flex";
      kickEl.textContent = (kickVal || "").trim().toUpperCase();
      kickEl.style.display = kickEl.textContent ? "inline-block" : "none";
      headEl.textContent = (headVal || "").trim().toUpperCase() || "HOOK";
      if (stVal === "red_alert") {
        kickEl.style.background = "#dc2626";
        headEl.style.borderColor = "#ef4444";
        headEl.style.color = "#ffffff";
        headEl.style.background = "rgba(15, 23, 42, 0.92)";
      } else if (stVal === "neon_cyan") {
        kickEl.style.background = "#0ea5e9";
        headEl.style.borderColor = "#38bdf8";
        headEl.style.color = "#38bdf8";
        headEl.style.background = "rgba(8, 16, 32, 0.92)";
      } else if (stVal === "clean_white") {
        kickEl.style.background = "#4f46e5";
        headEl.style.borderColor = "#818cf8";
        headEl.style.color = "#0f172a";
        headEl.style.background = "rgba(255, 255, 255, 0.95)";
      } else {
        kickEl.style.background = "#ef4444";
        headEl.style.borderColor = "#facc15";
        headEl.style.color = "#facc15";
        headEl.style.background = "rgba(9, 13, 26, 0.90)";
      }
    }

    function syncOverlays() {
      paintOverlay(ovA, ovKickA, ovHeadA, kickA.value, headA.value, styleA.value);
      paintOverlay(ovB, ovKickB, ovHeadB, kickB.value, headB.value, styleB.value);
    }

    [headA, kickA, styleA, headB, kickB, styleB].forEach((el) => {
      el.addEventListener("input", syncOverlays);
      el.addEventListener("change", syncOverlays);
    });

    expPresetSel.addEventListener("change", () => {
      const p = expPresetSel.value;
      const isCompare = p === "compare_existing";
      clipBSel.disabled = !isCompare;
      clipBWrap.style.opacity = isCompare ? "1" : "0.55";
      runBtn.textContent = isCompare
        ? "Run Head-to-Head Clip Comparison & Score Winner"
        : "Generate & Score A/B Variants (Render Both MP4s)";

      if (p === "clean_vs_boost") {
        styleA.value = "none";
        motionA.value = "clean";
        trimA.checked = false;
        styleB.value = "none";
        motionB.value = "flash_pop";
        trimB.checked = true;
      } else if (p === "curiosity_vs_warning") {
        headA.value = "WAIT FOR WHAT HAPPENS NEXT";
        kickA.value = "CURIOSITY HOOK";
        styleA.value = "viral_yellow";
        motionA.value = "punch_zoom";
        headB.value = "STOP MAKING THIS COSTLY MISTAKE";
        kickB.value = "WARNING";
        styleB.value = "red_alert";
        motionB.value = "flash_pop";
      } else if (p === "hook_showdown") {
        headA.value = "THE TRUTH NOBODY SHARES";
        kickA.value = "WATCH THIS";
        styleA.value = "viral_yellow";
        motionA.value = "clean";
        headB.value = "3 MISTAKES COSTING YOU RESULTS";
        kickB.value = "STOP SCROLLING";
        styleB.value = "red_alert";
        motionB.value = "flash_pop";
      }
      syncOverlays();
    });

    syncPlayBtn.addEventListener("click", () => {
      vidA.currentTime = 0;
      vidB.currentTime = 0;
      vidA.muted = activeAudioSide !== "A";
      vidB.muted = activeAudioSide !== "B";
      vidA.play().catch(() => {});
      vidB.play().catch(() => {});
    });

    swapAudioBtn.addEventListener("click", () => {
      activeAudioSide = activeAudioSide === "A" ? "B" : "A";
      vidA.muted = activeAudioSide !== "A";
      vidB.muted = activeAudioSide !== "B";
      swapAudioBtn.textContent = `Audio: Variant ${activeAudioSide} Active`;
    });

    promoteBtn.addEventListener("click", () => {
      if (!latestWinnerFilename) return;
      setStudioState({ activeClipFilename: latestWinnerFilename });
      const topSel = document.getElementById("cosCtxClipSelect");
      if (topSel) {
        const opt = Array.from(topSel.options).find((o) => o.value === latestWinnerFilename);
        if (opt) topSel.value = latestWinnerFilename;
      }
      statusBox.innerHTML = `<strong style="color:#6ee7b7;">Winner Promoted!</strong> <strong>${escapeHtml(latestWinnerFilename)}</strong> is now set as the active clip across your studio.`;
    });

    clipASel.addEventListener("change", () => {
      if (!clipASel.value) return;
      const url = `/api/cos-ab-lab-asset/${encodeURIComponent(pid)}/${encodeURIComponent(clipASel.value)}`;
      vidA.src = url;
      vidA.load();
      if (expPresetSel.value !== "compare_existing") {
        vidB.src = url;
        vidB.load();
      }
    });

    clipBSel.addEventListener("change", () => {
      if (!clipBSel.value) return;
      vidB.src = `/api/cos-ab-lab-asset/${encodeURIComponent(pid)}/${encodeURIComponent(clipBSel.value)}`;
      vidB.load();
    });

    runBtn.addEventListener("click", async () => {
      const isCompare = expPresetSel.value === "compare_existing";
      runBtn.disabled = true;
      runBtn.textContent = isCompare ? "Scoring Both Clips..." : "Rendering Variant A & Variant B MP4s...";
      statusBox.textContent = isCompare
        ? "Running head-to-head audio, pacing & hook analysis..."
        : "Encoding Variant A (Control) and Variant B (Challenger) with FFmpeg...";

      const resp = await fetch("/api/cos-ab-lab-render", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          project_id: pid,
          mode: isCompare ? "compare_existing" : "generate",
          clip_a_filename: clipASel.value,
          clip_b_filename: clipBSel.value,
          variant_a: {
            headline: headA.value,
            kicker: kickA.value,
            style_id: styleA.value,
            motion_id: motionA.value,
            trim_silence: trimA.checked
          },
          variant_b: {
            headline: headB.value,
            kicker: kickB.value,
            style_id: styleB.value,
            motion_id: motionB.value,
            trim_silence: trimB.checked
          }
        })
      }).then((r) => r.json()).catch((err) => ({ detail: String(err) }));

      runBtn.disabled = false;
      runBtn.textContent = isCompare
        ? "Run Head-to-Head Clip Comparison & Score Winner"
        : "Generate & Score A/B Variants (Render Both MP4s)";

      if (resp && resp.ok && resp.variant_a && resp.variant_b) {
        const a = resp.variant_a;
        const b = resp.variant_b;
        const win = resp.winner || "B";
        latestWinnerFilename = win === "B" ? b.filename : a.filename;

        cardA.classList.toggle("winner", win === "A");
        cardB.classList.toggle("winner", win === "B");

        badgeA.innerHTML = win === "A"
          ? `<span style="color:#6ee7b7;">? WINNER &bull; ${a.score}/100</span>`
          : `<span style="color:#38bdf8;">Score ${a.score}/100</span>`;
        badgeB.innerHTML = win === "B"
          ? `<span style="color:#6ee7b7;">? WINNER &bull; ${b.score}/100</span>`
          : `<span style="color:#d8b4fe;">Score ${b.score}/100</span>`;

        metricsA.innerHTML = `Est. CTR: <strong style="color:#fff;">${a.est_ctr}%</strong> &bull; 3s Hold: <strong style="color:#fff;">${a.est_hold}%</strong> &bull; ${a.duration}s (${a.size_mb} MB)<br><span style="color:#a5b4fc;">${escapeHtml((a.reasons || []).join(" ? "))}</span>`;
        metricsB.innerHTML = `Est. CTR: <strong style="color:#fff;">${b.est_ctr}%</strong> &bull; 3s Hold: <strong style="color:#fff;">${b.est_hold}%</strong> &bull; ${b.duration}s (${b.size_mb} MB)<br><span style="color:#6ee7b7;">${escapeHtml((b.reasons || []).join(" ? "))}</span>`;

        if (!isCompare) {
          ovA.style.display = "none";
          ovB.style.display = "none";
        }

        vidA.src = a.url;
        vidB.src = b.url;
        vidA.load();
        vidB.load();
        vidA.muted = false;
        vidB.muted = true;
        activeAudioSide = "A";
        swapAudioBtn.textContent = "Audio: Variant A Active";
        vidA.play().catch(() => {});
        vidB.play().catch(() => {});

        dlA.href = a.url;
        dlA.download = a.filename;
        dlA.style.display = "block";
        dlB.href = b.url;
        dlB.download = b.filename;
        dlB.style.display = "block";

        winnerHeadEl.innerHTML = `Predicted Winner: <span style="color:#6ee7b7;">Variant ${win} (${escapeHtml(latestWinnerFilename)})</span> &bull; +${resp.ctr_lift_pct}% Est. CTR Lift`;
        winnerSubEl.textContent = `Confidence: ${resp.confidence_pct}% ? Variant A (${a.score}/100, ${a.est_ctr}% CTR) vs. Variant B (${b.score}/100, ${b.est_ctr}% CTR)`;
        promoteBtn.style.display = "inline-block";

        statusBox.innerHTML = `<strong style="color:#6ee7b7;">A/B Split-Test Ready!</strong> Variant <strong>${win}</strong> wins with <strong>${resp.confidence_pct}%</strong> confidence. Use <strong>Sync Play A &amp; B</strong> above to compare live.`;
      } else {
        statusBox.textContent = resp.detail || "Could not run A/B experiment.";
      }
    });

    syncOverlays();
    fetch(`/api/cos-output-clips/${encodeURIComponent(pid)}`)
      .then((r) => r.json())
      .then((data) => {
        const clips = Array.isArray(data.clips) ? data.clips : [];
        if (clips.length) {
          const activeA = clips.find((c) => c.filename === preferredFn) || clips[0];
          const activeB = clips.find((c) => c.filename !== activeA.filename) || activeA;
          clipASel.innerHTML = clips.map((c) =>
            `<option value="${escapeHtml(c.filename)}" ${c.filename === activeA.filename ? "selected" : ""}>${escapeHtml(c.title)} (${c.size_mb} MB)</option>`
          ).join("");
          clipBSel.innerHTML = clips.map((c) =>
            `<option value="${escapeHtml(c.filename)}" ${c.filename === activeB.filename ? "selected" : ""}>${escapeHtml(c.title)} (${c.size_mb} MB)</option>`
          ).join("");
          const urlA = `/api/cos-ab-lab-asset/${encodeURIComponent(pid)}/${encodeURIComponent(activeA.filename)}`;
          vidA.src = urlA;
          vidB.src = urlA;
          vidA.load();
          vidB.load();
        }
      })
      .catch(() => {});
  }

  function findAbLabNavTarget(target) {
    if (!target || target.closest("#cosAbTestingLabBox")) return null;
    return Array.from(document.querySelectorAll("#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a, #cosStudioArchitecture button, #cosStudioArchitecture a, [role='tab'], .cos-subtool-btn, .cos-tab-btn"))
      .find((el) => el.contains(target) && isAbTestingNavLabel(normalizeLabel(el))) || null;
  }

  ["pointerdown", "click"].forEach((evtType) => {
    document.addEventListener(evtType, function (e) {
      const abNav = findAbLabNavTarget(e.target);
      if (abNav) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        openAbLabView(abNav);
        return;
      }

      if (evtType !== "click" || !e.isTrusted) return;

      const otherNav = e.target.closest(
        "#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a, #cosStudioArchitecture button, #cosStudioArchitecture a, [role='tab'], [data-tool], [data-page], [data-subtool], .cos-subtool-btn, .cos-tab-btn"
      );
      if (otherNav && !otherNav.closest("#cosAbTestingLabBox") && !otherNav.closest("#cosAutoAiBanner")) {
        const lbl = normalizeLabel(otherNav);
        const isOtherCustom = /^thumbnail\s*designer$/i.test(lbl) || /^animations?$/i.test(lbl) || /^hook\s*laboratory$/i.test(lbl) || /^caption\s*(?:&|and)\s*title\s*lab$/i.test(lbl) || /^clip\s*quality\s*inspect[eo]r$/i.test(lbl) || /^a\s*\/?\s*b\s*testing\s*lab$/i.test(lbl) || /^viral\s*score\s*analysis$/i.test(lbl) || /^export\s*center$/i.test(lbl);
        closeAbLabView(!isOtherCustom);
      }
    }, true);
  });

  setTimeout(() => {
    const activeAbBtn = Array.from(document.querySelectorAll("#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a"))
      .find((el) => isAbTestingNavLabel(normalizeLabel(el)) && (el.classList.contains("active") || el.getAttribute("aria-selected") === "true"));
    if (activeAbBtn) {
      openAbLabView(activeAbBtn);
    }
  }, 350);

  setInterval(() => {
    if (window.__cosAbLabLockedOpen) {
      const stage = getStageElement();
      if (stage) {
        hideOtherStagePanelsForAb(stage);
        if (!document.getElementById("cosAbTestingLabBox") && cachedAbBox) {
          stage.appendChild(cachedAbBox);
        }
      }
    }
  }, 250);
})();
</script>

<script id="cos-viral-score-script">
(function () {
  window.__cosVsaLockedOpen = false;
  let cachedVsaBox = null;

  function getStudioState() {
    try { return JSON.parse(localStorage.getItem("cos_studio_state_v2") || "{}"); } catch (_) { return {}; }
  }

  function setStudioState(patch) {
    try {
      const next = Object.assign({}, getStudioState(), patch);
      localStorage.setItem("cos_studio_state_v2", JSON.stringify(next));
    } catch (_) {}
  }

  function getActiveProjectId() {
    const sel = document.getElementById("cosCtxProjectSelect");
    if (sel && sel.value && sel.value !== "undefined") return sel.value;
    const st = getStudioState();
    if (st.activeProjectId && st.activeProjectId !== "undefined") return String(st.activeProjectId);
    return "proj-bf2e1fae";
  }

  function getActiveClipFilename() {
    const topSel = document.getElementById("cosCtxClipSelect");
    if (topSel && topSel.value && topSel.value.endsWith(".mp4")) return topSel.value;
    const st = getStudioState();
    return (st.activeClipFilename && st.activeClipFilename.endsWith(".mp4")) ? st.activeClipFilename : "";
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function normalizeLabel(el) {
    return (el.textContent || "")
      .replace(/\bPage\s*\d+\s*of\s*\d+\b/gi, "")
      .replace(/\s+/g, " ")
      .trim()
      .toLowerCase();
  }

  function isViralScoreNavLabel(lbl) {
    return /^viral\s*score\s*analysis$/i.test(lbl);
  }

  function getStageElement() {
    const host = document.getElementById("cosStudioArchitecture");
    if (!host) return null;
    return host.querySelector(".cos-tool-stage") || host;
  }

  function hideOtherStagePanelsForVsa(stage) {
    if (!stage) return;
    Array.from(stage.children).forEach((ch) => {
      if (
        ch.id === "cosAutoAiBanner" ||
        ch.id === "cosViralScoreBox" ||
        ch.classList.contains("cos-ai-tab-status-bar") ||
        ch.querySelector("[data-cos-thumb-primary='1']") ||
        ch.querySelector("[data-cos-anim-primary='1']")
      ) {
        return;
      }
      if (ch.style.display !== "none") {
        ch.setAttribute("data-cos-hidden-custom", "1");
        ch.style.display = "none";
      }
    });
  }

  function closeVsaView(restoreStage) {
    window.__cosVsaLockedOpen = false;
    cachedVsaBox = null;
    document.querySelectorAll("#cosViralScoreBox").forEach((el) => el.remove());
    if (restoreStage) {
      const stage = getStageElement();
      if (stage) {
        Array.from(stage.children).forEach((ch) => {
          if (ch.hasAttribute("data-cos-hidden-custom")) {
            ch.style.display = "";
            ch.removeAttribute("data-cos-hidden-custom");
          }
        });
      }
    }
  }

  function openVsaView(navBtn) {
    // Release other custom panel locks cleanly
    window.__cosThumbLockedOpen = false;
    window.__cosThumbOpening = false;
    window.__cosAnimLockedOpen = false;
    window.__cosHookLabLockedOpen = false;
    window.__cosCapLabLockedOpen = false;
    window.__cosCqiLockedOpen = false;

      t.classList.remove("active");
      t.setAttribute("aria-selected", "false");
    });

    window.__cosVsaLockedOpen = true;

    const stage = getStageElement();
    if (!stage) return;

    if (navBtn) {
      document.querySelectorAll("#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a").forEach((b) => {
        if (b !== navBtn) b.classList.remove("active");
      });
      navBtn.classList.add("active");

        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;" data-role="plat-tabs">
          <button type="button" class="cos-vsa-pill-btn" style="background:#fbbf24;color:#1c1917;font-weight:800;" data-plat="shorts">YouTube Shorts</button>
          <button type="button" class="cos-vsa-pill-btn" data-plat="reels">Instagram Reels</button>
          <button type="button" class="cos-vsa-pill-btn" data-plat="tiktok">TikTok</button>
          <button type="button" class="cos-vsa-pill-btn" data-plat="youtube_16x9">YouTube 16:9</button>
        </div>
      </div>

      <div class="cos-vsa-hero">
        <div style="display:flex;align-items:center;gap:13px;">
          <div class="cos-vsa-ring">
            <span style="font-size:22px;" data-role="score-val">--</span>

        <div style="display:flex;gap:7px;flex-wrap:wrap;">
          <button type="button" data-role="rescan-btn" class="cos-vsa-pill-btn">Re-Score Clip</button>
          <a data-role="report-link" href="#" download class="cos-vsa-pill-btn" style="display:none;">Export Scorecard JSON</a>
        </div>
      </div>

      <div class="cos-vsa-layout">
        <div class="cos-vsa-preview-card">
          <div class="cos-vsa-video-wrap">

          </div>
          <a data-role="download-link" href="#" download style="display:none;padding:9px 10px;border-radius:10px;background:#10b981;color:#022c22;font-size:12px;font-weight:800;text-align:center;text-decoration:none;">
            Download Viral-Boosted MP4
          </a>
        </div>

        <div style="display:flex;flex-direction:column;gap:12px;">
          <div>
            <div style="font-size:11.5px;font-weight:700;color:#cbd5e1;margin-bottom:4px;">1. Select Clip to Score</div>
            <select data-role="clip-sel" class="cos-vsa-select">
              <option value="${escapeHtml(preferredFn)}">${escapeHtml(preferredFn || (pid + ".mp4"))}</option>
            </select>
          </div>

          <div>
            <div style="font-size:11.5px;font-weight:700;color:#fde047;margin-bottom:5px;">
              2. 5-Pillar Algorithmic Virality Breakdown
            </div>
            <div class="cos-vsa-pillar-list" data-role="pillars-list"></div>
          </div>

          <div>
            <div style="font-size:11.5px;font-weight:700;color:#38bdf8;margin-bottom:5px;">
              3. Predicted Viewer Retention Curve vs. Platform Benchmark
            </div>
            <div class="cos-vsa-curve-grid" data-role="curve-grid"></div>
          </div>

          <div>
            <div style="font-size:11.5px;font-weight:700;color:#6ee7b7;margin-bottom:5px;">
              4. High-Leverage Optimization Actions
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;" data-role="recs-list"></div>
          </div>

          <button type="button" class="cos-vsa-boost-btn" data-role="boost-btn">
            ? Apply One-Click Viral Auto-Boost &amp; Render MP4
          </button>

          <div data-role="status-box" style="padding:9px 11px;border-radius:9px;background:rgba(10,14,28,0.75);border:1px solid rgba(251,191,36,0.28);font-size:12px;color:#cbd5e1;">
            Viral Score Analysis ready for project <strong>${escapeHtml(pid)}</strong>.
          </div>
        </div>
      </div>
    `;

    stage.appendChild(box);
    cachedVsaBox = box;

    const q = (sel) => box.querySelector(sel);
    const scoreValEl = q("[data-role='score-val']");
    const tierHeadEl = q("[data-role='tier-headline']");
    const reachSubEl = q("[data-role='reach-sub']");
    const rescanBtn = q("[data-role='rescan-btn']");
    const reportLink = q("[data-role='report-link']");
    const videoEl = q("[data-role='preview-video']");
    const videoMeta = q("[data-role='video-meta']");
    const dlLink = q("[data-role='download-link']");
    const clipSel = q("[data-role='clip-sel']");
    const pillarsList = q("[data-role='pillars-list']");
    const curveGrid = q("[data-role='curve-grid']");
    const recsList = q("[data-role='recs-list']");
    const boostBtn = q("[data-role='boost-btn']");
    const statusBox = q("[data-role='status-box']");

    let selectedPlatform = "shorts";

    function renderScorecardUI(resp) {
      scoreValEl.textContent = String(resp.score || 85);
      tierHeadEl.innerHTML = `${escapeHtml(resp.tier || "High-Reach Contender")} &bull; <span style="color:#6ee7b7;">${resp.score}/100</span>`;
      reachSubEl.textContent = `${resp.reach_est || "25K ? 100K Views Potential"} (${selectedPlatform.replace("_", " ").toUpperCase()})`;

      pillarsList.innerHTML = (resp.pillars || []).map((p) => `
        <div class="cos-vsa-pillar-item">
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:11.5px;">
            <strong style="color:#f8fafc;">${escapeHtml(p.name)}</strong>
            <span style="color:#fde047;font-weight:800;">${p.score}/${p.max} pts</span>
          </div>
          <div class="cos-vsa-bar-track">
            <div class="cos-vsa-bar-fill" style="width:${Math.min(100, Math.max(12, p.pct))}%;"></div>
          </div>
          <div style="font-size:10.5px;color:#94a3b8;margin-top:4px;">${escapeHtml(p.note)}</div>
        </div>
      `).join("");

      curveGrid.innerHTML = (resp.curve || []).map((pt) => `
        <div class="cos-vsa-curve-col">
          <span style="font-size:10px;font-weight:800;color:#6ee7b7;">${pt.pct}%</span>
          <div style="width:22px;height:${Math.max(14, Math.round(pt.pct * 0.65))}px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#38bdf8,#10b981);position:relative;" title="Clip: ${pt.pct}% vs Benchmark: ${pt.bench}%"></div>
          <span style="font-size:9px;color:#94a3b8;text-align:center;">${escapeHtml(pt.label)}</span>
        </div>
      `).join("");

      recsList.innerHTML = (resp.recommendations || []).map((r) => `
        <div class="cos-vsa-rec-card">
          <div>
            <div style="font-size:10px;font-weight:900;color:#fbbf24;">${escapeHtml(r.priority)} &bull; ${escapeHtml(r.title)}</div>
            <div style="font-size:11px;color:#cbd5e1;margin-top:2px;">${escapeHtml(r.detail)}</div>
          </div>
          <button type="button" class="cos-vsa-pill-btn" data-jump-tool="${escapeHtml(r.target_tool)}">
            Open ${escapeHtml(r.target_tool)} ?
          </button>
        </div>
      `).join("");

      recsList.querySelectorAll("button[data-jump-tool]").forEach((jBtn) => {
        jBtn.addEventListener("click", () => {
          const targetName = (jBtn.getAttribute("data-jump-tool") || "").toLowerCase();
          const navTarget = Array.from(document.querySelectorAll("#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a"))
            .find((el) => normalizeLabel(el) === targetName);
          if (navTarget) navTarget.click();
        });
      });
    }

    async function analyzeClip(fn) {
      tierHeadEl.textContent = "Scoring algorithmic retention & virality signals...";
      const resp = await fetch("/api/cos-viral-score-analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          project_id: pid,
          clip_filename: fn,
          platform: selectedPlatform
        })
      }).then((r) => r.json()).catch(() => ({}));

      if (resp && resp.ok) {
        videoEl.src = resp.video_url;
        videoEl.load();
        const s = resp.signals || {};
        videoMeta.textContent = `${resp.clip_filename} (${s.duration || 15}s ? ${s.size_mb || 2} MB)`;
        if (resp.report_url) {
          reportLink.href = resp.report_url;
          reportLink.download = resp.report_filename || "viral_score.json";
          reportLink.style.display = "inline-block";
        }
        renderScorecardUI(resp);
      } else {
        scoreValEl.textContent = "--";
        tierHeadEl.textContent = resp.detail || "Select a rendered clip to compute Viral Score.";
      }
    }

    box.querySelectorAll("[data-role='plat-tabs'] [data-plat]").forEach((pBtn) => {
      pBtn.addEventListener("click", () => {
        box.querySelectorAll("[data-role='plat-tabs'] [data-plat]").forEach((b) => {
          b.style.background = "rgba(245, 158, 11, 0.16)";
          b.style.color = "#fef3c7";
        });
        pBtn.style.background = "#fbbf24";
        pBtn.style.color = "#1c1917";
        selectedPlatform = pBtn.getAttribute("data-plat") || "shorts";
        analyzeClip(clipSel.value);
      });
    });

    rescanBtn.addEventListener("click", () => analyzeClip(clipSel.value));
    clipSel.addEventListener("change", () => {
      setStudioState({ activeClipFilename: clipSel.value });
      analyzeClip(clipSel.value);
    });

    boostBtn.addEventListener("click", async () => {
      boostBtn.disabled = true;
      boostBtn.textContent = "Applying Viral Auto-Boost...";
      statusBox.textContent = "Trimming opening dead air, adding 3s hook zoom, normalizing -14 LUFS & boosting clarity...";

      const resp = await fetch("/api/cos-viral-score-boost", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          project_id: pid,
          clip_filename: clipSel.value,
          platform: selectedPlatform
        })
      }).then((r) => r.json()).catch((err) => ({ detail: String(err) }));

      boostBtn.disabled = false;
      boostBtn.textContent = "? Apply One-Click Viral Auto-Boost & Render MP4";

      if (resp && resp.ok && resp.clip) {
        setStudioState({ activeClipFilename: resp.clip.filename });
        renderScorecardUI({
          score: resp.after_score,
          tier: resp.tier,
          reach_est: resp.reach_est,
          pillars: resp.pillars,
          curve: resp.curve,
          recommendations: resp.recommendations
        });
        videoEl.src = resp.clip.url;
        videoEl.load();
        videoEl.play().catch(() => {});
        dlLink.href = resp.clip.url;
        dlLink.download = resp.clip.filename;
        dlLink.style.display = "block";
        statusBox.innerHTML = `<strong style="color:#6ee7b7;">Viral Boost Complete!</strong> Score jumped <strong>${resp.before_score} ? ${resp.after_score}/100</strong>. Saved <strong>${escapeHtml(resp.clip.filename)}</strong> (${resp.clip.size_mb} MB).`;
      } else {
        statusBox.textContent = resp.detail || "Could not boost clip.";
      }
    });

    fetch(`/api/cos-output-clips/${encodeURIComponent(pid)}`)
      .then((r) => r.json())
      .then((data) => {
        const clips = Array.isArray(data.clips) ? data.clips : [];
        if (clips.length) {
          const active = clips.find((c) => c.filename === preferredFn) || clips[0];
          clipSel.innerHTML = clips.map((c) =>
            `<option value="${escapeHtml(c.filename)}" ${c.filename === active.filename ? "selected" : ""}>${escapeHtml(c.title)} (${c.size_mb} MB)</option>`
          ).join("");
          analyzeClip(active.filename);
        } else {
          analyzeClip("");
        }
      })
      .catch(() => analyzeClip(preferredFn));
  }

  function findVsaNavTarget(target) {
    if (!target || target.closest("#cosViralScoreBox")) return null;
    return Array.from(document.querySelectorAll("#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a, #cosStudioArchitecture button, #cosStudioArchitecture a, [role='tab'], .cos-subtool-btn, .cos-tab-btn"))
      .find((el) => el.contains(target) && isViralScoreNavLabel(normalizeLabel(el))) || null;
  }

  ["pointerdown", "click"].forEach((evtType) => {
    document.addEventListener(evtType, function (e) {
      const vsaNav = findVsaNavTarget(e.target);
      if (vsaNav) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        openVsaView(vsaNav);
        return;
      }

      if (evtType !== "click" || !e.isTrusted) return;

      const otherNav = e.target.closest(
        "#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a, #cosStudioArchitecture button, #cosStudioArchitecture a, [role='tab'], [data-tool], [data-page], [data-subtool], .cos-subtool-btn, .cos-tab-btn"
      );
      if (otherNav && !otherNav.closest("#cosViralScoreBox") && !otherNav.closest("#cosAutoAiBanner")) {
        const lbl = normalizeLabel(otherNav);
        const isOtherCustom = /^thumbnail\s*designer$/i.test(lbl) || /^animations?$/i.test(lbl) || /^hook\s*laboratory$/i.test(lbl) || /^caption\s*(?:&|and)\s*title\s*lab$/i.test(lbl) || /^clip\s*quality\s*inspect[eo]r$/i.test(lbl) || /^a\s*\/?\s*b\s*testing\s*lab$/i.test(lbl) || /^viral\s*score\s*analysis$/i.test(lbl) || /^export\s*center$/i.test(lbl);
        closeVsaView(!isOtherCustom);
      }
    }, true);
  });

  setTimeout(() => {
    const activeVsaBtn = Array.from(document.querySelectorAll("#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a"))
      .find((el) => isViralScoreNavLabel(normalizeLabel(el)) && (el.classList.contains("active") || el.getAttribute("aria-selected") === "true"));
    if (activeVsaBtn) {
      openVsaView(activeVsaBtn);
    }
  }, 350);

  setInterval(() => {
    if (window.__cosVsaLockedOpen) {
      const stage = getStageElement();
      if (stage) {
        hideOtherStagePanelsForVsa(stage);
        if (!document.getElementById("cosViralScoreBox") && cachedVsaBox) {
          stage.appendChild(cachedVsaBox);
        }
      }
    }
  }, 250);
})();
</script>

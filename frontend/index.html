      function renderSuggestionCards() {
        sugGrid.innerHTML = state.suggestions.map((s, idx) => `
          <button type="button" class="cos-thm-sug-btn ${idx === state.activeSugIdx ? "active" : ""}" data-sidx="${idx}">
            <div style="font-size:10px;font-weight:800;color:#6ee7b7;text-transform:uppercase;">${escapeHtml(s.angle)}</div>
            <div style="font-size:12px;font-weight:900;color:#ffffff;margin-top:2px;">"${escapeHtml(s.headline)}"</div>
            <div style="font-size:10px;color:#94a3b8;margin-top:1px;">Badge: ${escapeHtml(s.kicker)}</div>
          </button>
        `).join("");

        sugGrid.querySelectorAll(".cos-thm-sug-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const idx = Number(btn.getAttribute("data-sidx") || 0);
            const item = state.suggestions[idx];
            if (!item) return;
            state.activeSugIdx = idx;
            headInp.value = item.headline;
            kickInp.value = item.kicker;
            updateWordCounter();
            renderSuggestionCards();
            applyTemplateById(item.template || "finance_gold");
          });
        });
      }

      function renderTemplateCards() {
        tplGrid.innerHTML = THUMB_TEMPLATES.map((t) => `
          <button type="button" class="cos-thm-tpl-btn ${t.id === state.tplId ? "active" : ""}" data-tpl="${t.id}">
            <div style="font-size:11.5px;font-weight:800;color:${t.color};">${escapeHtml(t.name)}</div>
            <div style="font-size:10px;color:#94a3b8;margin-top:2px;">${escapeHtml(t.desc)}</div>
          </button>
        `).join("");

        tplGrid.querySelectorAll(".cos-thm-tpl-btn").forEach((b) => {
          b.addEventListener("click", () => applyTemplateById(b.getAttribute("data-tpl")));
        });
      }

      function loadBackgroundUrl(url) {
        if (!url) return;
        const img = new Image();
        img.onload = () => {
          state.bgImg = img;
          renderCanvas(true);
        };
        img.onerror = () => renderCanvas(true);
        img.src = url;
      }

      async function runAiDetectAndBuild(clipFilename, customTopicText) {
        aiSummaryEl.innerHTML = `<span style="color:#a5b4fc;">Analyzing speech, topic &amp; scoring 12 candidate moments for maximum CTR...</span>`;
        statusEl.textContent = "AI scanning transcript & evaluating frame sharpness + facial clarity...";
        renderCanvas(true);

        const resp = await fetch("/api/cos-thumbnail-frames", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            project_id: pid,
            clip_filename: clipFilename,
            custom_topic: customTopicText || ""
          })
        }).then((r) => r.json()).catch(() => ({}));

        if (resp && resp.ai_topic_label) {
          state.topicAccent = resp.ai_accent || "growth";
          if (!topicInp.value.trim()) {
            topicInp.value = resp.ai_topic_label;
          }
        }

        if (resp && Array.isArray(resp.suggestions) && resp.suggestions.length) {
          state.suggestions = resp.suggestions;
          state.activeSugIdx = 0;
          renderSuggestionCards();
          headInp.value = resp.suggestions[0].headline;
          kickInp.value = resp.suggestions[0].kicker;
          updateWordCounter();
          applyTemplateById(resp.ai_default_template || resp.suggestions[0].template || "viral_pop");
        }

        if (resp && resp.ok && Array.isArray(resp.frames) && resp.frames.length) {
          scrubSlider.max = String(Math.max(1, resp.duration || 20));
          const topPick = resp.frames[0];
          aiSummaryEl.innerHTML = `
            Detected Niche: <strong style="color:#6ee7b7;">${escapeHtml(resp.ai_topic_label || "Creator Story")}</strong>
            &bull; #1 AI Frame: <strong style="color:#fde047;">${escapeHtml(topPick.label)}</strong>
            (CTR Score <strong>${topPick.score}/100</strong> &mdash; ${escapeHtml(topPick.reason)})
          `;

          framesStrip.innerHTML = resp.frames.map((fr, idx) => `
            <button type="button" class="cos-thm-frame-btn ${idx === 0 ? "active" : ""}" data-url="${escapeHtml(fr.url)}" title="AI Score ${fr.score}/100 ? ${escapeHtml(fr.reason)}">
              <img src="${escapeHtml(fr.url)}" alt="Frame ${escapeHtml(fr.label)}">
              <span class="cos-thm-frame-score">#${idx + 1} ? ${fr.score}</span>
              <span class="cos-thm-frame-tag">${escapeHtml(fr.label)}</span>
            </button>
          `).join("");

          const frameBtns = Array.from(framesStrip.querySelectorAll(".cos-thm-frame-btn"));
          frameBtns.forEach((fb) => {
            const thumbImgEl = fb.querySelector("img");
            if (thumbImgEl) {
              thumbImgEl.addEventListener("load", () => {
                if (fb.classList.contains("active")) {
                  state.bgImg = thumbImgEl;
                  renderCanvas(true);
                }
              });
            }
            fb.addEventListener("click", () => {
              frameBtns.forEach((x) => x.classList.remove("active"));
              fb.classList.add("active");
              const im = fb.querySelector("img");
              if (im && im.complete && im.naturalWidth > 0) {
                state.bgImg = im;
                renderCanvas(true);
              } else {
                loadBackgroundUrl(fb.getAttribute("data-url"));
              }
            });
          });

          loadBackgroundUrl(topPick.url);
          statusEl.innerHTML = `<strong style="color:#6ee7b7;">AI Thumbnail Ready:</strong> Auto-selected #1 moment (<strong>${escapeHtml(topPick.label)}</strong>, ${escapeHtml(topPick.reason)}) + tailored hooks for <strong>${escapeHtml(resp.ai_topic_label)}</strong>.`;
        } else {
          renderCanvas(true);
          aiSummaryEl.textContent = "Enter any video topic on the right and click AI Detect & Build.";
          statusEl.textContent = resp.detail || "Upload a photo or select a clip above to design your thumbnail.";
        }
      }

      function updateWordCounter() {
        const wc = (headInp.value || "").trim().split(/\s+/).filter(Boolean).length;
        if (wc <= 3) {
          wordCntEl.style.color = "#6ee7b7";
          wordCntEl.textContent = `${wc} word${wc === 1 ? "" : "s"} (Optimal)`;
        } else {
          wordCntEl.style.color = "#facc15";
          wordCntEl.textContent = `${wc} words (Keep ?3 for max CTR)`;
        }
      }

      function updatePosFromEvent(ev) {
        const rect = canvas.getBoundingClientRect();
        const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
        const clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
        const minX = state.ratio === "16x9" ? 0.04 : 0.15;
        const maxX = state.ratio === "16x9" ? 0.65 : 0.85;
        state.textX = Math.max(minX, Math.min(maxX, (clientX - rect.left) / rect.width));
        state.textY = Math.max(0.15, Math.min(0.90, (clientY - rect.top) / rect.height));
        renderCanvas(true);
      }
      canvas.addEventListener("pointerdown", (e) => { state.dragging = true; updatePosFromEvent(e); });
      window.addEventListener("pointermove", (e) => { if (state.dragging) updatePosFromEvent(e); });
      window.addEventListener("pointerup", () => { state.dragging = false; });

      aiDetectBtn.addEventListener("click", () => {
        runAiDetectAndBuild(clipSel.value, topicInp.value);
      });

      topicInp.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          runAiDetectAndBuild(clipSel.value, topicInp.value);
        }
      });

      box.querySelectorAll("[data-role='ratio-group'] .cos-thm-pill-btn").forEach((rBtn) => {
        rBtn.addEventListener("click", () => {
          box.querySelectorAll("[data-role='ratio-group'] .cos-thm-pill-btn").forEach((b) => b.classList.remove("active"));
          rBtn.classList.add("active");
          const r = rBtn.getAttribute("data-ratio") || "9x16";
          state.ratio = r;
          if (r === "16x9") {
            canvas.width = 1920;
            canvas.height = 1080;
            state.textX = 0.075;
            state.textY = 0.54;
          } else if (r === "1x1") {
            canvas.width = 1080;
            canvas.height = 1080;
            state.textX = 0.50;
            state.textY = 0.75;
          } else {
            canvas.width = 1080;
            canvas.height = 1920;
            state.textX = 0.50;
            state.textY = 0.74;
          }
          renderCanvas(true);
        });
      });

      let scrubTimer = null;
      scrubSlider.addEventListener("input", () => {
        scrubLbl.textContent = Number(scrubSlider.value).toFixed(1) + "s";
        clearTimeout(scrubTimer);
        scrubTimer = setTimeout(async () => {
          const resp = await fetch("/api/cos-thumbnail-frames", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              project_id: pid,
              clip_filename: clipSel.value,
              custom_time: Number(scrubSlider.value)
            })
          }).then((r) => r.json()).catch(() => ({}));
          if (resp && resp.ok && resp.frame) {
            loadBackgroundUrl(resp.frame.url);
          }
        }, 240);
      });

      uploadInp.addEventListener("change", async () => {
        const f = uploadInp.files && uploadInp.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = () => { if (reader.result) loadBackgroundUrl(reader.result); };
        reader.readAsDataURL(f);

        const fd = new FormData();
        fd.append("project_id", pid);
        fd.append("file", f);
        const resp = await fetch("/api/cos-thumbnail-upload", { method: "POST", body: fd }).then((r) => r.json()).catch(() => ({}));
        if (resp && resp.ok) {
          statusEl.innerHTML = `<strong style="color:#6ee7b7;">Custom photo applied!</strong>`;
        }
      });

      clipSel.addEventListener("change", () => {
        topicInp.value = "";
        setStudioState({ activeClipFilename: clipSel.value });
        runAiDetectAndBuild(clipSel.value, "");
      });

      flipBtn.addEventListener("click", () => {
        state.flipH = !state.flipH;
        renderCanvas(true);
      });

      centerBtn.addEventListener("click", () => {
        if (state.ratio === "16x9") {
          state.textX = 0.075;
          state.textY = 0.54;
        } else if (state.ratio === "1x1") {
          state.textX = 0.50;
          state.textY = 0.75;
        } else {
          state.textX = 0.50;
          state.textY = 0.74;
        }
        renderCanvas(true);
      });

      [headInp, kickInp].forEach((el) => el.addEventListener("input", () => { updateWordCounter(); renderCanvas(true); }));
      [fontSel, badgeSel, headCol, kickCol, safeChk].forEach((el) => el.addEventListener("change", () => renderCanvas(true)));
      sizeSlider.addEventListener("input", () => { sizeLbl.textContent = sizeSlider.value + "px"; renderCanvas(true); });
      zoomSlider.addEventListener("input", () => { state.zoom = Number(zoomSlider.value) / 100; zoomLbl.textContent = zoomSlider.value + "%"; renderCanvas(true); });
      conSlider.addEventListener("input", () => { state.contrast = Number(conSlider.value); conLbl.textContent = conSlider.value + "%"; renderCanvas(true); });

      function triggerBrowserDownload(dataUrl, filename) {
        const a = document.createElement("a");
        a.href = dataUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
      }

      async function saveAndDownload(formatType, embedMp4) {
        renderCanvas(false);
        const pngDataUrl = canvas.toDataURL("image/png");
        const jpgDataUrl = canvas.toDataURL("image/jpeg", 0.90);
        renderCanvas(true);

        const baseName = (clipSel.value || pid).replace(/\.[^.]+$/, "");
        if (!embedMp4) {
          triggerBrowserDownload(formatType === "jpg" ? jpgDataUrl : pngDataUrl, `thumb_${baseName}_${state.ratio}.${formatType}`);
        }

        statusEl.textContent = embedMp4
          ? "Embedding custom cover into MP4..."
          : `Saving ${formatType.toUpperCase()} thumbnail to project outputs...`;

        const resp = await fetch("/api/cos-thumbnail-save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            project_id: pid,
            clip_filename: clipSel.value,
            ratio_tag: state.ratio,
            image_data_url: pngDataUrl,
            embed_mp4: embedMp4
          })
        }).then((r) => r.json()).catch(() => ({}));

        if (resp && resp.ok) {
          if (embedMp4 && resp.embedded_clip) {
            setStudioState({ activeClipFilename: resp.embedded_clip.filename });
            statusEl.innerHTML = `<strong style="color:#6ee7b7;">MP4 Cover Embedded!</strong> Saved <strong>${escapeHtml(resp.embedded_clip.filename)}</strong> (${resp.embedded_clip.size_mb} MB) ? <a href="${escapeHtml(resp.embedded_clip.url)}" download="${escapeHtml(resp.embedded_clip.filename)}" style="color:#38bdf8;font-weight:700;">Download MP4 with Cover</a>`;
          } else {
            const asset = formatType === "jpg" ? resp.jpg : resp.png;
            statusEl.innerHTML = `<strong style="color:#6ee7b7;">Saved &amp; Downloaded!</strong> ${escapeHtml(asset.filename)} (${asset.size_kb} KB) stored in <code>storage/outputs/${escapeHtml(pid)}</code>.`;
          }
        } else if (!embedMp4) {
          statusEl.innerHTML = `<strong style="color:#6ee7b7;">Downloaded ${formatType.toUpperCase()}!</strong>`;
        } else {
          statusEl.textContent = resp.detail || "Could not embed cover into MP4.";
        }
      }

      q("[data-role='save-png']").addEventListener("click", () => saveAndDownload("png", false));
      q("[data-role='save-jpg']").addEventListener("click", () => saveAndDownload("jpg", false));
      q("[data-role='embed-mp4']").addEventListener("click", () => saveAndDownload("jpg", true));

      renderSuggestionCards();
      renderTemplateCards();
      updateWordCounter();
      requestAnimationFrame(() => renderCanvas(true));
      runAiDetectAndBuild(clipSel.value, "");
    } finally {
      window.__cosThumbOpening = false;
    }
  }

  function findThumbTabTarget(target) {
    if (!target || target.closest("#cosThumbnailStudioBox")) return null;
    const direct = target.closest("[data-cos-thumb-primary='1']");
    if (direct) return direct;
    return Array.from(document.querySelectorAll("button, a, [role='tab'], .cos-subtool-btn, .cos-tab-btn"))
      .find((el) => el.contains(target) && /^thumbnail\s*designer$/i.test(normalizeLabel(el))) || null;
  }

  ["pointerdown", "mousedown", "click"].forEach((evtType) => {
    document.addEventListener(evtType, function (e) {
      const thumbTab = findThumbTabTarget(e.target);
      if (thumbTab) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        if (evtType === "click" || evtType === "pointerdown") {
          openThumbnailDesignerView(thumbTab);
        }
        return;
      }

      if (evtType !== "click" || !e.isTrusted) return;

      const animTab = e.target.closest(".cos-anim-nav-tab");
      if (animTab) {
        closeThumbnailDesignerView(false);
        return;
      }

      const navClick = e.target.closest(
        "#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a, #cosStudioArchitecture button, #cosStudioArchitecture a, [role='tab'], [data-tool], [data-page], [data-subtool], .cos-subtool-btn, .cos-tab-btn"
      );
      if (navClick && !navClick.closest("#cosThumbnailStudioBox") && !navClick.closest("#cosAutoAiBanner")) {
        closeThumbnailDesignerView(true);
      }
    }, true);
  });

  setInterval(() => {
    enforceSingleIconThumbnailTab();
    if (window.__cosThumbLockedOpen) {
      const stage = getStageElement();
      if (stage) {
        hideOtherStagePanels(stage);
        if (!document.getElementById("cosThumbnailStudioBox") && cachedBoxNode && !window.__cosThumbOpening) {
          stage.appendChild(cachedBoxNode);
        }
      }
    }
  }, 250);
})();
</script>

<script id="cos-animations-studio-script">
(function () {
  const ANIM_ICON_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12h8"/><path d="M12 8l4 4-4 4"/><path d="M3 8h2M3 16h2M19 8h2M19 16h2"/></svg>';

  const ANIM_PRESETS = [
    { id: "default", name: "Default (No Motion)", desc: "Keep original static framing without zoom or pan" },
    { id: "fade_in_out", name: "Fade In & Fade Out", desc: "Smooth black fade-in at start & fade-out at end" },
    { id: "zoom_in", name: "Smooth Ken Burns Zoom In", desc: "Steady cinematic push-in that holds viewer retention" },
    { id: "punch_in", name: "3-Second Hook Punch-In", desc: "Fast attention-grabbing zoom burst at the start" },
    { id: "zoom_out", name: "Ken Burns Zoom Out", desc: "Starts tight on subject and smoothly reveals frame" },
    { id: "pan_right", name: "Cinematic Pan Left ? Right", desc: "Smooth horizontal camera glide across the scene" },
    { id: "pan_left", name: "Cinematic Pan Right ? Left", desc: "Reverse horizontal sweep for dynamic B-roll" },
    { id: "handheld_shake", name: "Handheld Energy Shake", desc: "Subtle creator-style micro-motion for high energy" },
    { id: "beat_pulse", name: "Rhythmic Beat Pulse", desc: "Repeating zoom pulse synced to upbeat speech/music" },
    { id: "drift_up", name: "Vertical Reveal Drift", desc: "Smooth upward tilt motion ideal for 9:16 Shorts" }
  ];

  window.__cosAnimLockedOpen = false;
  let cachedAnimBox = null;

  function getStudioState() {
    try { return JSON.parse(localStorage.getItem("cos_studio_state_v2") || "{}"); } catch (_) { return {}; }
  }

  function setStudioState(patch) {
    try {
      const next = Object.assign({}, getStudioState(), patch);
      localStorage.setItem("cos_studio_state_v2", JSON.stringify(next));
    } catch (_) {}
  }

  function getActiveProjectId() {
    const sel = document.getElementById("cosCtxProjectSelect");
    if (sel && sel.value && sel.value !== "undefined") return sel.value;
    const st = getStudioState();
    if (st.activeProjectId && st.activeProjectId !== "undefined") return String(st.activeProjectId);
    return "proj-bf2e1fae";
  }

  function getActiveClipFilename() {
    const topSel = document.getElementById("cosCtxClipSelect");
    if (topSel && topSel.value && topSel.value.endsWith(".mp4")) return topSel.value;
    const st = getStudioState();
    return (st.activeClipFilename && st.activeClipFilename.endsWith(".mp4")) ? st.activeClipFilename : "";
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function normalizeLabel(el) {
    return (el.textContent || "")
      .replace(/\bPage\s*\d+\s*of\s*\d+\b/gi, "")
      .replace(/\s+/g, " ")
      .trim()
      .toLowerCase();
  }

  function getStageElement() {
    const host = document.getElementById("cosStudioArchitecture");
    if (!host) return null;
    return host.querySelector(".cos-tool-stage") || host;
  }

  function findAiEditingTabBar() {
    const thumbTab = document.querySelector("[data-cos-thumb-primary='1']") ||
      Array.from(document.querySelectorAll("button, a, [role='tab'], .cos-subtool-btn, .cos-tab-btn"))
        .find((el) => !el.closest("#cosThumbnailStudioBox") && /^thumbnail\s*designer$/i.test(normalizeLabel(el)));
    if (thumbTab && thumbTab.parentElement) {
      return { tabBar: thumbTab.parentElement, refTab: thumbTab };
    }

    const host = document.getElementById("cosStudioArchitecture");
    if (!host) return null;
    const candidateTab = Array.from(host.querySelectorAll("button, a, [role='tab'], .cos-subtool-btn, .cos-tab-btn"))
      .find((el) => /^(smart\s*captions|auto\s*reframe|ai\s*director|vfx|b-roll|captions)$/i.test(normalizeLabel(el)));
    if (candidateTab && candidateTab.parentElement) {
      return { tabBar: candidateTab.parentElement, refTab: candidateTab };
    }
    return null;
  }

  function ensureAnimationsTabRestored() {
    const barInfo = findAiEditingTabBar();
    if (!barInfo || !barInfo.tabBar) return;
    const { tabBar, refTab } = barInfo;

    const directAnims = Array.from(tabBar.children).filter(
      (el) => !el.closest("#cosAnimationsStudioBox") && /^animations?$/i.test(normalizeLabel(el))
    );

    let keeper = null;
    if (directAnims.length > 0) {
      keeper = directAnims[0];
      directAnims.slice(1).forEach((dup) => dup.remove());
    } else {
      keeper = document.createElement(refTab && refTab.tagName === "A" ? "a" : "button");
      if (keeper.tagName === "BUTTON") keeper.type = "button";
      const baseCls = refTab ? (refTab.className || "").replace(/\bactive\b/g, "").trim() : "cos-subtool-btn";
      keeper.className = (baseCls ? baseCls + " " : "") + "cos-anim-nav-tab";
      if (refTab) {
        tabBar.insertBefore(keeper, refTab);
      } else {
        tabBar.appendChild(keeper);
      }
    }

    keeper.removeAttribute("disabled");
    keeper.setAttribute("data-cos-anim-primary", "1");
    keeper.classList.add("cos-anim-nav-tab");
    if (!keeper.querySelector("svg")) {
      keeper.innerHTML = ANIM_ICON_SVG + "<span>Animations</span>";
    }

    Array.from(document.querySelectorAll("button, a, [role='tab'], .cos-subtool-btn, .cos-tab-btn")).forEach((el) => {
      if (el !== keeper && !el.closest("#cosAnimationsStudioBox") && !el.closest("#cosThumbnailStudioBox") && /^animations?$/i.test(normalizeLabel(el))) {
        el.remove();
      }
    });

    if (window.__cosAnimLockedOpen) {
      keeper.classList.add("active");
      keeper.setAttribute("aria-selected", "true");
    }
  }

  function hideOtherStagePanelsForAnim(stage) {
    if (!stage) return;
    Array.from(stage.children).forEach((ch) => {
      if (
        ch.id === "cosAutoAiBanner" ||
        ch.id === "cosAnimationsStudioBox" ||
        ch.classList.contains("cos-ai-tab-status-bar") ||
        ch.querySelector("[data-cos-anim-primary='1']") ||
        ch.querySelector("[data-cos-thumb-primary='1']")
      ) {
        return;
      }
      if (ch.style.display !== "none") {
        ch.setAttribute("data-cos-hidden-custom", "1");
        ch.style.display = "none";
      }
    });
  }

  function closeAnimationsView(restoreStage) {
    window.__cosAnimLockedOpen = false;
    cachedAnimBox = null;
    document.querySelectorAll("#cosAnimationsStudioBox").forEach((el) => el.remove());
    document.querySelectorAll("[data-cos-anim-primary='1'], .cos-anim-nav-tab").forEach((t) => {
      t.classList.remove("active");
      t.setAttribute("aria-selected", "false");
    });
    if (restoreStage) {
      const stage = getStageElement();
      if (stage) {
        Array.from(stage.children).forEach((ch) => {
          if (ch.hasAttribute("data-cos-hidden-custom")) {
            ch.style.display = "";
            ch.removeAttribute("data-cos-hidden-custom");
          }
        });
      }
    }
  }

  function openAnimationsView(tabBtn) {
    window.__cosThumbLockedOpen = false;
    window.__cosThumbOpening = false;
    document.querySelectorAll("#cosThumbnailStudioBox").forEach((el) => el.remove());
    document.querySelectorAll("[data-cos-thumb-primary='1']").forEach((t) => {
      t.classList.remove("active");
      t.setAttribute("aria-selected", "false");
    });

    window.__cosAnimLockedOpen = true;

    const stage = getStageElement();
    if (!stage) return;

    const primaryTab = tabBtn || document.querySelector("[data-cos-anim-primary='1']");
    if (primaryTab && primaryTab.parentElement) {
      Array.from(primaryTab.parentElement.children).forEach((sib) => {
        sib.classList.remove("active");
        sib.setAttribute("aria-selected", "false");
      });
      primaryTab.classList.add("active");
      primaryTab.setAttribute("aria-selected", "true");
    }

    hideOtherStagePanelsForAnim(stage);

    const pid = getActiveProjectId();
    const preferredFn = getActiveClipFilename();

    const statusBar = stage.querySelector(".cos-ai-tab-status-bar");
    if (statusBar) {
      statusBar.innerHTML = `
        <span>Section: <strong>AI Editing</strong> &bull; Active Tab: <strong>Animations</strong></span>
        <span>Project: <strong>${escapeHtml(pid)}</strong>${preferredFn ? ` &bull; Clip: <strong>${escapeHtml(preferredFn)}</strong>` : ""}</span>
      `;
    }

    const existing = document.getElementById("cosAnimationsStudioBox");
    if (existing) {
      existing.style.display = "";
      return;
    }

    const box = document.createElement("div");
    box.id = "cosAnimationsStudioBox";
    box.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;">
        <div>
          <div style="font-size:11.5px;font-weight:700;color:#38bdf8;text-transform:uppercase;letter-spacing:0.04em;">
            AI Editing &bull; Camera Motion &amp; Animations
          </div>
          <h2 style="margin:2px 0 4px 0;font-size:20px;font-weight:800;color:#ffffff;">Dynamic Zoom, Pan &amp; Fade Studio</h2>
          <div style="font-size:12.5px;color:#94a3b8;">Keep Default static framing, add smooth Fade In &amp; Fade Out transitions, or apply Ken Burns zooms and hook motion.</div>
        </div>
      </div>

      <div class="cos-anm-layout">
        <div class="cos-anm-preview-card">
          <div class="cos-anm-video-box" data-role="video-wrap">
            <video data-role="preview-video" class="cos-anm-sim-default" controls muted loop playsinline></video>
          </div>
          <div style="font-size:11px;color:#94a3b8;text-align:center;" data-role="preview-caption">
            Live preview &bull; Click Apply Animation to render HD MP4
          </div>
          <a data-role="download-link" href="#" download style="display:none;padding:9px 10px;border-radius:10px;background:#10b981;color:#fff;font-size:12px;font-weight:800;text-align:center;text-decoration:none;">
            Download Animated MP4
          </a>
        </div>

        <div style="display:flex;flex-direction:column;gap:12px;">
          <div>
            <div style="font-size:11.5px;font-weight:700;color:#cbd5e1;margin-bottom:4px;">1. Select Target Video Clip</div>
            <select data-role="clip-sel" class="cos-anm-select">
              <option value="${escapeHtml(preferredFn)}">${escapeHtml(preferredFn || (pid + ".mp4"))}</option>
            </select>
          </div>

          <div>
            <div style="font-size:11.5px;font-weight:700;color:#cbd5e1;margin-bottom:6px;">2. Choose Camera Animation Preset</div>
            <div class="cos-anm-preset-grid" data-role="preset-grid">
              ${ANIM_PRESETS.map((p, i) => `
                <button type="button" class="cos-anm-preset-btn ${i === 0 ? "active" : ""}" data-preset="${p.id}">
                  <div style="font-size:12px;font-weight:800;color:${p.id === "default" ? "#6ee7b7" : (p.id === "fade_in_out" ? "#fbbf24" : "#38bdf8")};">${escapeHtml(p.name)}</div>
                  <div style="font-size:10.5px;color:#94a3b8;margin-top:2px;">${escapeHtml(p.desc)}</div>
                </button>
              `).join("")}
            </div>
          </div>

          <div class="cos-anm-settings-row">
            <div>
              <label style="display:block;font-size:11.5px;font-weight:700;color:#cbd5e1;margin-bottom:4px;">
                3. Fade In &amp; Out
              </label>
              <select data-role="fade-sel" class="cos-anm-select">
                <option value="off" selected>Off (No Fade)</option>
                <option value="in_out_05">0.5s Quick Fade In &amp; Out</option>
                <option value="in_out_08">0.8s Smooth Fade In &amp; Out</option>
                <option value="in_out_12">1.2s Cinematic Fade In &amp; Out</option>
                <option value="in_only">Fade In Only (0.6s)</option>
                <option value="out_only">Fade Out Only (0.6s)</option>
              </select>
            </div>
            <div>
              <label style="display:block;font-size:11.5px;font-weight:700;color:#cbd5e1;margin-bottom:4px;">
                4. Zoom Strength: <strong data-role="int-lbl" style="color:#38bdf8;">114%</strong>
              </label>
              <input type="range" data-role="int-slider" min="105" max="132" step="1" value="114" style="width:100%;margin-top:6px;accent-color:#38bdf8;cursor:pointer;">
            </div>
            <div>
              <label style="display:block;font-size:11.5px;font-weight:700;color:#cbd5e1;margin-bottom:4px;">
                5. Timing Mode
              </label>
              <select data-role="timing-sel" class="cos-anm-select">
                <option value="full" selected>Full Clip Motion</option>
                <option value="hook">First 3s Hook Emphasis</option>
              </select>
            </div>
          </div>

          <button type="button" class="cos-anm-apply-btn" data-role="apply-btn">
            Apply Animation &amp; Render Clip
          </button>

          <div data-role="status-box" style="padding:9px 11px;border-radius:9px;background:rgba(10,14,28,0.75);border:1px solid rgba(56,189,248,0.28);font-size:12px;color:#cbd5e1;">
            Animations Studio ready. Loading clips for project <strong>${escapeHtml(pid)}</strong>...
          </div>
        </div>
      </div>
    `;

    stage.appendChild(box);
    cachedAnimBox = box;

    const q = (sel) => box.querySelector(sel);
    const videoWrap = q("[data-role='video-wrap']");
    const videoEl = q("[data-role='preview-video']");
    const clipSel = q("[data-role='clip-sel']");
    const presetGrid = q("[data-role='preset-grid']");
    const fadeSel = q("[data-role='fade-sel']");
    const intSlider = q("[data-role='int-slider']");
    const intLbl = q("[data-role='int-lbl']");
    const timingSel = q("[data-role='timing-sel']");
    const applyBtn = q("[data-role='apply-btn']");
    const statusBox = q("[data-role='status-box']");
    const dlLink = q("[data-role='download-link']");

    let selectedPreset = "default";

    function updateLivePreviewClasses() {
      videoEl.className = `cos-anm-sim-${selectedPreset}`;
      const fMode = fadeSel.value;
      videoWrap.classList.remove("cos-anm-wrap-fade-in-out", "cos-anm-wrap-fade-in", "cos-anm-wrap-fade-out");
      if (fMode === "in_only") {
        videoWrap.classList.add("cos-anm-wrap-fade-in");
      } else if (fMode === "out_only") {
        videoWrap.classList.add("cos-anm-wrap-fade-out");
      } else if (fMode !== "off") {
        videoWrap.classList.add("cos-anm-wrap-fade-in-out");
      }
    }

    function setVideoSource(fn) {
      if (!fn) return;
      videoEl.src = `/api/cos-animations-asset/${encodeURIComponent(pid)}/${encodeURIComponent(fn)}`;
      videoEl.load();
    }

    presetGrid.querySelectorAll(".cos-anm-preset-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        presetGrid.querySelectorAll(".cos-anm-preset-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        selectedPreset = btn.getAttribute("data-preset") || "default";
        if (selectedPreset === "fade_in_out" && fadeSel.value === "off") {
          fadeSel.value = "in_out_08";
        } else if (selectedPreset === "default") {
          fadeSel.value = "off";
        }
        updateLivePreviewClasses();
      });
    });

    fadeSel.addEventListener("change", updateLivePreviewClasses);

    intSlider.addEventListener("input", () => {
      intLbl.textContent = intSlider.value + "%";
    });

    clipSel.addEventListener("change", () => {
      setStudioState({ activeClipFilename: clipSel.value });
      setVideoSource(clipSel.value);
    });

    applyBtn.addEventListener("click", async () => {
      applyBtn.disabled = true;
      applyBtn.textContent = "Rendering Animated MP4...";
      statusBox.textContent = "Applying FFmpeg animation & fade settings to your clip...";

      const resp = await fetch("/api/cos-animations-apply", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          project_id: pid,
          clip_filename: clipSel.value,
          preset: selectedPreset,
          intensity: Number(intSlider.value) / 100,
          timing_mode: timingSel.value,
          fade_mode: fadeSel.value
        })
      }).then((r) => r.json()).catch((err) => ({ detail: String(err) }));

      applyBtn.disabled = false;
      applyBtn.textContent = "Apply Animation & Render Clip";

      if (resp && resp.ok && resp.clip) {
        setStudioState({ activeClipFilename: resp.clip.filename });
        videoWrap.classList.remove("cos-anm-wrap-fade-in-out", "cos-anm-wrap-fade-in", "cos-anm-wrap-fade-out");
        videoEl.className = "";
        videoEl.src = resp.clip.url;
        videoEl.load();
        videoEl.play().catch(() => {});
        dlLink.href = resp.clip.url;
        dlLink.download = resp.clip.filename;
        dlLink.style.display = "block";
        statusBox.innerHTML = `<strong style="color:#6ee7b7;">Rendered!</strong> Saved <strong>${escapeHtml(resp.clip.filename)}</strong> (${resp.clip.size_mb} MB) to <code>storage/outputs/${escapeHtml(pid)}</code>.`;
      } else {
        statusBox.textContent = resp.detail || "Could not render animation.";
      }
    });

    fetch(`/api/cos-output-clips/${encodeURIComponent(pid)}`)
      .then((r) => r.json())
      .then((data) => {
        const clips = Array.isArray(data.clips) ? data.clips : [];
        if (clips.length) {
          const active = clips.find((c) => c.filename === preferredFn) || clips[0];
          clipSel.innerHTML = clips.map((c) =>
            `<option value="${escapeHtml(c.filename)}" ${c.filename === active.filename ? "selected" : ""}>${escapeHtml(c.title)} (${c.size_mb} MB)</option>`
          ).join("");
          setVideoSource(active.filename);
          statusBox.innerHTML = `<strong style="color:#38bdf8;">Ready:</strong> Loaded ${clips.length} clip(s). Pick <strong>Default</strong>, <strong>Fade In &amp; Fade Out</strong>, or any motion preset.`;
        } else {
          statusBox.textContent = "No rendered clips found yet in this project. Generate a clip first, then apply animations.";
        }
      })
      .catch(() => {
        statusBox.textContent = "Ready ? select an animation preset above.";
      });
  }

  function findAnimTabTarget(target) {
    if (!target || target.closest("#cosAnimationsStudioBox") || target.closest("#cosThumbnailStudioBox")) return null;
    const direct = target.closest("[data-cos-anim-primary='1'], .cos-anim-nav-tab");
    if (direct) return direct;
    return Array.from(document.querySelectorAll("button, a, [role='tab'], .cos-subtool-btn, .cos-tab-btn"))
      .find((el) => el.contains(target) && /^animations?$/i.test(normalizeLabel(el))) || null;
  }

  ["pointerdown", "click"].forEach((evtType) => {
    document.addEventListener(evtType, function (e) {
      const animTab = findAnimTabTarget(e.target);
      if (animTab) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        openAnimationsView(animTab);
        return;
      }

      if (evtType !== "click" || !e.isTrusted) return;

      const otherNav = e.target.closest(
        "#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a, #cosStudioArchitecture button, #cosStudioArchitecture a, [role='tab'], [data-tool], [data-page], [data-subtool], .cos-subtool-btn, .cos-tab-btn"
      );
      if (otherNav && !otherNav.closest("#cosAnimationsStudioBox") && !otherNav.closest("#cosAutoAiBanner")) {
        const isThumb = /^thumbnail\s*designer$/i.test(normalizeLabel(otherNav)) || otherNav.hasAttribute("data-cos-thumb-primary");
        closeAnimationsView(!isThumb);
      }
    }, true);
  });

  setInterval(() => {
    ensureAnimationsTabRestored();
    if (window.__cosAnimLockedOpen) {
      const stage = getStageElement();
      if (stage) {
        hideOtherStagePanelsForAnim(stage);
        if (!document.getElementById("cosAnimationsStudioBox") && cachedAnimBox) {
          stage.appendChild(cachedAnimBox);
        }
      }
    }
  }, 250);
})();
</script>

<script id="cos-hook-lab-script">
(function () {
  window.__cosHookLabLockedOpen = false;
  let cachedHookBox = null;

  function getStudioState() {
    try { return JSON.parse(localStorage.getItem("cos_studio_state_v2") || "{}"); } catch (_) { return {}; }
  }

  function setStudioState(patch) {
    try {
      const next = Object.assign({}, getStudioState(), patch);
      localStorage.setItem("cos_studio_state_v2", JSON.stringify(next));
    } catch (_) {}
  }

  function getActiveProjectId() {
    const sel = document.getElementById("cosCtxProjectSelect");
    if (sel && sel.value && sel.value !== "undefined") return sel.value;
    const st = getStudioState();
    if (st.activeProjectId && st.activeProjectId !== "undefined") return String(st.activeProjectId);
    return "proj-bf2e1fae";
  }

  function getActiveClipFilename() {
    const topSel = document.getElementById("cosCtxClipSelect");
    if (topSel && topSel.value && topSel.value.endsWith(".mp4")) return topSel.value;
    const st = getStudioState();
    return (st.activeClipFilename && st.activeClipFilename.endsWith(".mp4")) ? st.activeClipFilename : "";
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function normalizeLabel(el) {
    return (el.textContent || "")
      .replace(/\bPage\s*\d+\s*of\s*\d+\b/gi, "")
      .replace(/\s+/g, " ")
      .trim()
      .toLowerCase();
  }

  function getStageElement() {
    const host = document.getElementById("cosStudioArchitecture");
    if (!host) return null;
    return host.querySelector(".cos-tool-stage") || host;
  }

  function hideOtherStagePanelsForHook(stage) {
    if (!stage) return;
    Array.from(stage.children).forEach((ch) => {
      if (
        ch.id === "cosAutoAiBanner" ||
        ch.id === "cosHookLabBox" ||
        ch.classList.contains("cos-ai-tab-status-bar") ||
        ch.querySelector("[data-cos-thumb-primary='1']") ||
        ch.querySelector("[data-cos-anim-primary='1']")
      ) {
        return;
      }
      if (ch.style.display !== "none") {
        ch.setAttribute("data-cos-hidden-custom", "1");
        ch.style.display = "none";
      }
    });
  }

  function closeHookLabView(restoreStage) {
    window.__cosHookLabLockedOpen = false;
    cachedHookBox = null;
    document.querySelectorAll("#cosHookLabBox").forEach((el) => el.remove());
    if (restoreStage) {
      const stage = getStageElement();
      if (stage) {
        Array.from(stage.children).forEach((ch) => {
          if (ch.hasAttribute("data-cos-hidden-custom")) {
            ch.style.display = "";
            ch.removeAttribute("data-cos-hidden-custom");
          }
        });
      }
    }
  }

  function openHookLabView(navBtn) {
    // Release any other custom panel locks cleanly
    window.__cosThumbLockedOpen = false;
    window.__cosThumbOpening = false;
    window.__cosAnimLockedOpen = false;
    document.querySelectorAll("#cosThumbnailStudioBox, #cosAnimationsStudioBox").forEach((el) => el.remove());
    document.querySelectorAll("[data-cos-thumb-primary='1'], [data-cos-anim-primary='1'], .cos-anim-nav-tab").forEach((t) => {
      t.classList.remove("active");
      t.setAttribute("aria-selected", "false");
    });

    window.__cosHookLabLockedOpen = true;

    const stage = getStageElement();
    if (!stage) return;

    if (navBtn) {
      document.querySelectorAll("#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a").forEach((b) => {
        if (b !== navBtn) b.classList.remove("active");
      });
      navBtn.classList.add("active");
    }

    hideOtherStagePanelsForHook(stage);

    const pid = getActiveProjectId();
    const preferredFn = getActiveClipFilename();

    const statusBar = stage.querySelector(".cos-ai-tab-status-bar");
    if (statusBar) {
      statusBar.innerHTML = `
        <span>Section: <strong>Optimization</strong> &bull; Active Tool: <strong>Hook Laboratory</strong></span>
        <span>Project: <strong>${escapeHtml(pid)}</strong>${preferredFn ? ` &bull; Clip: <strong>${escapeHtml(preferredFn)}</strong>` : ""}</span>
      `;
    }

    const existing = document.getElementById("cosHookLabBox");
    if (existing) {
      existing.style.display = "";
      return;
    }

    const box = document.createElement("div");
    box.id = "cosHookLabBox";
    box.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;">
        <div>
          <div style="font-size:11.5px;font-weight:700;color:#a5b4fc;text-transform:uppercase;letter-spacing:0.04em;">
            Optimization &bull; 1. Hook Laboratory
          </div>
          <h2 style="margin:2px 0 4px 0;font-size:20px;font-weight:800;color:#ffffff;">First 3-Second Retention &amp; Hook Engineering Lab</h2>
          <div style="font-size:12.5px;color:#94a3b8;">Audit your opening 3 seconds, cut leading dead-air silence, test AI hook formulas, and burn a scroll-stopping hook banner into your clip.</div>
        </div>
      </div>

      <div class="cos-hkl-audit-bar">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="width:52px;height:52px;border-radius:12px;background:#1e1b4b;border:2px solid #818cf8;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#c7d2fe;font-weight:900;line-height:1.1;">
            <span style="font-size:18px;" data-role="hold-score">--</span>
            <span style="font-size:8.5px;text-transform:uppercase;">3s Hold</span>
          </div>
          <div>
            <div style="font-size:12.5px;font-weight:800;color:#ffffff;" data-role="opening-quote">Scanning opening 3-second spoken hook...</div>
            <div style="font-size:11.5px;color:#cbd5e1;margin-top:2px;" data-role="opening-meta">Measuring leading silence delay &amp; peak curiosity timestamps...</div>
          </div>
        </div>
        <button type="button" data-role="rescan-btn" style="padding:7px 11px;border-radius:8px;border:1px solid rgba(129,140,248,0.45);background:rgba(99,102,241,0.2);color:#e0e7ff;font-size:11.5px;font-weight:700;cursor:pointer;">
          Re-Audit Hook
        </button>
      </div>

      <div class="cos-hkl-layout">
        <div class="cos-hkl-preview-card">
          <div class="cos-hkl-video-wrap">
            <video data-role="preview-video" controls muted loop playsinline></video>
            <div class="cos-hkl-live-overlay" data-role="live-overlay">
              <span class="cos-hkl-kicker-pill" data-role="ov-kicker">REAL BREAKDOWN</span>
              <div class="cos-hkl-headline-box" data-role="ov-headline">HOW THIS MAKES $500/DAY</div>
            </div>
          </div>
          <div style="font-size:11px;color:#94a3b8;text-align:center;">
            Live 0.0s?3.2s Hook Overlay Preview
          </div>
          <a data-role="download-link" href="#" download style="display:none;padding:9px 10px;border-radius:10px;background:#10b981;color:#022c22;font-size:12px;font-weight:800;text-align:center;text-decoration:none;">
            Download Hook-Engineered MP4
          </a>
        </div>

        <div style="display:flex;flex-direction:column;gap:11px;">
          <div>
            <div style="font-size:11.5px;font-weight:700;color:#cbd5e1;margin-bottom:4px;">1. Target Clip</div>
            <select data-role="clip-sel" class="cos-hkl-select">
              <option value="${escapeHtml(preferredFn)}">${escapeHtml(preferredFn || (pid + ".mp4"))}</option>
            </select>
          </div>

          <div>
            <div style="font-size:11.5px;font-weight:700;color:#6ee7b7;margin-bottom:5px;">
              2. AI-Engineered Hook Formulas (Click Any Card to Apply)
            </div>
            <div class="cos-hkl-variants-grid" data-role="variants-grid"></div>
          </div>

          <div class="cos-hkl-row-2">
            <div>
              <label style="display:block;font-size:11.5px;font-weight:700;color:#cbd5e1;margin-bottom:4px;">3. Opening Hook Headline (0.0s?3.2s)</label>
              <input type="text" data-role="head-inp" class="cos-hkl-input" value="HOW THIS MAKES $500/DAY" maxlength="54">
            </div>
            <div>
              <label style="display:block;font-size:11.5px;font-weight:700;color:#cbd5e1;margin-bottom:4px;">Top Kicker Pill</label>
              <input type="text" data-role="kick-inp" class="cos-hkl-input" value="REAL BREAKDOWN" maxlength="28">
            </div>
          </div>

          <div class="cos-hkl-row-2">
            <div>
              <label style="display:block;font-size:11.5px;font-weight:700;color:#cbd5e1;margin-bottom:4px;">4. Hook Banner Style</label>
              <select data-role="style-sel" class="cos-hkl-select">
                <option value="viral_yellow" selected>Viral Yellow Impact Box</option>
                <option value="red_alert">Red Breaking Alert Banner</option>
                <option value="clean_white">Clean White Studio Pill</option>
                <option value="none">No Text Banner (Motion/Trim Only)</option>
              </select>
            </div>
            <div>
              <label style="display:block;font-size:11.5px;font-weight:700;color:#cbd5e1;margin-bottom:4px;">5. First-3s Visual Booster</label>
              <select data-role="motion-sel" class="cos-hkl-select">
                <option value="punch_zoom" selected>3s Attention Punch-In Zoom</option>
                <option value="flash_pop">3s Punch Zoom + Color Pop</option>
                <option value="trim_only">Static Framing (Trim Only)</option>
              </select>
            </div>
          </div>

          <div style="display:flex;gap:16px;flex-wrap:wrap;padding:6px 2px;font-size:12px;color:#cbd5e1;">
            <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;">
              <input type="checkbox" data-role="trim-chk" checked style="accent-color:#10b981;"> Auto-Trim Leading Dead-Air Silence
            </label>
            <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;">
              <input type="checkbox" data-role="whoosh-chk" checked style="accent-color:#6366f1;"> Add Subtle 0.0s Hook Whoosh SFX
            </label>
          </div>

          <button type="button" class="cos-hkl-render-btn" data-role="render-btn">
            Render Hook-Engineered Clip (MP4)
          </button>

          <div data-role="status-box" style="padding:9px 11px;border-radius:9px;background:rgba(10,14,28,0.75);border:1px solid rgba(129,140,248,0.28);font-size:12px;color:#cbd5e1;">
            Hook Laboratory ready for project <strong>${escapeHtml(pid)}</strong>.
          </div>
        </div>
      </div>
    `;

    stage.appendChild(box);
    cachedHookBox = box;

    const q = (sel) => box.querySelector(sel);
    const holdScoreEl = q("[data-role='hold-score']");
    const openQuoteEl = q("[data-role='opening-quote']");
    const openMetaEl = q("[data-role='opening-meta']");
    const rescanBtn = q("[data-role='rescan-btn']");
    const videoEl = q("[data-role='preview-video']");
    const liveOverlay = q("[data-role='live-overlay']");
    const ovKicker = q("[data-role='ov-kicker']");
    const ovHeadline = q("[data-role='ov-headline']");
    const dlLink = q("[data-role='download-link']");
    const clipSel = q("[data-role='clip-sel']");
    const variantsGrid = q("[data-role='variants-grid']");
    const headInp = q("[data-role='head-inp']");
    const kickInp = q("[data-role='kick-inp']");
    const styleSel = q("[data-role='style-sel']");
    const motionSel = q("[data-role='motion-sel']");
    const trimChk = q("[data-role='trim-chk']");
    const whooshChk = q("[data-role='whoosh-chk']");
    const renderBtn = q("[data-role='render-btn']");
    const statusBox = q("[data-role='status-box']");

    let variants = [];
    let activeIdx = 0;

    function syncLiveOverlay() {
      const st = styleSel.value;
      if (st === "none") {
        liveOverlay.style.display = "none";
        return;
      }
      liveOverlay.style.display = "flex";
      ovKicker.textContent = (kickInp.value || "").trim().toUpperCase();
      ovKicker.style.display = ovKicker.textContent ? "inline-block" : "none";
      ovHeadline.textContent = (headInp.value || "").trim().toUpperCase() || "HOOK HEADLINE";

      if (st === "red_alert") {
        ovKicker.style.background = "#dc2626";
        ovHeadline.style.background = "rgba(15, 23, 42, 0.92)";
        ovHeadline.style.borderColor = "#ef4444";
        ovHeadline.style.color = "#ffffff";
      } else if (st === "clean_white") {
        ovKicker.style.background = "#4f46e5";
        ovHeadline.style.background = "rgba(255, 255, 255, 0.95)";
        ovHeadline.style.borderColor = "#818cf8";
        ovHeadline.style.color = "#0f172a";
      } else {
        ovKicker.style.background = "#ef4444";
        ovHeadline.style.background = "rgba(9, 13, 26, 0.90)";
        ovHeadline.style.borderColor = "#facc15";
        ovHeadline.style.color = "#facc15";
      }
    }

    function renderVariantCards() {
      variantsGrid.innerHTML = variants.map((v, idx) => `
        <button type="button" class="cos-hkl-var-btn ${idx === activeIdx ? "active" : ""}" data-vidx="${idx}">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
            <span style="font-size:10px;font-weight:800;color:#a5b4fc;text-transform:uppercase;">${escapeHtml(v.formula)}</span>
            <span style="font-size:10px;font-weight:800;color:#6ee7b7;">${escapeHtml(v.lift)}</span>
          </div>
          <div style="font-size:12px;font-weight:900;color:#ffffff;margin-top:3px;">"${escapeHtml(v.headline)}"</div>
          <div style="font-size:10px;color:#94a3b8;margin-top:2px;">Badge: ${escapeHtml(v.kicker)}</div>
        </button>
      `).join("");

      variantsGrid.querySelectorAll(".cos-hkl-var-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          activeIdx = Number(btn.getAttribute("data-vidx") || 0);
          const item = variants[activeIdx];
          if (!item) return;
          headInp.value = item.headline;
          kickInp.value = item.kicker;
          renderVariantCards();
          syncLiveOverlay();
        });
      });
    }

    async function auditClip(fn) {
      openQuoteEl.textContent = "Analyzing opening 3 seconds & spoken hook...";
      const resp = await fetch("/api/cos-hook-lab-analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ project_id: pid, clip_filename: fn })
      }).then((r) => r.json()).catch(() => ({}));

      if (resp && resp.ok) {
        holdScoreEl.textContent = String(resp.hold_score || 82);
        openQuoteEl.innerHTML = `Opening 3s Speech: <span style="color:#fde047;">"${escapeHtml(resp.opening_quote)}"</span>`;
        const silTxt = resp.leading_silence_sec > 0.1
          ? `<strong style="color:#fbbf24;">${resp.leading_silence_sec}s leading dead-air detected</strong> (will be auto-trimmed)`
          : `<strong style="color:#6ee7b7;">0.0s instant speech start</strong>`;
        const peakTxt = resp.best_peak_ts > 0 ? ` &bull; Peak moment at <strong>${resp.best_peak_ts}s</strong>` : "";
        openMetaEl.innerHTML = `Topic: <strong>${escapeHtml(resp.detected_topic)}</strong> &bull; ${silTxt}${peakTxt}`;

        videoEl.src = resp.video_url;
        videoEl.load();

        if (Array.isArray(resp.variants) && resp.variants.length) {
          variants = resp.variants;
          activeIdx = 0;
          headInp.value = variants[0].headline;
          kickInp.value = variants[0].kicker;
          renderVariantCards();
          syncLiveOverlay();
        }
      } else {
        holdScoreEl.textContent = "--";
        openQuoteEl.textContent = resp.detail || "Select a rendered clip to audit its opening hook.";
      }
    }

    [headInp, kickInp].forEach((el) => el.addEventListener("input", syncLiveOverlay));
    styleSel.addEventListener("change", syncLiveOverlay);
    rescanBtn.addEventListener("click", () => auditClip(clipSel.value));
    clipSel.addEventListener("change", () => {
      setStudioState({ activeClipFilename: clipSel.value });
      auditClip(clipSel.value);
    });

    renderBtn.addEventListener("click", async () => {
      renderBtn.disabled = true;
      renderBtn.textContent = "Rendering Hook-Engineered MP4...";
      statusBox.textContent = "Trimming leading dead air, burning 3.2s hook banner & rendering HD MP4...";

      const resp = await fetch("/api/cos-hook-lab-render", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          project_id: pid,
          clip_filename: clipSel.value,
          headline: headInp.value,
          kicker: kickInp.value,
          banner_style: styleSel.value,
          motion_style: motionSel.value,
          trim_silence: trimChk.checked,
          add_whoosh: whooshChk.checked
        })
      }).then((r) => r.json()).catch((err) => ({ detail: String(err) }));

      renderBtn.disabled = false;
      renderBtn.textContent = "Render Hook-Engineered Clip (MP4)";

      if (resp && resp.ok && resp.clip) {
        setStudioState({ activeClipFilename: resp.clip.filename });
        liveOverlay.style.display = "none";
        videoEl.src = resp.clip.url;
        videoEl.load();
        videoEl.play().catch(() => {});
        dlLink.href = resp.clip.url;
        dlLink.download = resp.clip.filename;
        dlLink.style.display = "block";
        holdScoreEl.textContent = "96";
        statusBox.innerHTML = `<strong style="color:#6ee7b7;">Hook-Engineered Clip Rendered!</strong> Trimmed ${resp.trimmed_silence_sec}s dead air &bull; Saved <strong>${escapeHtml(resp.clip.filename)}</strong> (${resp.clip.size_mb} MB).`;
      } else {
        statusBox.textContent = resp.detail || "Could not render hook clip.";
      }
    });

    syncLiveOverlay();
    fetch(`/api/cos-output-clips/${encodeURIComponent(pid)}`)
      .then((r) => r.json())
      .then((data) => {
        const clips = Array.isArray(data.clips) ? data.clips : [];
        if (clips.length) {
          const active = clips.find((c) => c.filename === preferredFn) || clips[0];
          clipSel.innerHTML = clips.map((c) =>
            `<option value="${escapeHtml(c.filename)}" ${c.filename === active.filename ? "selected" : ""}>${escapeHtml(c.title)} (${c.size_mb} MB)</option>`
          ).join("");
          auditClip(active.filename);
        } else {
          auditClip("");
        }
      })
      .catch(() => auditClip(preferredFn));
  }

  function findHookLabNavTarget(target) {
    if (!target || target.closest("#cosHookLabBox")) return null;
    return Array.from(document.querySelectorAll("#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a, #cosStudioArchitecture button, #cosStudioArchitecture a, [role='tab'], .cos-subtool-btn, .cos-tab-btn"))
      .find((el) => el.contains(target) && /^hook\s*laboratory$/i.test(normalizeLabel(el))) || null;
  }

  ["pointerdown", "click"].forEach((evtType) => {
    document.addEventListener(evtType, function (e) {
      const hookNav = findHookLabNavTarget(e.target);
      if (hookNav) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        openHookLabView(hookNav);
        return;
      }

      if (evtType !== "click" || !e.isTrusted) return;

      const otherNav = e.target.closest(
        "#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a, #cosStudioArchitecture button, #cosStudioArchitecture a, [role='tab'], [data-tool], [data-page], [data-subtool], .cos-subtool-btn, .cos-tab-btn"
      );
      if (otherNav && !otherNav.closest("#cosHookLabBox") && !otherNav.closest("#cosAutoAiBanner")) {
        const lbl = normalizeLabel(otherNav);
        const isOtherCustom = /^thumbnail\s*designer$/i.test(lbl) || /^animations?$/i.test(lbl) || /^hook\s*laboratory$/i.test(lbl) || /^caption\s*(?:&|and)\s*title\s*lab$/i.test(lbl) || /^clip\s*quality\s*inspect[eo]r$/i.test(lbl) || /^a\s*\/?\s*b\s*testing\s*lab$/i.test(lbl) || /^viral\s*score\s*analysis$/i.test(lbl) || /^export\s*center$/i.test(lbl);
        closeHookLabView(!isOtherCustom);
      }
    }, true);
  });

  // Auto-open if Hook Laboratory is already selected in the sidebar
  setTimeout(() => {
    const activeHookBtn = Array.from(document.querySelectorAll("#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a"))
      .find((el) => /^hook\s*laboratory$/i.test(normalizeLabel(el)) && (el.classList.contains("active") || el.getAttribute("aria-selected") === "true"));
    if (activeHookBtn) {
      openHookLabView(activeHookBtn);
    }
  }, 350);

  setInterval(() => {
    if (window.__cosHookLabLockedOpen) {
      const stage = getStageElement();
      if (stage) {
        hideOtherStagePanelsForHook(stage);
        if (!document.getElementById("cosHookLabBox") && cachedHookBox) {
          stage.appendChild(cachedHookBox);
        }
      }
    }
  }, 250);
})();
</script>

      vid.id = "cosSubtitlePreviewVideo";
      vid.controls = true;
      vid.playsInline = true;
      vid.preload = "auto";
      vid.src = startUrl;
      slot.prepend(vid);

      function formatCase(text) {
        if (currentCase === "upper") return String(text || "").toUpperCase();
        if (currentCase === "title") return toTitleCase(text);
        return String(text || "");
      }

      function updateOverlayAppearance() {
        liveOverlay.className = "cos-sub-live-caption style-" + currentStyle;
        liveOverlay.style.top = currentYPct + "%";

        const fontCssMap = {
          impact: "Impact, 'Arial Black', sans-serif",
          sans: "Arial, 'Segoe UI', sans-serif",
          serif: "Georgia, 'Times New Roman', serif",
          mono: "Consolas, 'Courier New', monospace"
        };
        liveOverlay.style.fontFamily = fontCssMap[currentFont] || fontCssMap.sans;
        liveOverlay.style.fontSize = Math.round(currentFontSize * 0.24) + "px";

        if (customAccentHex) {
          if (currentStyle === "podcast" || currentStyle === "fire_red") {
            liveOverlay.style.background = customAccentHex;
            liveOverlay.style.color = "#ffffff";
          } else {
            liveOverlay.style.background = "";
            liveOverlay.style.color = customAccentHex;
          }
        } else {
          liveOverlay.style.background = "";
          liveOverlay.style.color = "";
        }

        const styleNames = {
          hormozi: "Bold Yellow Pop",
          karaoke: "Karaoke Word-Pop",
          podcast: "Clean Podcast Box",
          fire_red: "Viral Red Alert",
          neon: "Neon Mint Hook",
          cyan: "Electric Cyan",
          gold: "Gold & Obsidian",
          minimal: "Minimal Cinema"
        };
        const animLabel = currentAnim === "karaoke" ? "Karaoke" : (currentAnim === "pop" ? "Pop-In" : "Static");
        pill.textContent = `${styleNames[currentStyle] || currentStyle} ? ${animLabel}`;
        syncLiveCaptionText(true);
      }

      function syncLiveCaptionText(forceAnim) {
        const t = vid.currentTime || 0;
        let idx = segments.findIndex((s) => t >= Number(s.start) && t <= Number(s.end));
        if (idx === -1) idx = 0;
        const activeSeg = segments[idx];

        if (!activeSeg || !activeSeg.text.trim()) {
          liveOverlay.style.opacity = "0";
          return;
        }
        liveOverlay.style.opacity = "1";

        if ((idx !== lastRenderedIndex || forceAnim) && currentAnim === "pop") {
          liveOverlay.classList.remove("anim-pop");
          void liveOverlay.offsetWidth;
          liveOverlay.classList.add("anim-pop");
        }
        lastRenderedIndex = idx;

        const formatted = formatCase(activeSeg.text);
        if (currentAnim === "karaoke" || currentStyle === "karaoke") {
          const words = formatted.split(/\s+/).filter(Boolean);
          const dur = Math.max(0.2, Number(activeSeg.end) - Number(activeSeg.start));
          const progress = Math.max(0, Math.min(0.999, (t - Number(activeSeg.start)) / dur));
          const activeWordIdx = Math.min(words.length - 1, Math.floor(progress * words.length));
          const hiColor = customAccentHex || "#facc15";
          liveOverlay.innerHTML = words.map((w, wi) =>
            wi <= activeWordIdx
              ? `<span style="color:${hiColor};">${escapeHtml(w)}</span>`
              : `<span style="color:#ffffff;">${escapeHtml(w)}</span>`
          ).join(" ");
        } else {
          liveOverlay.textContent = formatted;
        }
      }

      vid.addEventListener("timeupdate", () => syncLiveCaptionText(false));
      vid.addEventListener("seeked", () => syncLiveCaptionText(true));

      function renderLinesEditor() {
        linesList.innerHTML = segments.map((seg, idx) => `
          <div class="cos-sub-line-item" data-idx="${idx}">
            <input type="number" step="0.1" min="0" class="cos-sub-time-in" data-field="start" value="${Number(seg.start).toFixed(1)}" title="Start (sec)">
            <input type="number" step="0.1" min="0.2" class="cos-sub-time-in" data-field="end" value="${Number(seg.end).toFixed(1)}" title="End (sec)">
            <input type="text" class="cos-sub-text-in" data-field="text" value="${escapeHtml(seg.text)}" placeholder="Caption text...">
            <button type="button" class="cos-sub-del-line" data-del="${idx}" title="Remove line">&times;</button>
          </div>
        `).join("");

        linesList.querySelectorAll("input").forEach((inp) => {
          inp.addEventListener("input", () => {
            const row = inp.closest(".cos-sub-line-item");
            const i = Number(row.getAttribute("data-idx"));
            const field = inp.getAttribute("data-field");
            if (!segments[i]) return;
            segments[i][field] = field === "text" ? inp.value : Number(inp.value || 0);
            syncLiveCaptionText(false);
          });
          inp.addEventListener("focus", () => {
            const row = inp.closest(".cos-sub-line-item");
            const i = Number(row.getAttribute("data-idx"));
            if (segments[i]) {
              try { vid.currentTime = Number(segments[i].start) + 0.05; } catch (_) {}
              syncLiveCaptionText(true);
            }
          });
        });

        linesList.querySelectorAll(".cos-sub-del-line").forEach((delBtn) => {
          delBtn.addEventListener("click", () => {
            const i = Number(delBtn.getAttribute("data-del"));
            if (segments.length > 1) {
              segments.splice(i, 1);
              renderLinesEditor();
              syncLiveCaptionText(true);
            }
          });
        });
      }

      renderLinesEditor();
      updateOverlayAppearance();

      ui.querySelectorAll(".cos-sub-preset-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          ui.querySelectorAll(".cos-sub-preset-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentStyle = btn.getAttribute("data-style") || "hormozi";
          if (currentStyle === "karaoke") {
            currentAnim = "karaoke";
            document.getElementById("cosSubAnimSelect").value = "karaoke";
          }
          customAccentHex = "";
          updateOverlayAppearance();
        });
      });

      document.getElementById("cosSubFontSelect").addEventListener("change", function () {
        currentFont = this.value;
        updateOverlayAppearance();
      });

      document.getElementById("cosSubSizeSelect").addEventListener("change", function () {
        currentFontSize = Number(this.value || 60);
        updateOverlayAppearance();
      });

      document.getElementById("cosSubAnimSelect").addEventListener("change", function () {
        currentAnim = this.value;
        updateOverlayAppearance();
      });

      document.getElementById("cosSubCaseSelect").addEventListener("change", function () {
        currentCase = this.value;
        syncLiveCaptionText(false);
      });

      const ySlider = document.getElementById("cosSubYSlider");
      const yLbl = document.getElementById("cosSubYLbl");
      ySlider.addEventListener("input", () => {
        currentYPct = Number(ySlider.value || 72);
        yLbl.textContent = currentYPct + "%";
        updateOverlayAppearance();
      });

      const colorPicker = document.getElementById("cosSubColorPicker");
      colorPicker.addEventListener("input", () => {
        customAccentHex = colorPicker.value;
        updateOverlayAppearance();
      });

      ui.querySelectorAll(".cos-sub-swatch").forEach((sw) => {
        sw.addEventListener("click", () => {
          customAccentHex = sw.getAttribute("data-hex") || "#facc15";
          colorPicker.value = customAccentHex;
          updateOverlayAppearance();
        });
      });

      document.getElementById("cosSubColorReset").addEventListener("click", () => {
        customAccentHex = "";
        updateOverlayAppearance();
      });

      // Auto-split long lines into punchy 3-word Shorts chunks
      document.getElementById("cosSubSplit3WordsBtn").addEventListener("click", () => {
        const newSegs = [];
        segments.forEach((seg) => {
          const words = String(seg.text || "").trim().split(/\s+/).filter(Boolean);
          if (words.length <= 3) {
            newSegs.push(Object.assign({}, seg));
            return;
          }
          const chunks = [];
          for (let i = 0; i < words.length; i += 3) {
            chunks.push(words.slice(i, i + 3).join(" "));
          }
          const totalDur = Math.max(0.4, Number(seg.end) - Number(seg.start));
          const sliceDur = totalDur / chunks.length;
          chunks.forEach((chunkTxt, ci) => {
            newSegs.push({
              start: Number((Number(seg.start) + ci * sliceDur).toFixed(2)),
              end: Number((Number(seg.start) + (ci + 1) * sliceDur).toFixed(2)),
              text: chunkTxt
            });
          });
        });
        segments = newSegs;
        renderLinesEditor();
        syncLiveCaptionText(true);
        statusEl.innerHTML = `<strong style="color:#6ee7b7;">Split into ${segments.length} punchy 3-word hooks!</strong>`;
      });

      document.getElementById("cosSubAddLineBtn").addEventListener("click", () => {
        const lastEnd = segments.length ? Number(segments[segments.length - 1].end) : 0;
        segments.push({ start: Number(lastEnd.toFixed(1)), end: Number((lastEnd + 3.0).toFixed(1)), text: "New caption line" });
        renderLinesEditor();
        syncLiveCaptionText(true);
      });

      // Instant client-side .SRT download
      document.getElementById("cosSubDownloadSrtBtn").addEventListener("click", () => {
        function fmtSrt(s) {
          s = Math.max(0, Number(s) || 0);
          const h = String(Math.floor(s / 3600)).padStart(2, "0");
          const m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
          const sec = String(Math.floor(s % 60)).padStart(2, "0");
          const ms = String(Math.round((s - Math.floor(s)) * 1000)).padStart(3, "0");
          return `${h}:${m}:${sec},${ms}`;
        }
        const srtBody = segments.map((seg, i) =>
          `${i + 1}\n${fmtSrt(seg.start)} --> ${fmtSrt(seg.end)}\n${formatCase(seg.text)}\n`
        ).join("\n");
        const blob = new Blob([srtBody], { type: "text/plain;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = (clipSel.value || pid).replace(/\.mp4$/i, "") + ".srt";
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1500);
      });

      async function runAutoTranscribe() {
        const tBtn = document.getElementById("cosSubTranscribeBtn");
        tBtn.disabled = true;
        tBtn.textContent = "Transcribing...";
        statusEl.textContent = "Reading speech from your clip audio...";

        const resp = await fetch("/api/cos-subtitle-transcribe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            project_id: pid,
            clip_filename: clipSel.value
          })
        }).then((r) => r.json()).catch(() => ({}));

        tBtn.disabled = false;
        tBtn.textContent = "Auto-Transcribe Audio";

        if (resp && resp.ok && Array.isArray(resp.segments) && resp.segments.length) {
          segments = resp.segments;
          renderLinesEditor();
          syncLiveCaptionText(true);
          statusEl.innerHTML = `<strong style="color:#6ee7b7;">Loaded ${segments.length} timed lines!</strong> Use <strong>Split Into 3-Word Punches</strong> or burn directly onto MP4.`;
        } else {
          statusEl.textContent = resp.detail || "Could not auto-transcribe clip.";
        }
      }

      document.getElementById("cosSubTranscribeBtn").addEventListener("click", runAutoTranscribe);

      clipSel.addEventListener("change", () => {
        const chosen = clips.find((c) => c.filename === clipSel.value);
        if (!chosen) return;
        setStudioState({ activeClipFilename: chosen.filename });
        vid.pause();
        vid.src = chosen.url;
        vid.load();
        vid.play().catch(() => {});
        dlBtn.href = chosen.url;
        dlBtn.download = chosen.filename;
        runAutoTranscribe();
      });

      async function runBurnSubtitles(btnToUpdate) {
        const origLabel = btnToUpdate ? btnToUpdate.textContent : "";
        if (btnToUpdate) {
          btnToUpdate.disabled = true;
          btnToUpdate.textContent = "Burning Subtitles...";
        }
        statusEl.textContent = "Burning styled captions onto your 9:16 MP4 with FFmpeg...";

        const resp = await fetch("/api/cos-subtitle-studio-apply", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            project_id: pid,
            clip_filename: clipSel.value,
            style: currentStyle,
            font: currentFont,
            font_size: currentFontSize,
            y_pct: currentYPct,
            letter_case: currentCase,
            animation: currentAnim,
            accent_color: customAccentHex,
            segments: segments
          })
        }).then((r) => r.json()).catch(() => ({}));

        if (btnToUpdate) {
          btnToUpdate.disabled = false;
          btnToUpdate.textContent = origLabel;
        }

        if (resp && resp.ok && resp.clip) {
          clips.unshift(resp.clip);
          clipSel.innerHTML = clips.map((c) => `<option value="${escapeHtml(c.filename)}" ${c.filename === resp.clip.filename ? "selected" : ""}>${escapeHtml(c.title)} (${c.size_mb} MB)</option>`).join("");
          setStudioState({ activeClipFilename: resp.clip.filename });
          liveOverlay.style.display = "none";
          vid.pause();
          vid.src = resp.clip.url;
          vid.load();
          vid.play().catch(() => {});
          dlBtn.href = resp.clip.url;
          dlBtn.download = resp.clip.filename;
          statusEl.innerHTML = `<strong style="color:#6ee7b7;">Subtitles Burned &amp; Saved!</strong> Playing your newly subtitled 9:16 short?click <strong>Download Subtitled MP4</strong>.`;
        } else {
          statusEl.textContent = resp.detail || "Could not burn subtitles onto clip.";
        }
      }

      document.getElementById("cosSubBurnBtn").addEventListener("click", function () {
        runBurnSubtitles(this);
      });

      const topSaveBtn = Array.from(stage.querySelectorAll("button")).find((b) =>
        /^save settings$/i.test((b.textContent || "").trim())
      );
      if (topSaveBtn && !topSaveBtn.getAttribute("data-cos-sub-wired")) {
        topSaveBtn.setAttribute("data-cos-sub-wired", "true");
        topSaveBtn.addEventListener("click", function () {
          runBurnSubtitles(this);
        });
      }

      runAutoTranscribe();
    } finally {
      isRenderingSubStudio = false;
    }
  }

  setInterval(enhanceSubtitleStudioPage, 500);
})();
</script>

<script id="cos-sound-design-script">
(function () {
  function getStudioState() {
    try { return JSON.parse(localStorage.getItem("cos_studio_state_v2") || "{}"); } catch (_) { return {}; }
  }

  function setStudioState(patch) {
    try {
      const next = Object.assign({}, getStudioState(), patch);
      localStorage.setItem("cos_studio_state_v2", JSON.stringify(next));
    } catch (_) {}
  }

  function getActiveProjectId() {
    const st = getStudioState();
    if (st.activeProjectId && st.activeProjectId !== "undefined") return String(st.activeProjectId);
    const sel = document.getElementById("cosCtxProjectSelect");
    return sel && sel.value && sel.value !== "undefined" ? sel.value : "proj-bf2e1fae";
  }

  function getActiveClipFilename() {
    const topSel = document.getElementById("cosCtxClipSelect");
    if (topSel && topSel.value && topSel.value.endsWith(".mp4")) return topSel.value;
    const st = getStudioState();
    return (st.activeClipFilename && st.activeClipFilename.endsWith(".mp4")) ? st.activeClipFilename : "";
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Instant browser WebAudio synthesizer so user can audition SFX before rendering
  function auditionHookSfx(sfxType) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const now = ctx.currentTime;

    if (sfxType === "sub_drop") {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(95, now);
      osc.frequency.exponentialRampToValueAtTime(34, now + 0.55);
      gain.gain.setValueAtTime(0.65, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.62);
    } else if (sfxType === "pop_ding") {
      [880, 1320].forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(idx === 0 ? 0.35 : 0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.44);
      });
    } else if (sfxType === "riser") {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.exponentialRampToValueAtTime(640, now + 0.9);
      gain.gain.setValueAtTime(0.02, now);
      gain.gain.linearRampToValueAtTime(0.24, now + 0.75);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.95);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.98);
    } else {
      // Crisp air swoosh via filtered white noise buffer
      const bufferSize = Math.floor(ctx.sampleRate * 0.5);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.setValueAtTime(450, now);
      filter.frequency.exponentialRampToValueAtTime(1800, now + 0.25);
      filter.frequency.exponentialRampToValueAtTime(500, now + 0.5);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.45, now + 0.22);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      noise.connect(filter).connect(gain).connect(ctx.destination);
      noise.start(now);
    }
    setTimeout(() => { try { ctx.close(); } catch (_) {} }, 1300);
  }

  let isRenderingSoundStudio = false;

  async function enhanceSoundDesignPage() {
    const host = document.getElementById("cosStudioArchitecture");
    if (!host) return;
    const stage = host.querySelector(".cos-tool-stage") || host;

    const heading = Array.from(stage.querySelectorAll("h1, h2")).find((h) =>
      /^sound design studio$|^sound design$|^audio studio$|^voice & sound mastering$/i.test((h.textContent || "").trim())
    );
    if (!heading) return;

    const cards = Array.from(stage.querySelectorAll(".cos-ws-card"));
    const card = cards[0];
    if (!card || card.getAttribute("data-cos-soundstudio-ready") === "true" || isRenderingSoundStudio) return;
    isRenderingSoundStudio = true;

    try {
      card.setAttribute("data-cos-soundstudio-ready", "true");
      cards.slice(1).forEach((extra) => { extra.style.display = "none"; });
      card.classList.add("span-2");

      heading.textContent = "Voice & Sound Mastering Studio";
      const sub = heading.nextElementSibling;
      if (sub) {
        sub.textContent = "Give your short studio vocal clarity, add a scroll-stopping opening SFX, and auto-level loudness to -14 LUFS.";
      }

      const pid = getActiveProjectId();

        topClipSel.innerHTML = clips.map((c) => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.title)}</option>`).join("");

      }

          <span>Live Audio Master, Hook SFX &amp; Loudness Mix</span>
          <span class="cos-ws-head-pill" style="color:#6ee7b7;" id="cosSndLivePill">Shorts Viral Punch ? -14 LUFS</span>

        <div class="cos-snd-grid">

            <div class="cos-snd-slot" id="cosSndVideoSlot">
              <div class="cos-snd-meter-overlay">

                ${clips.length
                  ? clips.map((c) => `<option value="${escapeHtml(c.filename)}" ${activeClip && c.filename === activeClip.filename ? "selected" : ""}>${escapeHtml(c.title)} (${c.size_mb} MB)</option>`).join("")
                  : `<option value="">${escapeHtml(pid)}.mp4</option>`}
              </select>
            </div>

            <div>
              <div style="font-size:11.5px;font-weight:700;color:#cbd5e1;margin-bottom:5px;">2. Voice EQ &amp; Clarity Preset</div>

                  <div style="font-size:10px;color:#94a3b8;margin-top:2px;">Crisp vocal presence + tight punch</div>
                </button>

                  <div style="font-size:12px;font-weight:800;color:#e2e8f0;">Broadcast Leveler</div>

            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">

              <button type="button" class="cos-snd-primary-btn" id="cosSndApplyBtn">
                Save &amp; Render Audio Mix &rarr;

        </div>
      `;

      topArea.appendChild(ui);

      const slot = document.getElementById("cosSndVideoSlot");
      const pill = document.getElementById("cosSndLivePill");
      const dlBtn = document.getElementById("cosSndDownloadBtn");
      const mp3Btn = document.getElementById("cosSndMp3Btn");
      const clipSel = document.getElementById("cosSndClipSelect");
      const sfxSel = document.getElementById("cosSndSfxSelect");
      const sfxTimeSel = document.getElementById("cosSndSfxTimeSelect");
      const bedSel = document.getElementById("cosSndBedSelect");
      const gainSlider = document.getElementById("cosSndGainSlider");
      const gainLbl = document.getElementById("cosSndGainLbl");
      const lufsChk = document.getElementById("cosSndLufsChk");
      const meterLbl = document.getElementById("cosSndMeterLabel");
      const bars = Array.from(document.querySelectorAll("#cosSndBars span"));
      const statusEl = document.getElementById("cosSndStatusText");

      document.querySelectorAll("video").forEach((v) => { try { v.pause(); } catch (_) {} });
      const vid = document.createElement("video");
      vid.id = "cosSoundPreviewVideo";
      vid.controls = true;
      vid.playsInline = true;
      vid.preload = "auto";
      vid.src = startUrl;
      slot.prepend(vid);

      // Animate level bars while video plays
      setInterval(() => {
        if (!vid.paused && !vid.ended) {
          meterLbl.textContent = lufsChk.checked ? "LIVE ? -14 LUFS" : "LIVE ? MASTER";
          bars.forEach((b, i) => {
            const h = 4 + Math.round(Math.abs(Math.sin((vid.currentTime * 9) + i * 1.3)) * 9);
            b.style.height = h + "px";
          });
        } else {
          meterLbl.textContent = "AUDIO READY";
          bars.forEach((b) => { b.style.height = "4px"; });
        }
      }, 110);

      function updatePill() {
        const names = {
          shorts_punch: "Shorts Viral Punch",
          podcast_warm: "Deep Podcast Warmth",
          noise_clean: "Studio Noise Clean",
          bass_boost: "High-Energy Bass",
          broadcast_level: "Broadcast Leveler",
          natural: "Natural Mix"
        };
        pill.textContent = `${names[currentVoicePreset] || currentVoicePreset} ? ${lufsChk.checked ? "-14 LUFS" : "Custom Gain"}`;
      }

      ui.querySelectorAll(".cos-snd-preset-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          ui.querySelectorAll(".cos-snd-preset-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentVoicePreset = btn.getAttribute("data-preset") || "shorts_punch";
          updatePill();
        });
      });

      gainSlider.addEventListener("input", () => {
        const val = Number(gainSlider.value || 0);
        gainLbl.textContent = (val >= 0 ? "+" : "") + val.toFixed(1) + " dB";
      });

      lufsChk.addEventListener("change", updatePill);

      document.getElementById("cosSndAuditionBtn").addEventListener("click", () => {
        const chosenSfx = sfxSel.value;
        if (chosenSfx === "none") {
          statusEl.textContent = "Select a Hook SFX (like Cinema Sub-Drop or Viral Pop Ding) to audition it.";
          return;
        }
        auditionHookSfx(chosenSfx);
      });

      clipSel.addEventListener("change", () => {
        const chosen = clips.find((c) => c.filename === clipSel.value);
        if (!chosen) return;
        setStudioState({ activeClipFilename: chosen.filename });
        vid.pause();
        vid.src = chosen.url;
        vid.load();
        vid.play().catch(() => {});
        dlBtn.href = chosen.url;
        dlBtn.download = chosen.filename;
        mp3Btn.style.display = "none";
      });

      async function runSoundDesignMix(btnToUpdate) {
        const origLabel = btnToUpdate ? btnToUpdate.textContent : "";
        if (btnToUpdate) {
          btnToUpdate.disabled = true;
          btnToUpdate.textContent = "Mastering Audio...";
        }
        statusEl.textContent = "Mastering voice EQ, mixing hook SFX & leveling loudness with FFmpeg...";

        const resp = await fetch("/api/cos-sound-design-apply", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            project_id: pid,
            clip_filename: clipSel.value,
            voice_preset: currentVoicePreset,
            sfx_type: sfxSel.value,
            sfx_time: Number(sfxTimeSel.value || 0),
            music_bed: bedSel.value,
            voice_gain_db: Number(gainSlider.value || 1.5),
            normalize_lufs: lufsChk.checked
          })
        }).then((r) => r.json()).catch(() => ({}));

        if (btnToUpdate) {
          btnToUpdate.disabled = false;
          btnToUpdate.textContent = origLabel;
        }

        if (resp && resp.ok && resp.clip) {
          clips.unshift(resp.clip);
          clipSel.innerHTML = clips.map((c) => `<option value="${escapeHtml(c.filename)}" ${c.filename === resp.clip.filename ? "selected" : ""}>${escapeHtml(c.title)} (${c.size_mb} MB)</option>`).join("");
          setStudioState({ activeClipFilename: resp.clip.filename });
          vid.pause();
          vid.src = resp.clip.url;
          vid.load();
          vid.play().catch(() => {});
          dlBtn.href = resp.clip.url;
          dlBtn.download = resp.clip.filename;
          if (resp.mp3_url) {
            mp3Btn.href = resp.mp3_url;
            mp3Btn.download = resp.mp3_filename || "mastered_audio.mp3";
            mp3Btn.style.display = "block";
          }
          statusEl.innerHTML = `<strong style="color:#6ee7b7;">Audio Mastered &amp; Saved!</strong> Playing your mixed 9:16 clip?download the MP4 or standalone MP3.`;
        } else {
          statusEl.textContent = resp.detail || "Could not master clip audio.";
        }
      }

      document.getElementById("cosSndApplyBtn").addEventListener("click", function () {
        runSoundDesignMix(this);
      });

      const topSaveBtn = Array.from(stage.querySelectorAll("button")).find((b) =>
        /^save settings$/i.test((b.textContent || "").trim())
      );
      if (topSaveBtn && !topSaveBtn.getAttribute("data-cos-snd-wired")) {
        topSaveBtn.setAttribute("data-cos-snd-wired", "true");
        topSaveBtn.addEventListener("click", function () {
          runSoundDesignMix(this);
        });
      }
    } finally {
      isRenderingSoundStudio = false;
    }
  }

  setInterval(enhanceSoundDesignPage, 500);
})();
</script>

<script id="cos-visual-effects-script">
(function () {
  function getStudioState() {
    try { return JSON.parse(localStorage.getItem("cos_studio_state_v2") || "{}"); } catch (_) { return {}; }
  }

  function setStudioState(patch) {
    try {
      const next = Object.assign({}, getStudioState(), patch);
      localStorage.setItem("cos_studio_state_v2", JSON.stringify(next));
    } catch (_) {}
  }

  function getActiveProjectId() {
    const st = getStudioState();
    if (st.activeProjectId && st.activeProjectId !== "undefined") return String(st.activeProjectId);
    const sel = document.getElementById("cosCtxProjectSelect");
    return sel && sel.value && sel.value !== "undefined" ? sel.value : "proj-bf2e1fae";
  }

  function getActiveClipFilename() {
    const topSel = document.getElementById("cosCtxClipSelect");
    if (topSel && topSel.value && topSel.value.endsWith(".mp4")) return topSel.value;
    const st = getStudioState();
    return (st.activeClipFilename && st.activeClipFilename.endsWith(".mp4")) ? st.activeClipFilename : "";
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  let isRenderingVfxStudio = false;

  async function enhanceVisualEffectStudioPage() {
    const host = document.getElementById("cosStudioArchitecture");
    if (!host) return;
    const stage = host.querySelector(".cos-tool-stage") || host;

    const heading = Array.from(stage.querySelectorAll("h1, h2")).find((h) =>
      /^visual effects? studio$|^visual effects?$|^vfx studio$|^visual effects & color look$/i.test((h.textContent || "").trim())
    );
    if (!heading) return;

    const cards = Array.from(stage.querySelectorAll(".cos-ws-card"));
    const card = cards[0];
    if (!card || card.getAttribute("data-cos-vfxstudio-ready") === "true" || isRenderingVfxStudio) return;
    isRenderingVfxStudio = true;

    try {
      card.setAttribute("data-cos-vfxstudio-ready", "true");
      cards.slice(1).forEach((extra) => { extra.style.display = "none"; });
      card.classList.add("span-2");

      heading.textContent = "Visual Effects & Color Look Studio";
      const sub = heading.nextElementSibling;
      if (sub) {
        sub.textContent = "Apply cinema color grades, opening hook flashes, edge vignettes, and retention progress bars with live preview.";
      }

      const pid = getActiveProjectId();
      const data = await fetch(`/api/cos-output-clips/${encodeURIComponent(pid)}`).then((r) => r.json()).catch(() => ({ clips: [] }));
      let clips = Array.isArray(data.clips) ? data.clips : [];
      const preferredFn = getActiveClipFilename();
      let activeClip = clips.find((c) => c.filename === preferredFn) || clips[0] || null;
      const startUrl = activeClip ? activeClip.url : `/api/cos-preview-video/${encodeURIComponent(pid)}`;

      const topClipSel = document.getElementById("cosCtxClipSelect");
      if (topClipSel && clips.length > 0) {
        topClipSel.innerHTML = clips.map((c) => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.title)}</option>`).join("");
        if (activeClip) topClipSel.value = activeClip.id;
      }

      const topArea = card.querySelector(".cos-ws-card-top") || card;
      Array.from(topArea.children).forEach((ch) => {
        ch.style.display = "none";
      });

      let currentLook = "creator_hdr";

      const ui = document.createElement("div");
      ui.id = "cosVisualEffectsHumanBox";
      ui.innerHTML = `
        <div class="cos-ws-card-head" style="margin-bottom:12px;">
          <span>Live Color Look, Hook Transition &amp; Retention Bar</span>
          <span class="cos-ws-head-pill" style="color:#6ee7b7;" id="cosVfxLivePill">Crisp Creator HDR ? Subtle Vignette</span>
        </div>

        <div class="cos-vfx-grid">
          <div class="cos-vfx-phone">
            <div class="cos-vfx-slot" id="cosVfxVideoSlot">
              <div class="cos-vfx-vignette vig-subtle" id="cosVfxVignetteOverlay"></div>
              <div class="cos-vfx-prog-track" id="cosVfxProgTrack">
                <div class="cos-vfx-prog-fill" id="cosVfxProgFill"></div>
              </div>
            </div>
            <a id="cosVfxDownloadBtn" class="cos-vfx-dl-btn"
              href="${escapeHtml(startUrl)}" download="${escapeHtml(activeClip ? activeClip.filename : pid + '_vfx.mp4')}">
              Download VFX MP4
            </a>
          </div>

          <div class="cos-vfx-controls">
            <div>
              <div style="font-size:11.5px;font-weight:700;color:#cbd5e1;margin-bottom:4px;">1. Active Short</div>
              <select id="cosVfxClipSelect" class="cos-vfx-select">
                ${clips.length
                  ? clips.map((c) => `<option value="${escapeHtml(c.filename)}" ${activeClip && c.filename === activeClip.filename ? "selected" : ""}>${escapeHtml(c.title)} (${c.size_mb} MB)</option>`).join("")
                  : `<option value="">${escapeHtml(pid)}.mp4</option>`}
              </select>

            <div>
              <div style="font-size:11.5px;font-weight:700;color:#cbd5e1;margin-bottom:5px;">2. Color Look &amp; Film Grade</div>
              <div class="cos-vfx-presets" id="cosVfxLookGroup">
                <button type="button" class="cos-vfx-preset-btn active" data-look="creator_hdr" data-c="1.08" data-s="1.15">
                  <div style="font-size:12px;font-weight:800;color:#6ee7b7;">Crisp Creator HDR</div>
                  <div style="font-size:10px;color:#94a3b8;margin-top:2px;">Vibrant colors + sharp detail</div>
                </button>
                <button type="button" class="cos-vfx-preset-btn" data-look="teal_orange" data-c="1.12" data-s="1.12">
                  <div style="font-size:12px;font-weight:800;color:#38bdf8;">Cinema Teal &amp; Orange</div>
                  <div style="font-size:10px;color:#94a3b8;margin-top:2px;">Hollywood skin &amp; shadow split</div>
                </button>
                <button type="button" class="cos-vfx-preset-btn" data-look="moody_dark" data-c="1.16" data-s="0.92">
                  <div style="font-size:12px;font-weight:800;color:#a5b4fc;">Moody Dark Podcast</div>
                  <div style="font-size:10px;color:#94a3b8;margin-top:2px;">Deep contrast studio drama</div>
                </button>
                <button type="button" class="cos-vfx-preset-btn" data-look="golden_warm" data-c="1.08" data-s="1.16">
                  <div style="font-size:12px;font-weight:800;color:#facc15;">Golden Hour Warm</div>
                  <div style="font-size:10px;color:#94a3b8;margin-top:2px;">Rich sunset warmth &amp; glow</div>
                </button>
                <button type="button" class="cos-vfx-preset-btn" data-look="high_key" data-c="1.05" data-s="1.08">
                  <div style="font-size:12px;font-weight:800;color:#ffffff;">Clean High-Key</div>
                  <div style="font-size:10px;color:#94a3b8;margin-top:2px;">Bright airy social-feed look</div>
                </button>
                <button type="button" class="cos-vfx-preset-btn" data-look="noir_bw" data-c="1.26" data-s="0.00">
                  <div style="font-size:12px;font-weight:800;color:#cbd5e1;">Noir B&amp;W Contrast</div>
                  <div style="font-size:10px;color:#94a3b8;margin-top:2px;">Bold monochrome storytelling</div>
                </button>
              </div>
            </div>

            <div class="cos-vfx-row-3">
              <div>
                <label style="display:block;font-size:11px;font-weight:700;color:#cbd5e1;margin-bottom:3px;">3. Opening Hook Flash</label>
                <select id="cosVfxIntroSelect" class="cos-vfx-select">
                  <option value="none" selected>None (Instant Cut)</option>
                  <option value="white_flash">White Hook Flash (0.28s)</option>
                  <option value="fade_black">Smooth Cinema Fade-In (0.42s)</option>
                </select>
              </div>
              <div>
                <label style="display:block;font-size:11px;font-weight:700;color:#cbd5e1;margin-bottom:3px;">4. Edge Spotlight Vignette</label>
                <select id="cosVfxVigSelect" class="cos-vfx-select">
                  <option value="subtle" selected>Subtle Center Focus</option>
                  <option value="dramatic">Dramatic Spotlight</option>
                  <option value="none">Off (Flat Edges)</option>
                </select>
              </div>
              <div>
                <label style="display:block;font-size:11px;font-weight:700;color:#cbd5e1;margin-bottom:3px;">5. Retention Progress Bar</label>
                <select id="cosVfxBarSelect" class="cos-vfx-select">
                  <option value="none" selected>Off</option>
                  <option value="top_neon">Top Neon Indigo Bar</option>
                  <option value="bottom_viral">Bottom Emerald Bar</option>
                </select>
              </div>
            </div>

            <div class="cos-vfx-sliders-box">
              <div>
                <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px;">
                  <span style="font-weight:700;color:#cbd5e1;">Contrast &amp; Punch</span>
                  <span id="cosVfxContrastLbl" style="font-weight:700;color:#a5b4fc;">108%</span>
                </div>
                <input type="range" id="cosVfxContrastSlider" min="85" max="135" step="1" value="108" style="width:100%;accent-color:#6366f1;cursor:pointer;">
              </div>
              <div>
                <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px;">
                  <span style="font-weight:700;color:#cbd5e1;">Color Vibrance</span>
                  <span id="cosVfxSatLbl" style="font-weight:700;color:#a5b4fc;">115%</span>
                </div>
                <input type="range" id="cosVfxSatSlider" min="0" max="155" step="1" value="115" style="width:100%;accent-color:#6366f1;cursor:pointer;">
              </div>
            </div>

            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
              <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-size:11.5px;font-weight:700;color:#cbd5e1;">Crisp Detail Sharpen:</span>
                <select id="cosVfxSharpSelect" class="cos-vfx-select" style="width:auto;padding:5px 9px;">
                  <option value="light" selected>Light Clarity</option>
                  <option value="strong">Strong HD Pop</option>
                  <option value="none">Off</option>
                </select>
              </div>
              <button type="button" class="cos-vfx-primary-btn" id="cosVfxApplyBtn">
                Save &amp; Render Visual Effects &rarr;
              </button>
            </div>

            <div id="cosVfxStatusText" style="font-size:12px;color:#a5b4fc;">
              Preview color grades, vignettes &amp; retention bars live on the left, then click Save &amp; Render Visual Effects.
            </div>
          </div>
        </div>
      `;

      topArea.appendChild(ui);

      const slot = document.getElementById("cosVfxVideoSlot");
      const vigOverlay = document.getElementById("cosVfxVignetteOverlay");
      const progTrack = document.getElementById("cosVfxProgTrack");
      const progFill = document.getElementById("cosVfxProgFill");
      const pill = document.getElementById("cosVfxLivePill");
      const dlBtn = document.getElementById("cosVfxDownloadBtn");
      const clipSel = document.getElementById("cosVfxClipSelect");
      const introSel = document.getElementById("cosVfxIntroSelect");
      const vigSel = document.getElementById("cosVfxVigSelect");
      const barSel = document.getElementById("cosVfxBarSelect");
      const sharpSel = document.getElementById("cosVfxSharpSelect");
      const cSlider = document.getElementById("cosVfxContrastSlider");
      const sSlider = document.getElementById("cosVfxSatSlider");
      const cLbl = document.getElementById("cosVfxContrastLbl");
      const sLbl = document.getElementById("cosVfxSatLbl");
      const statusEl = document.getElementById("cosVfxStatusText");

      document.querySelectorAll("video").forEach((v) => { try { v.pause(); } catch (_) {} });
      const vid = document.createElement("video");
      vid.id = "cosVfxPreviewVideo";
      vid.controls = true;
      vid.playsInline = true;
      vid.preload = "auto";
      vid.src = startUrl;
      slot.prepend(vid);

      vid.addEventListener("timeupdate", () => {
        if (vid.duration && vid.duration > 0) {
          const pct = Math.min(100, Math.max(0, (vid.currentTime / vid.duration) * 100));
          progFill.style.width = pct.toFixed(1) + "%";
        }
      });

      function updateLiveVfxPreview() {
        const cVal = Number(cSlider.value || 108) / 100;
        const sVal = Number(sSlider.value || 115) / 100;
        cLbl.textContent = Math.round(cVal * 100) + "%";
        sLbl.textContent = Math.round(sVal * 100) + "%";

        let extraCss = "";
        if (currentLook === "teal_orange") extraCss = "sepia(0.14) hue-rotate(-8deg)";
        else if (currentLook === "moody_dark") extraCss = "brightness(0.93)";
        else if (currentLook === "golden_warm") extraCss = "sepia(0.22) brightness(1.03)";
        else if (currentLook === "high_key") extraCss = "brightness(1.08)";
        else if (currentLook === "noir_bw") extraCss = "grayscale(1)";
        else extraCss = "brightness(1.02)";

        vid.style.filter = `contrast(${cVal}) saturate(${sVal}) ${extraCss}`;

        const vMode = vigSel.value;
        vigOverlay.className = "cos-vfx-vignette" + (vMode === "dramatic" ? " vig-dramatic" : (vMode === "subtle" ? " vig-subtle" : ""));

        const bMode = barSel.value;
        if (bMode === "top_neon") {
          progTrack.className = "cos-vfx-prog-track pos-top";
          progFill.style.background = "#818cf8";
        } else if (bMode === "bottom_viral") {
          progTrack.className = "cos-vfx-prog-track pos-bottom";
          progFill.style.background = "#10b981";
        } else {
          progTrack.className = "cos-vfx-prog-track";
        }

        const lookNames = {
          creator_hdr: "Crisp Creator HDR",
          teal_orange: "Cinema Teal & Orange",
          moody_dark: "Moody Dark Podcast",
          golden_warm: "Golden Hour Warm",
          high_key: "Clean High-Key",
          noir_bw: "Noir B&W Contrast"
        };
        const vigLabel = vMode === "dramatic" ? "Dramatic Vignette" : (vMode === "subtle" ? "Subtle Vignette" : "Clean Edges");
        pill.textContent = `${lookNames[currentLook] || currentLook} ? ${vigLabel}`;
      }

      ui.querySelectorAll(".cos-vfx-preset-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          ui.querySelectorAll(".cos-vfx-preset-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentLook = btn.getAttribute("data-look") || "creator_hdr";
          const defC = Math.round(Number(btn.getAttribute("data-c") || 1.08) * 100);
          const defS = Math.round(Number(btn.getAttribute("data-s") || 1.15) * 100);
          cSlider.value = String(defC);
          sSlider.value = String(defS);
          updateLiveVfxPreview();
        });
      });

      cSlider.addEventListener("input", updateLiveVfxPreview);
      sSlider.addEventListener("input", updateLiveVfxPreview);
      vigSel.addEventListener("change", updateLiveVfxPreview);
      barSel.addEventListener("change", updateLiveVfxPreview);

      updateLiveVfxPreview();

      clipSel.addEventListener("change", () => {
        const chosen = clips.find((c) => c.filename === clipSel.value);
        if (!chosen) return;
        setStudioState({ activeClipFilename: chosen.filename });
        vid.pause();
        vid.src = chosen.url;
        vid.load();
        vid.play().catch(() => {});
        dlBtn.href = chosen.url;
        dlBtn.download = chosen.filename;
      });

      async function runVfxRender(btnToUpdate) {
        const origLabel = btnToUpdate ? btnToUpdate.textContent : "";
        if (btnToUpdate) {
          btnToUpdate.disabled = true;
          btnToUpdate.textContent = "Rendering VFX...";
        }
        statusEl.textContent = "Rendering color grade, vignette & visual effects onto your 9:16 MP4 with FFmpeg...";

        const resp = await fetch("/api/cos-visual-effects-apply", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            project_id: pid,
            clip_filename: clipSel.value,
            look: currentLook,
            intro_fx: introSel.value,
            vignette: vigSel.value,
            progress_bar: barSel.value,
            sharpen: sharpSel.value,
            contrast: Number(cSlider.value || 108) / 100,
            saturation: Number(sSlider.value || 115) / 100
          })
        }).then((r) => r.json()).catch(() => ({}));

        if (btnToUpdate) {
          btnToUpdate.disabled = false;
          btnToUpdate.textContent = origLabel;
        }

        if (resp && resp.ok && resp.clip) {
          clips.unshift(resp.clip);
          clipSel.innerHTML = clips.map((c) => `<option value="${escapeHtml(c.filename)}" ${c.filename === resp.clip.filename ? "selected" : ""}>${escapeHtml(c.title)} (${c.size_mb} MB)</option>`).join("");
          setStudioState({ activeClipFilename: resp.clip.filename });
          vid.style.filter = "none";
          vigOverlay.className = "cos-vfx-vignette";
          progTrack.className = "cos-vfx-prog-track";
          vid.pause();
          vid.src = resp.clip.url;
          vid.load();
          vid.play().catch(() => {});
          dlBtn.href = resp.clip.url;
          dlBtn.download = resp.clip.filename;
          statusEl.innerHTML = `<strong style="color:#6ee7b7;">Visual Effects Rendered &amp; Saved!</strong> Playing your graded 9:16 short?click <strong>Download VFX MP4</strong> or continue to Page 6.`;
        } else {
          statusEl.textContent = resp.detail || "Could not render visual effects onto clip.";
        }
      }

      document.getElementById("cosVfxApplyBtn").addEventListener("click", function () {
        runVfxRender(this);
      });

      const topSaveBtn = Array.from(stage.querySelectorAll("button")).find((b) =>
        /^save settings$/i.test((b.textContent || "").trim())
      );
      if (topSaveBtn && !topSaveBtn.getAttribute("data-cos-vfx-wired")) {
        topSaveBtn.setAttribute("data-cos-vfx-wired", "true");
        topSaveBtn.addEventListener("click", function () {
          runVfxRender(this);
        });
      }
    } finally {
      isRenderingVfxStudio = false;
    }
  }

  setInterval(enhanceVisualEffectStudioPage, 500);
})();
</script>

<script id="cos-auto-ai-script">
(function () {
  function getStudioState() {
    try { return JSON.parse(localStorage.getItem("cos_studio_state_v2") || "{}"); } catch (_) { return {}; }
  }

  function setStudioState(patch) {
    try {
      const next = Object.assign({}, getStudioState(), patch);
      localStorage.setItem("cos_studio_state_v2", JSON.stringify(next));
    } catch (_) {}
  }

  function getActiveProjectId() {
    const st = getStudioState();
    if (st.activeProjectId && st.activeProjectId !== "undefined") return String(st.activeProjectId);
    const sel = document.getElementById("cosCtxProjectSelect");
    return sel && sel.value && sel.value !== "undefined" ? sel.value : "proj-bf2e1fae";
  }

  function getActiveClipFilename() {
    const topSel = document.getElementById("cosCtxClipSelect");
    if (topSel && topSel.value && topSel.value.endsWith(".mp4")) return topSel.value;
    const st = getStudioState();
    return (st.activeClipFilename && st.activeClipFilename.endsWith(".mp4")) ? st.activeClipFilename : "";
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function isAiEditingStage(stage) {
    if (!stage) return false;
    const txt = (stage.textContent || "").slice(0, 320).toLowerCase();
    return txt.includes("ai editing") ||
           txt.includes("auto camera zoom") ||
           txt.includes("auto subject framing") ||
           txt.includes("viral subtitles") ||
           txt.includes("voice & sound mastering") ||
           txt.includes("visual effects & color look") ||
           txt.includes("page 6 of 6");
  }

  function syncFinishedClipAcrossStage(stage, clip) {
    if (!clip || !clip.url) return;
    setStudioState({ activeClipFilename: clip.filename });

    const topSel = document.getElementById("cosCtxClipSelect");
    if (topSel) {
      const opt = document.createElement("option");
      opt.value = clip.filename;
      opt.textContent = clip.title;
      topSel.prepend(opt);
      topSel.value = clip.filename;
    }

    // Update whichever active studio dropdown & video player is currently visible
    ["cosDirClipSelect", "cosRefClipSelect", "cosSubClipSelect", "cosSndClipSelect", "cosVfxClipSelect"].forEach((selId) => {
      const s = document.getElementById(selId);
      if (s) {
        const opt = document.createElement("option");
        opt.value = clip.filename;
        opt.textContent = `${clip.title} (${clip.size_mb} MB)`;
        s.prepend(opt);
        s.value = clip.filename;
      }
    });

    ["cosDirDownloadBtn", "cosRefDownloadBtn", "cosSubDownloadBtn", "cosSndDownloadBtn", "cosVfxDownloadBtn"].forEach((dlId) => {
      const a = document.getElementById(dlId);
      if (a) {
        a.href = clip.url;
        a.download = clip.filename;
      }
    });

    const vid = stage.querySelector("video");
    if (vid) {
      vid.style.filter = "none";
      vid.pause();
      vid.src = clip.url;
      vid.load();
      vid.play().catch(() => {});
    }
  }

  // Apply AI-recommended preset inside whichever single studio tab is currently open
  async function applyAutoAiToCurrentTab(btn) {
    const pid = getActiveProjectId();
    const clipFn = getActiveClipFilename();
    const orig = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Auto AI Picking...";

    const resp = await fetch("/api/cos-auto-ai-analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ project_id: pid, clip_filename: clipFn, vibe: "auto" })
    }).then((r) => r.json()).catch(() => ({}));

    btn.disabled = false;
    btn.textContent = orig;

    const plan = resp && resp.plan;
    if (!plan) return;

    // 1. AI Director tab
    const dirBtn = document.querySelector(`#cosDirRhythmGroup .cos-dir-rhythm-btn[data-rhythm="${plan.rhythm}"]`);
    if (dirBtn) dirBtn.click();

    // 2. Smart Reframing tab
    const refBtn = document.querySelector(`#cosRefPresetGroup .cos-ref-preset-btn[data-mode="${plan.reframe_mode}"]`);
    if (refBtn) refBtn.click();

    // 3. Subtitle Studio tab
    const subBtn = document.querySelector(`#cosSubStyleGroup .cos-sub-preset-btn[data-style="${plan.sub_style}"]`);
    if (subBtn) subBtn.click();
    const split3 = document.getElementById("cosSubSplit3WordsBtn");
    if (split3) split3.click();

    // 4. Sound Design Studio tab
    const sndBtn = document.querySelector(`#cosSndPresetGroup .cos-snd-preset-btn[data-preset="${plan.voice_preset}"]`);
    if (sndBtn) sndBtn.click();
    const sfxSel = document.getElementById("cosSndSfxSelect");
    if (sfxSel) sfxSel.value = plan.sfx_type;

    // 5. Visual Effect Studio tab
    const vfxBtn = document.querySelector(`#cosVfxLookGroup .cos-vfx-preset-btn[data-look="${plan.vfx_look}"]`);
    if (vfxBtn) vfxBtn.click();
    const barSel = document.getElementById("cosVfxBarSelect");
    if (barSel) {
      barSel.value = plan.progress_bar;
      barSel.dispatchEvent(new Event("change"));
    }

    btn.textContent = "Applied Auto AI!";
    setTimeout(() => { btn.textContent = orig; }, 1800);
  }

  function mountAutoAiControls() {
    const host = document.getElementById("cosStudioArchitecture");
    if (!host) return;
    const stage = host.querySelector(".cos-tool-stage") || host;

    // Inject per-tab "Auto AI Pick" pill onto each studio card header
    stage.querySelectorAll(".cos-ws-card-head").forEach((head) => {
      if (head.querySelector(".cos-auto-tab-pick-btn")) return;
      const pill = head.querySelector(".cos-ws-head-pill");
      if (!pill) return;
      const pickBtn = document.createElement("button");
      pickBtn.type = "button";
      pickBtn.className = "cos-auto-tab-pick-btn";
      pickBtn.textContent = "? Auto AI Pick";
      pickBtn.title = "Let Auto AI inspect your clip and choose the best settings for this tool";
      pickBtn.onclick = () => applyAutoAiToCurrentTab(pickBtn);
      pill.parentElement.appendChild(pickBtn);
    });

    if (!isAiEditingStage(stage)) return;
    if (document.getElementById("cosAutoAiBanner")) return;

    const banner = document.createElement("div");
    banner.id = "cosAutoAiBanner";
    banner.innerHTML = `
      <div class="cos-auto-top">
        <div class="cos-auto-title-wrap">
          <span class="cos-auto-pill">&#10024; AUTO AI</span>
          <div>
            <div style="font-size:13.5px;font-weight:800;color:#ffffff;">1-Click Auto AI Full Studio Polish</div>
            <div style="font-size:11.5px;color:#cbd5e1;">Automatically configures &amp; renders Zoom, 9:16 Reframe, Viral Captions, Voice Master &amp; Color Look in one click.</div>
          </div>
        </div>

    const rad = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    if (typeof ctx.roundRect === "function") {
      ctx.roundRect(x, y, w, h, rad);
    } else {
      ctx.moveTo(x + rad, y);
      ctx.arcTo(x + w, y, x + w, y + h, rad);
      ctx.arcTo(x + w, y + h, x, y + h, rad);
      ctx.arcTo(x, y + h, x, y, rad);
      ctx.arcTo(x, y, x + w, y, rad);

      const currentStage = getStageElement() || stage;

      const topicInp = q("[data-role='topic-inp']");
      const aiDetectBtn = q("[data-role='ai-detect-btn']");

      const kickCol = q("[data-role='kick-col']");
      const zoomSlider = q("[data-role='zoom-slider']");
      const zoomLbl = q("[data-role='zoom-lbl']");
      const conSlider = q("[data-role='con-slider']");
      const conLbl = q("[data-role='con-lbl']");

      const flipBtn = q("[data-role='flip-btn']");
      const centerBtn = q("[data-role='center-btn']");
      const statusEl = q("[data-role='status-bar']");

      const state = {
        ratio: "9x16",
        tplId: "finance_gold",
        topicAccent: "money",
        activeSugIdx: 0,
        suggestions: DEFAULT_SUGGESTIONS.slice(),
        bgImg: null,
        textX: 0.5,
        textY: 0.74,
        dragging: false,
        flipH: false,
        zoom: 1.0,
        contrast: 122,
        vignette: 38,
        boxBg: "none",
        glowColor: "#10b981"
      };

      function wrapTextLines(context, text, maxWidth) {
        const words = String(text || "").trim().split(/\s+/).filter(Boolean);
        if (!words.length) return [];
        const lines = [];
        let cur = words[0];
        for (let i = 1; i < words.length; i++) {
          const test = cur + " " + words[i];
          if (context.measureText(test).width <= maxWidth) {
            cur = test;
          } else {
            lines.push(cur);
            cur = words[i];
          }
        }
        lines.push(cur);
        return lines.slice(0, 3);
      }

      function drawTopicAccentGraphic(W, H, isYT16x9) {
        if (state.topicAccent !== "money" && badgeSel.value !== "money_bag") return;
        ctx.save();
        // Draw subtle upward growth chart bars in corner so money videos pop visually
        const gx = isYT16x9 ? W * 0.075 : W * 0.12;
        const gy = isYT16x9 ? H * 0.86 : H * 0.22;
        const barW = Math.round(Math.min(W, H) * 0.022);
        const gap = Math.round(barW * 0.55);
        const heights = [0.45, 0.68, 0.92, 1.25].map((m) => Math.round(barW * 2.2 * m));
        heights.forEach((bh, i) => {
          ctx.fillStyle = i === 3 ? "rgba(250, 204, 21, 0.85)" : "rgba(16, 185, 129, 0.65)";
          drawRoundRect(ctx, gx + i * (barW + gap), gy - bh, barW, bh, 5);
          ctx.fill();
        });
        ctx.restore();
      }

      function renderCanvas(includeSafeGuides) {
        if (!ctx || !canvas) return;
        const W = canvas.width;
        const H = canvas.height;
        const isYT16x9 = state.ratio === "16x9";
        ctx.clearRect(0, 0, W, H);

        const baseBg = ctx.createLinearGradient(0, 0, W, H);
        baseBg.addColorStop(0, "#0b1021");
        baseBg.addColorStop(0.55, "#111827");
        baseBg.addColorStop(1, "#05070e");
        ctx.fillStyle = baseBg;
        ctx.fillRect(0, 0, W, H);

        if (state.bgImg && state.bgImg.complete && state.bgImg.naturalWidth > 0) {
          const iw = state.bgImg.naturalWidth;
          const ih = state.bgImg.naturalHeight;

          if (isYT16x9) {
            const ambScale = Math.max(W / iw, H / ih);
            ctx.save();
            ctx.globalAlpha = 0.20;
            ctx.translate(W * 0.5, H * 0.5);
            if (state.flipH) ctx.scale(-1, 1);
            ctx.drawImage(state.bgImg, -(iw * ambScale) / 2, -(ih * ambScale) / 2, iw * ambScale, ih * ambScale);
            ctx.restore();

            const rightZoneW = W * 0.58;
            const subjScale = Math.max(rightZoneW / iw, H / ih) * state.zoom;
            const dw = iw * subjScale;
            const dh = ih * subjScale;
            const subjCenterX = W * 0.72;

            ctx.save();
            ctx.beginPath();
            ctx.rect(W * 0.36, 0, W * 0.64, H);
            ctx.clip();
            ctx.translate(subjCenterX, H * 0.5);
            if (state.flipH) ctx.scale(-1, 1);
            ctx.drawImage(state.bgImg, -dw / 2, -dh / 2, dw, dh);
            ctx.restore();

            const splitFade = ctx.createLinearGradient(W * 0.34, 0, W * 0.64, 0);
            splitFade.addColorStop(0, "rgba(8, 12, 24, 0.98)");
            splitFade.addColorStop(0.45, "rgba(8, 12, 24, 0.78)");
            splitFade.addColorStop(1, "rgba(8, 12, 24, 0)");
            ctx.fillStyle = splitFade;
            ctx.fillRect(0, 0, W * 0.66, H);
            ctx.fillStyle = "rgba(8, 12, 24, 0.92)";
            ctx.fillRect(0, 0, W * 0.35, H);
          } else {
            const scale = Math.max(W / iw, H / ih) * state.zoom;
            const dw = iw * scale;
            const dh = ih * scale;
            ctx.save();
            ctx.translate(W / 2, H / 2);
            if (state.flipH) ctx.scale(-1, 1);
            ctx.drawImage(state.bgImg, -dw / 2, -dh / 2, dw, dh);
            ctx.restore();
          }

          if (state.contrast > 105) {
            const boostAlpha = Math.min(0.28, ((state.contrast - 100) / 100) * 0.45);
            ctx.save();
            ctx.globalCompositeOperation = "overlay";
            ctx.fillStyle = `rgba(255,255,255,${boostAlpha})`;
            ctx.fillRect(0, 0, W, H);
            ctx.restore();
          }
        }

        if (state.vignette > 0) {
          const radG = ctx.createRadialGradient(
            isYT16x9 ? W * 0.72 : W * 0.5,
            H * 0.45,
            W * 0.16,
            W * 0.5,
            H * 0.5,
            Math.max(W, H) * 0.74
          );
          radG.addColorStop(0, "rgba(0,0,0,0)");
          radG.addColorStop(1, `rgba(0,0,0,${(state.vignette / 100) * 0.85})`);
          ctx.fillStyle = radG;
          ctx.fillRect(0, 0, W, H);
        }
        if (!isYT16x9) {
          const botG = ctx.createLinearGradient(0, H * 0.48, 0, H);
          botG.addColorStop(0, "rgba(0,0,0,0)");
          botG.addColorStop(1, "rgba(0,0,0,0.72)");
          ctx.fillStyle = botG;
          ctx.fillRect(0, H * 0.48, W, H * 0.52);
        }

        drawTopicAccentGraphic(W, H, isYT16x9);

        if (state.glowColor && state.glowColor !== "none") {
          ctx.save();
          ctx.strokeStyle = state.glowColor;
          ctx.lineWidth = Math.round(Math.min(W, H) * 0.016);
          ctx.strokeRect(ctx.lineWidth / 2, ctx.lineWidth / 2, W - ctx.lineWidth, H - ctx.lineWidth);
          ctx.restore();
        }

        const cx = state.textX * W;
        const cy = state.textY * H;
        const fSize = Math.round(Number(sizeSlider.value || 118) * (isYT16x9 ? (H / 1080) * 0.94 : (W / 1080)));
        const fontFam = fontSel.value;
        const maxTextW = isYT16x9 ? W * 0.44 : W * 0.86;

        const kickerTxt = (kickInp.value || "").trim().toUpperCase();
        if (kickerTxt) {
          ctx.save();
          const kSize = Math.round(fSize * 0.36);
          ctx.font = `900 ${kSize}px ${fontFam}`;
          const kw = ctx.measureText(kickerTxt).width + kSize * 1.1;
          const kh = kSize * 1.45;
          const kx = isYT16x9 ? cx : (cx - kw / 2);
          const ky = cy - fSize * 1.15 - kh;
          ctx.fillStyle = kickCol.value || "#059669";
          drawRoundRect(ctx, kx, ky, kw, kh, 12);
          ctx.fill();
          ctx.fillStyle = "#ffffff";
          ctx.textBaseline = "middle";
          if (isYT16x9) {
            ctx.textAlign = "left";
            ctx.fillText(kickerTxt, kx + kSize * 0.55, ky + kh / 2 + 2);
          } else {
            ctx.textAlign = "center";
            ctx.fillText(kickerTxt, cx, ky + kh / 2 + 2);
          }
          ctx.restore();
        }

        const rawHead = (headInp.value || "").trim().toUpperCase();
        if (rawHead) {
          ctx.save();
          ctx.font = `900 ${fSize}px ${fontFam}`;
          ctx.textAlign = isYT16x9 ? "left" : "center";
          ctx.textBaseline = "middle";
          const lines = wrapTextLines(ctx, rawHead, maxTextW);
          const lineH = fSize * 1.12;
          const startY = cy - ((lines.length - 1) * lineH) / 2;

          lines.forEach((ln, idx) => {
            const ly = startY + idx * lineH;
            if (state.boxBg && state.boxBg !== "none") {
              const lw = ctx.measureText(ln).width + fSize * 0.52;
              const lh = fSize * 1.06;
              const bx = isYT16x9 ? (cx - fSize * 0.22) : (cx - lw / 2);
              ctx.fillStyle = state.boxBg;
              drawRoundRect(ctx, bx, ly - lh / 2, lw, lh, 14);
              ctx.fill();
            }
            ctx.shadowColor = "rgba(0,0,0,0.88)";
            ctx.shadowBlur = 18;
            ctx.shadowOffsetY = 8;
            ctx.lineWidth = Math.max(6, Math.round(fSize * 0.11));
            ctx.strokeStyle = "#000000";
            ctx.strokeText(ln, cx, ly);
            ctx.fillStyle = headCol.value || "#fde047";
            ctx.fillText(ln, cx, ly);
          });
          ctx.restore();
        }

        const sticker = badgeSel.value;
        if (sticker !== "none") {
          ctx.save();
          if (sticker === "arrow") {
            const ax = isYT16x9 ? (cx + maxTextW * 0.72) : (cx + W * 0.24);
            const ay = isYT16x9 ? (cy - fSize * 1.38) : (cy - fSize * 1.45);
            ctx.translate(ax, ay);
            ctx.rotate(isYT16x9 ? 0.12 : 0.55);
            ctx.fillStyle = "#ef4444";
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(-70, -24);
            ctx.lineTo(15, -24);
            ctx.lineTo(15, -52);
            ctx.lineTo(80, 0);
            ctx.lineTo(15, 52);
            ctx.lineTo(15, 24);
            ctx.lineTo(-70, 24);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          } else if (sticker === "money_bag" || sticker === "fire" || sticker === "100" || sticker === "live") {
            const bx = isYT16x9 ? W * 0.91 : W * 0.82;
            const by = isYT16x9 ? H * 0.16 : H * 0.13;
            const rad = Math.round(Math.min(W, H) * 0.084);
            ctx.fillStyle = sticker === "money_bag" ? "#059669" : (sticker === "live" ? "#dc2626" : (sticker === "100" ? "#059669" : "#f97316"));
            ctx.strokeStyle = sticker === "money_bag" ? "#fde047" : "#ffffff";
            ctx.lineWidth = 7;
            ctx.beginPath();
            ctx.arc(bx, by, rad, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = sticker === "money_bag" ? "#fde047" : "#ffffff";
            ctx.font = `900 ${Math.round(rad * 0.62)}px Impact, sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            const badgeText = sticker === "money_bag" ? "$$$" : (sticker === "live" ? "NEW" : (sticker === "100" ? "100%" : "HOT"));
            ctx.fillText(badgeText, bx, by + 2);
          }
          ctx.restore();
        }

        if (includeSafeGuides && safeChk.checked) {
          ctx.save();
          ctx.strokeStyle = "rgba(56, 189, 248, 0.78)";
          ctx.setLineDash([14, 10]);
          ctx.lineWidth = 4;
          if (state.ratio === "9x16") {
            ctx.strokeRect(W * 0.06, H * 0.10, W * 0.82, H * 0.68);
          } else if (isYT16x9) {
            ctx.strokeRect(W * 0.05, H * 0.10, W * 0.44, H * 0.80);
            ctx.strokeStyle = "rgba(16, 185, 129, 0.65)";
            ctx.strokeRect(W * 0.51, H * 0.08, W * 0.44, H * 0.84);
            ctx.fillStyle = "rgba(239, 68, 68, 0.35)";
            ctx.fillRect(W * 0.84, H * 0.85, W * 0.14, H * 0.11);
          } else {
            ctx.strokeRect(W * 0.08, H * 0.08, W * 0.84, H * 0.84);
          }
          ctx.restore();
        }
      }

      function applyTemplateById(tplId) {
        const found = THUMB_TEMPLATES.find((x) => x.id === tplId);
        if (!found) return;
        state.tplId = found.id;
        state.contrast = found.contrast;
        state.vignette = found.vignette;
        state.boxBg = found.boxBg;
        state.glowColor = found.glowColor;
        headCol.value = found.headlineColor;
        kickCol.value = found.kickerBg;
        badgeSel.value = found.badge;
        conSlider.value = String(found.contrast);
        conLbl.textContent = found.contrast + "%";
        renderTemplateCards();
        renderCanvas(true);

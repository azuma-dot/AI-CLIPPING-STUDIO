  <title>AI Clipping Studio ? Clipping OS</title>
  <style>
    :root {
      --bg: #07080e;
      --surface: #0e101a;
      --surface-2: #141826;
      --text: #f5f7fc;
      --muted: #98a2b8;
      --border: rgba(148, 163, 184, 0.16);
      --glow: rgba(129, 140, 248, 0.55);
      --accent: #7c5cff;
      --accent-2: #22d3ee;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --dur: 280ms;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background:
        radial-gradient(880px 420px at 82% -8%, rgba(124, 92, 255, 0.16), transparent 60%),
        radial-gradient(680px 380px at 8% 20%, rgba(34, 211, 238, 0.08), transparent 55%),
        var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    .lit {
      position: relative;
      background: linear-gradient(180deg, rgba(20, 24, 38, 0.94), rgba(13, 16, 26, 0.96));
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
    }

    .lit::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 16px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(129, 140, 248, 0.52), rgba(34, 211, 238, 0.14), rgba(124, 92, 255, 0.4));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0.48;
      pointer-events: none;
      transition: opacity var(--dur) var(--ease);
    }

    .lit:hover {
      border-color: var(--glow);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.58), 0 0 24px rgba(124, 92, 255, 0.16);
    }

    .lit:hover::before { opacity: 0.95; }

    .shell {
      max-width: 1380px;
      margin: 0 auto;
      padding: 22px;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    /* LEFT COLUMN: DOCKED MOTION THUMBNAIL + COLLAPSING 3-DOT/LINE TRIGGER */
    .left-rail {
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: sticky;
      top: 22px;
    }

    .motion-card { padding: 14px; }

    .motion-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      background: radial-gradient(circle at 30% 30%, rgba(124, 92, 255, 0.35), rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(129, 140, 248, 0.34);
      transition: aspect-ratio var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }

    .motion-bg-anim {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(125deg, rgba(124, 92, 255, 0.32), transparent 55%),
        linear-gradient(305deg, rgba(34, 211, 238, 0.22), transparent 50%),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 24px);
      animation: drift 6s linear infinite;
    }

    @keyframes drift {
      0% { transform: scale(1) translateX(0); }
      50% { transform: scale(1.05) translateX(-8px); }
      100% { transform: scale(1) translateX(0); }
    }

    .motion-overlay {
      position: relative;
      z-index: 1;
      height: 100%;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .motion-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      background: rgba(7, 8, 14, 0.72);
      border: 1px solid rgba(129, 140, 248, 0.4);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 8px var(--accent-2);
    }

    .dock-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 32px;
      padding: 0;
      border: none;
      background: transparent;
      box-shadow: none;
      color: #fff;
      cursor: pointer;
      transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
    }

    .dock-trigger:hover {
      transform: scale(1.08);
    }

    .dock-dots, .dock-lines {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: all var(--dur) var(--ease);
    }

    

    .dock-lines {
      flex-direction: column;
      gap: 3.5px;
    }

    .dock-lines i {
      width: 16px;
      height: 2px;
      border-radius: 2px;
      background: #fff;
      display: block;
      transition: all var(--dur) var(--ease);
    }

    .dock-trigger.is-open .dock-dots,
    .dock-trigger.is-open .dock-lines i:not(.line-zero) {
      opacity: 0;
      width: 0;
      margin: 0;
      transform: scaleX(0);
    }

    .dock-trigger.is-open .dock-lines { gap: 0; }

    .dock-trigger.is-open .dock-lines i.line-zero {
      width: 22px;
      height: 2.5px;
      background: #fff;
      box-shadow: 0 0 10px var(--accent-2);
    }

    .motion-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.76rem;
      color: #e2e8f0;
      background: rgba(7, 8, 14, 0.68);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* SECTION DRAWER WITH ~280ms OPEN / CLOSE MOTION */
    .section-drawer {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transform: translateY(-8px) scale(0.985);
      pointer-events: none;
      transition:
        max-height var(--dur) var(--ease),
        opacity var(--dur) var(--ease),
        transform var(--dur) var(--ease);
    }

    .section-drawer.open {
      max-height: 920px;
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .drawer-inner {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sec-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 11px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 180ms var(--ease);
    }

    .sec-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(129, 140, 248, 0.25);
    }

    .sec-btn.active {
      color: #fff;
      background: linear-gradient(90deg, rgba(124, 92, 255, 0.24), rgba(34, 211, 238, 0.08));
      border-color: rgba(129, 140, 248, 0.55);
      box-shadow: 0 0 18px rgba(124, 92, 255, 0.16);
    }

    .sec-num {
      font-size: 0.75rem;
      color: var(--accent-2);
      font-weight: 700;
    }

    /* RIGHT WORKSPACE: PERSISTENT PORTRAIT THUMBNAIL + TOP CLOSE BUTTON + ACTIVE PANEL */
    .workspace {
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-width: 0;
    }

    .topbar {
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .topbar h1 { margin: 0; font-size: 1.2rem; letter-spacing: -0.02em; }
    .topbar p { margin: 2px 0 0; font-size: 0.84rem; color: var(--muted); }

    .btn-grad {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid rgba(165, 180, 252, 0.55);
      background: linear-gradient(135deg, #7c5cff, #5642e6);
      color: #fff;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 180ms var(--ease), box-shadow 180ms var(--ease);
    }

    .btn-grad:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(124, 92, 255, 0.36);
    }

    /* Layering so portrait thumbnail stays visible behind/beside active section panel */
    .stage-arena {
      position: relative;
      display: grid;
      grid-template-columns: 236px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
      transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
    }

    .stage-arena.closing {
      opacity: 0;
      transform: translateY(8px) scale(0.985);
    }

    .portrait-showcase {
      position: sticky;
      top: 22px;
      z-index: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .portrait-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      border-radius: 13px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 22%, rgba(124, 92, 255, 0.38), rgba(10, 13, 24, 0.96));
      border: 1px solid rgba(129, 140, 248, 0.55);
      box-shadow: 0 0 28px rgba(124, 92, 255, 0.24);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
    }

    .portrait-motion-layer {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(124, 92, 255, 0.16), transparent 45%, rgba(34, 211, 238, 0.14)),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 20px);
      animation: portraitPulse 5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes portraitPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .portrait-top-bar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .portrait-badge {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(7, 8, 14, 0.82);
      border: 1px solid rgba(34, 211, 238, 0.45);
      color: var(--accent-2);
    }

    .portrait-close-btn {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(9, 11, 19, 0.86);
      color: #fff;
      font-size: 0.9rem;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all 180ms var(--ease);
    }

    .portrait-close-btn:hover {
      border-color: var(--accent-2);
      background: rgba(124, 92, 255, 0.35);
      transform: scale(1.06);
    }

    .portrait-meta {
      position: relative;
      z-index: 2;
      background: rgba(7, 8, 14, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 0.76rem;
    }

    .active-page-card {
      position: relative;
      z-index: 2;
      padding: 20px;
      border-color: rgba(129, 140, 248, 0.48);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.52), 0 0 28px rgba(124, 92, 255, 0.16);
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .active-page-card.entering {
      opacity: 0;
      transform: translateY(10px) scale(0.988);
    }

    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .page-head h2 { margin: 0; font-size: 1.08rem; }

    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

    .sub-box {
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(9, 11, 19, 0.72);
    }

    .sub-box h3 { margin: 0 0 8px; font-size: 0.9rem; }
    .sub-box p { margin: 0; font-size: 0.82rem; color: var(--muted); }

    .cap-list {
      margin: 8px 0 0;
      padding-left: 16px;
      font-size: 0.79rem;
      color: var(--muted);
      display: grid;
      gap: 4px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .field label { font-size: 0.78rem; color: var(--muted); }

    input, select, textarea {
      width: 100%;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #090b13;
      color: var(--text);
      font-size: 0.85rem;
    }

    .project-list { display: flex; flex-direction: column; gap: 8px; }
    .project-item {
      padding: 11px 13px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: rgba(9, 11, 19, 0.7);
      font-size: 0.84rem;
    }

    @media (max-width: 1020px) {
      .shell { grid-template-columns: 1fr; }
      .left-rail, .portrait-showcase { position: static; }
      .stage-arena { grid-template-columns: 1fr; }
      .portrait-frame { max-width: 240px; margin: 0 auto; }
    }

    @media (max-width: 720px) {
      .grid-3, .grid-2 { grid-template-columns: 1fr; }
    }
  </style>

<script id="cos-pill-more-script">
(function () {
  function findOverviewElement() {
    const all = Array.from(document.querySelectorAll("a, button, div, span, li, p, h1, h2, h3, h4"));
    const matches = all.filter((el) => {
      const txt = (el.textContent || "").replace(/\s+/g, " ").trim();
      if (!/Overview\s*&\s*Analytics/i.test(txt) || txt.length > 45) return false;
      const r = el.getBoundingClientRect();
      return r.width > 40 && r.height > 10 && r.height < 100;
    });
    if (!matches.length) return null;
    matches.sort((a, b) => {
      const ra = a.getBoundingClientRect();
      const rb = b.getBoundingClientRect();
      return (ra.width * ra.height) - (rb.width * rb.height);
    });
    return matches[0];
  }

  function injectMoreLabel() {
    if (document.querySelector(".cos-pill-more-label")) return true;
    const overviewEl = findOverviewElement();
    if (!overviewEl) return false;

    const oRect = overviewEl.getBoundingClientRect();
    const sampleXs = [
      oRect.left + Math.min(48, oRect.width * 0.25),
      oRect.left + oRect.width * 0.5
    ];
    const sampleDys = [14, 24, 34, 46, 58, 72, 88];

    for (const dy of sampleDys) {
      const y = oRect.top - dy;
      if (y < 0) continue;
      for (const x of sampleXs) {
        const stack = document.elementsFromPoint(x, y);
        for (const el of stack) {
          if (!el || el === document.body || el === document.documentElement) continue;
          if (/^(INPUT|TEXTAREA|SELECT|IMG|SVG|PATH|RECT|LINE|CIRCLE|CANVAS|VIDEO|IFRAME)$/i.test(el.tagName)) continue;
          if (el.contains(overviewEl)) continue;
          const r = el.getBoundingClientRect();
          if (r.height >= 24 && r.height <= 90 && r.width >= 120 && r.bottom <= oRect.top + 12) {
            if (getComputedStyle(el).position === "static") {
              el.style.position = "relative";
            }
            const label = document.createElement("span");
            label.className = "cos-pill-more-label";
            label.textContent = "More";
            el.appendChild(label);
            return true;
          }
        }
      }
    }
    return false;
  }

  function runChecks() {
    if (injectMoreLabel()) return;
    setTimeout(injectMoreLabel, 150);
    setTimeout(injectMoreLabel, 500);
    setTimeout(injectMoreLabel, 1200);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", runChecks);
  } else {
    runChecks();
  }
  window.addEventListener("load", injectMoreLabel);

  const obs = new MutationObserver(() => {
    if (injectMoreLabel()) obs.disconnect();
  });
  obs.observe(document.documentElement, { childList: true, subtree: true });
})();
</script>

  function refreshBadges() {

  function openCenterClipTab() {
    centerInput.value = urlInput.value;

      centerInput.select();

  function closeCenterClipTab() {
    centerOverlay.classList.remove("is-open");
    if (document.activeElement) {
      document.activeElement.blur();
    }

  urlInput.addEventListener("click", (e) => {

  centerInput.addEventListener("input", () => {
    urlInput.value = centerInput.value;
  });

  centerCloseBtn.addEventListener("click", closeCenterClipTab);
  centerCancelBtn.addEventListener("click", closeCenterClipTab);

    if (e.target === centerOverlay) closeCenterClipTab();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && centerOverlay.classList.contains("is-open")) {
      closeCenterClipTab();
    }
  });

  function syncRailBelowMore() {
    const moreLabel = document.querySelector(".cos-pill-more-label");
    const moreBar = moreLabel ? moreLabel.parentElement : null;
    if (!moreBar) {
      rail.style.setProperty("--cos-rail-left", "22px");
      rail.style.setProperty("--cos-rail-top", "360px");
      return;
    }

    const barRect = moreBar.getBoundingClientRect();
    if (barRect.width <= 0 || barRect.height <= 0) return;

    rail.style.setProperty("--cos-rail-left", Math.max(12, Math.round(barRect.left)) + "px");
    rail.style.setProperty("--cos-rail-width", Math.round(barRect.width) + "px");

    let anchorBottom = barRect.bottom;
    const siblingCandidates = [
      moreBar.nextElementSibling,
      moreBar.parentElement ? moreBar.parentElement.nextElementSibling : null
    ];

    for (const cand of siblingCandidates) {
      if (!cand || cand === rail) continue;
      const st = getComputedStyle(cand);
      const r = cand.getBoundingClientRect();
      if (
        st.display !== "none" &&
        st.visibility !== "hidden" &&
        parseFloat(st.opacity || "1") > 0.05 &&
        r.height > 18 &&
        r.top >= barRect.bottom - 8 &&
        r.top <= barRect.bottom + 28 &&
        Math.abs(r.left - barRect.left) < 40
      ) {
        anchorBottom = Math.max(anchorBottom, r.bottom);
      }
    }

    const overviewNode = Array.from(document.querySelectorAll("a, button, div, span, li, p"))
      .find((el) => /Overview\s*&\s*Analytics/i.test((el.textContent || "").trim()) && (el.textContent || "").trim().length < 45);
    if (overviewNode) {
      let box = overviewNode;
      for (let i = 0; i < 6 && box && box.parentElement; i++) {
        const r = box.getBoundingClientRect();
        if (Math.abs(r.width - barRect.width) < 35 && Math.abs(r.left - barRect.left) < 35 && r.height > 30) {
          const st = getComputedStyle(box);
          if (st.display !== "none" && st.visibility !== "hidden" && parseFloat(st.opacity || "1") > 0.05) {
            anchorBottom = Math.max(anchorBottom, r.bottom);
          }
          break;
        }
        box = box.parentElement;
      }
    }

    const maxSafeTop = Math.max(90, window.innerHeight - 140);
    const targetTop = Math.min(Math.round(anchorBottom + 12), maxSafeTop);
    rail.style.setProperty("--cos-rail-top", targetTop + "px");
  }

  syncRailBelowMore();
  setTimeout(syncRailBelowMore, 150);
  setTimeout(syncRailBelowMore, 500);
  setTimeout(syncRailBelowMore, 1100);
  window.addEventListener("resize", syncRailBelowMore);
  document.addEventListener("click", () => {

  const form = document.getElementById("cosQuickClipForm");

  function addLiveQueueCard(label, isAudioOnly) {
    const item = document.createElement("div");
    item.className = "cos-job-item";
    const metaLeft = isAudioOnly ? ("Master Audio &bull; " + state.audioFmt) : (state.aspect + " &bull; " + state.quality);
    item.innerHTML = `
      <div class="cos-job-top">
        <span class="cos-job-name">${label}</span>
        <span class="cos-job-stage${isAudioOnly ? " audio" : ""}">${isAudioOnly ? "Extracting Audio" : "Transcribing"}</span>
      </div>
      <div class="cos-job-bar-track">
        <div class="cos-job-bar-fill${isAudioOnly ? " audio" : ""}" style="width: 28%;"></div>
      </div>
      <div class="cos-job-meta">
        <span>${metaLeft}</span>
        <span>28%</span>
      </div>
    `;
    jobList.insertBefore(item, jobList.firstChild);
    while (jobList.children.length > 3) {
      jobList.removeChild(jobList.lastChild);
    }

    const stages = isAudioOnly
      ? [
          { pct: 66, stage: "Normalizing -14 LUFS" },
          { pct: 100, stage: "Audio Ready", done: true }
        ]
      : [
          { pct: 58, stage: "Hook Scoring" },
          { pct: 86, stage: "Rendering " + state.quality.split(" ")[0] },
          { pct: 100, stage: "Ready", done: true }
        ];

    let idx = 0;
    const timer = setInterval(() => {
      if (idx >= stages.length) {
        clearInterval(timer);
        return;
      }
      const s = stages[idx++];
      const badge = item.querySelector(".cos-job-stage");
      const fill = item.querySelector(".cos-job-bar-fill");
      const metaPct = item.querySelector(".cos-job-meta span:last-child");
      badge.textContent = s.stage;
      fill.style.width = s.pct + "%";
      metaPct.textContent = s.done ? (isAudioOnly ? state.audioFmt : "Hook 92/100") : s.pct + "%";
      if (s.done) {
        badge.classList.remove("audio");
        fill.classList.remove("audio");
        badge.classList.add("done");
        fill.classList.add("done");
      }
    }, 1400);
  }

  function syncMainInput(rawVal) {
    const mainInput = Array.from(document.querySelectorAll('input[type="url"], input[type="text"]'))
      .find((el) => el !== urlInput && el !== centerInput && /youtube|url|link|video/i.test((el.placeholder || "") + (el.name || "") + (el.id || "")));
    if (mainInput) {
      mainInput.value = rawVal;
      mainInput.dispatchEvent(new Event("input", { bubbles: true }));
    }
  }

  function submitClipValue(rawVal, isAudioOnly) {
    if (!rawVal) {

      return;
    }
    syncMainInput(rawVal);
    const baseName = rawVal.replace(/^https?:\/\/(www\.)?/i, "").slice(0, 26) || "New_Studio_Clip";

    addLiveQueueCard(label, isAudioOnly);
    urlInput.value = "";
    centerInput.value = "";
    closeCenterClipTab();
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    submitClipValue(urlInput.value.trim(), false);
  });

  centerForm.addEventListener("submit", (e) => {
    e.preventDefault();
    submitClipValue(centerInput.value.trim(), false);
  });

  document.getElementById("cosExtractAudioBtn").addEventListener("click", () => {
    const val = centerInput.value.trim();
    if (!val) {
      centerInput.focus();
      return;
    }
    submitClipValue(val, true);
  });

  async function syncBackendTelemetry() {
    const getPaths = ROUTES.filter((r) => r.method === "GET").map((r) => r.path);
    const healthPath = getPaths.find((p) => /\/(health|status|ping)$/i.test(p));
    if (healthPath) {
      try {
        const res = await fetch(healthPath, { credentials: "same-origin" });
        if (res.ok) {
          document.getElementById("cosEngineStatusText").textContent = "Engine Online";
        }
      } catch (_) {}
    }

    const jobsPath = getPaths.find((p) => /\/(jobs|clips|renders|tasks)$/i.test(p));
    if (jobsPath) {
      try {
        const res = await fetch(jobsPath, { credentials: "same-origin" });
        if (res.ok) {
          const payload = await res.json();
          const items = Array.isArray(payload) ? payload : (payload.items || payload.jobs || payload.clips || []);
          if (items.length > 0) {
            jobList.innerHTML = items.slice(0, 3).map((j) => {
              const title = j.title || j.name || j.filename || ("Clip #" + (j.id || "1"));
              const status = String(j.status || "Ready");
              const isDone = /done|complete|ready|success/i.test(status);
              const pct = Number.isFinite(j.progress) ? j.progress : (isDone ? 100 : 65);
              return `
                <div class="cos-job-item">
                  <div class="cos-job-top">
                    <span class="cos-job-name">${title}</span>
                    <span class="cos-job-stage${isDone ? " done" : ""}">${status}</span>
                  </div>
                  <div class="cos-job-bar-track">
                    <div class="cos-job-bar-fill${isDone ? " done" : ""}" style="width: ${pct}%;"></div>
                  </div>
                  <div class="cos-job-meta">
                    <span>9:16 Studio</span>
                    <span>${pct}%</span>
                  </div>
                </div>
              `;
            }).join("");
          }
        }
      } catch (_) {}
    }
  }
  syncBackendTelemetry();
})();
</script>

  function findTool(toolId) {
    for (const cat of ARCHITECTURE) {
      const found = cat.tools.find((t) => t.id === toolId);
      if (found) return { cat, tool: found };
    }
    return { cat: ARCHITECTURE[0], tool: ARCHITECTURE[0].tools[0] };
  }

  function syncFromHash() {
    const hash = (window.location.hash || "").replace(/^#/, "");
    if (!hash) return;
    const parts = hash.split("/");
    const toolSlug = parts[parts.length - 1];
    const { cat, tool } = findTool(toolSlug);
    if (tool && tool.id === toolSlug) {
      state.activeCat = cat.id;
      state.activeTool = tool.id;
      state.openCats[cat.id] = true;
    }
  }

  function selectTool(toolId, pushHash) {
    const { cat, tool } = findTool(toolId);
    state.activeCat = cat.id;
    state.activeTool = tool.id;
    state.openCats[cat.id] = true;
    persistState();
    if (pushHash !== false) {
      try { history.replaceState(null, "", "#" + cat.id + "/" + tool.id); } catch (_) {}
    }
    renderLeftNav();
    renderWorkspace();
  }

  function renderLeftNav() {
    const moreLabel = document.querySelector(".cos-pill-more-label");
    const moreBar = moreLabel ? moreLabel.parentElement : null;
    if (!moreBar) return;

    let oldNav = moreBar.nextElementSibling;
    if (oldNav && oldNav.id !== "cosLeftCategoryNav" && /Overview|Analytics|01|02/i.test(oldNav.textContent || "")) {
      oldNav.style.display = "none";
    }

    let nav = document.getElementById("cosLeftCategoryNav");
    if (!nav) {
      nav = document.createElement("nav");
      nav.id = "cosLeftCategoryNav";
      nav.setAttribute("aria-label", "Studio Categories");
      moreBar.parentElement.insertBefore(nav, moreBar.nextSibling);
    }

    nav.innerHTML = ARCHITECTURE.map((cat) => {
      const isOpen = Boolean(state.openCats[cat.id]);
      const itemsHtml = cat.tools.map((t) => {
        const isActive = t.id === state.activeTool;
        return `
          <button type="button" class="cos-nav-tool-btn${isActive ? " active" : ""}" data-tool-id="${t.id}" aria-current="${isActive ? "page" : "false"}">
            <span class="cos-nav-tool-main">
              ${t.icon}
              <span>${t.name}</span>
            </span>
          </button>
        `;
      }).join("");

      return `
        <div class="cos-nav-cat-group${isOpen ? " is-open" : ""}" data-cat-id="${cat.id}">
          <button type="button" class="cos-nav-cat-btn" data-toggle-cat="${cat.id}" aria-expanded="${isOpen}">
            <span class="cos-nav-cat-left">
              ${ICONS[cat.id] || ""}
              <span>${cat.label}</span>
            </span>
            <span class="cos-nav-cat-right">
              <span class="cos-nav-cat-count">${cat.tools.length}</span>
              ${ICONS.chevron}
            </span>
          </button>
          <div class="cos-nav-cat-items">${itemsHtml}</div>
        </div>
      `;
    }).join("");

    nav.querySelectorAll("[data-toggle-cat]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const catId = btn.getAttribute("data-toggle-cat");
        state.openCats[catId] = !state.openCats[catId];
        persistState();
        renderLeftNav();
      });
    });

    nav.querySelectorAll("[data-tool-id]").forEach((btn) => {
      btn.addEventListener("click", () => selectTool(btn.getAttribute("data-tool-id"), true));
    });

    window.dispatchEvent(new Event("resize"));
  }

  function showToast(msg) {
    const toast = document.getElementById("cosWsToast");
    if (!toast) return;
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.classList.remove("show"), 3600);
  }

  function drawThumbnailCanvas() {
    const canvas = document.getElementById("cosThumbCanvas");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const w = canvas.width;
    const h = canvas.height;
    const vid = legacyNodes.videoEl;

    if (vid && vid.readyState >= 2 && vid.videoWidth > 0) {
      ctx.drawImage(vid, 0, 0, w, h);
    } else {
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, "#1e1b4b");
      grad.addColorStop(0.5, "#0f172a");
      grad.addColorStop(1, "#312e81");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);
    }

    ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
    ctx.fillRect(0, 0, w, h);

    const headline = (state.thumbHeadline || "WATCH THIS FIRST").toUpperCase();
    ctx.fillStyle = "#fbbf24";
    ctx.font = "800 22px Inter, sans-serif";
    ctx.textAlign = "center";
    const words = headline.split(/\s+/);
    let y = h * 0.48;
    for (let i = 0; i < words.length; i += 2) {
      const line = words.slice(i, i + 2).join(" ");
      ctx.fillText(line, w / 2, y);
      y += 28;
    }
  }

  async function apiPostFirst(regex, payload) {
    const route = findRoute("POST", regex);
    if (!route) return { ok: false, reason: "no-route" };
    try {
      const res = await fetch(route.path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify(payload)
      });
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, status: res.status, data, path: route.path };
    } catch (err) {
      return { ok: false, reason: String(err) };
    }
  }

  function renderWorkspace() {

    let host = document.getElementById("cosStudioArchitecture");
    if (!host) {
      const candidates = Array.from(document.querySelectorAll("main, section, div")).filter((el) => {
        if (el.id === "cosRightRail" || el.id === "cosCenterClipOverlay" || el.id === "cosLeftCategoryNav") return false;
        const r = el.getBoundingClientRect();
        return r.left >= 280 && r.width >= 520 && r.top < 220 && /Studio Command Center|Overview|Active Studio Projects|Processing Queue/i.test(el.textContent || "");
      });
      candidates.sort((a, b) => {
        const ra = a.getBoundingClientRect();
        const rb = b.getBoundingClientRect();
        return (rb.width * rb.height) - (ra.width * ra.height);

      const targetContainer = candidates[0];

      Array.from(targetContainer.children).forEach((child) => {
        if (child.id !== "cosStudioArchitecture") child.style.display = "none";

      legacyNodes.videoEl.style.display = "block";
      legacyNodes.videoEl.style.width = "100%";
      legacyNodes.videoEl.style.borderRadius = "10px";
      videoSlot.appendChild(legacyNodes.videoEl);
    }

    drawThumbnailCanvas();

    // Context bar selectors
    const ctxProj = document.getElementById("cosCtxProjectSelect");
    if (ctxProj) {
      ctxProj.addEventListener("change", () => {
        state.activeProjectId = ctxProj.value;
        persistState();
        renderWorkspace();
      });
    }
    const ctxClip = document.getElementById("cosCtxClipSelect");
    if (ctxClip) {
      ctxClip.addEventListener("change", () => {
        state.activeClipId = ctxClip.value;
        persistState();
        renderWorkspace();
      });
    }

    // Project / Clip list selection buttons
    host.querySelectorAll("[data-select-project]").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.activeProjectId = btn.getAttribute("data-select-project");
        persistState();
        renderWorkspace();
        showToast("Loaded project into active Studio context.");
      });
    });
    host.querySelectorAll("[data-select-clip]").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.activeClipId = btn.getAttribute("data-select-clip");
        persistState();
        selectTool("professional-clip-editor", true);
      });
    });

    host.querySelectorAll("[data-next-tool]").forEach((btn) => {
      btn.addEventListener("click", () => selectTool(btn.getAttribute("data-next-tool"), true));
    });

    host.querySelectorAll("[data-bind]").forEach((inp) => {
      inp.addEventListener("input", () => {
        state[inp.getAttribute("data-bind")] = inp.value;
        persistState();
        if (inp.getAttribute("data-bind") === "thumbHeadline") drawThumbnailCanvas();
      });
    });

    host.querySelectorAll("[data-state-key]").forEach((btn) => {
      btn.addEventListener("click", () => {
        state[btn.getAttribute("data-state-key")] = btn.getAttribute("data-state-val");
        persistState();
        renderWorkspace();
      });
    });

    host.querySelectorAll("[data-toggle-bool]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const k = btn.getAttribute("data-toggle-bool");
        state[k] = !state[k];
        persistState();
        renderWorkspace();
      });
    });

    host.querySelectorAll("[data-range-key]").forEach((rng) => {
      rng.addEventListener("input", () => {
        state[rng.getAttribute("data-range-key")] = Number(rng.value);
        persistState();
      });
      rng.addEventListener("change", () => renderWorkspace());
    });

    const playheadSlider = document.getElementById("cosPlayheadSlider");
    const playheadReadout = document.getElementById("cosPlayheadReadout");
    if (playheadSlider && playheadReadout) {
      playheadSlider.addEventListener("input", () => {
        state.playhead = Number(playheadSlider.value);
        playheadReadout.textContent = state.playhead.toFixed(1) + "s";
        if (legacyNodes.videoEl && Number.isFinite(legacyNodes.videoEl.duration)) {
          legacyNodes.videoEl.currentTime = Math.min(legacyNodes.videoEl.duration, state.playhead);
        }
      });
    }

    host.querySelectorAll("[data-action]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const act = btn.getAttribute("data-action");
        if (act === "save-stage") {
          persistState();
          showToast("Saved " + tool.name + " settings to Studio workspace.");
        } else if (act === "refresh-backend") {
          await refreshBackendData();
          showToast("Synced latest project telemetry from backend.");
        } else if (act === "create-project") {
          const url = state.newUrl.trim();
          const title = state.newTitle.trim() || url || "New Studio Session";
          const res = await apiPostFirst(/\/(projects|ingest|videos|import)\/?$/i, {
            title,
            url,
            source_url: url,
            language: state.language,
            niche: state.niche
          });
          if (res.ok) {
            state.newTitle = "";
            state.newUrl = "";
            await refreshBackendData();
            showToast("Project created via " + res.path + ".");
          } else {
            showToast("Check backend server or paste a valid URL (endpoint: " + (res.path || "/api/projects") + ").");
          }
        } else if (act === "scan-moments") {
          const proj = getActiveProject();
          const res = await apiPostFirst(/\/(moments|highlights|analyze)\/?$/i, {
            project_id: proj ? proj.id : null
          });
          await refreshBackendData();
          showToast(res.ok ? "Highlight scan dispatched to backend." : "Select a processed project to scan highlights.");
        } else if (act === "generate-clips") {
          const proj = getActiveProject();
          const res = await apiPostFirst(/\/(clips|generate|render)\/?$/i, {
            project_id: proj ? proj.id : null,
            duration: state.clipDuration,
            aspect_ratio: state.aspectRatio
          });
          await refreshBackendData();
          showToast(res.ok ? "Clip generation job queued." : "Queued clip preset (" + state.clipDuration + ").");
        } else if (act === "save-trim") {
          const clip = getActiveClip();
          await apiPostFirst(/\/(trim|edit|clips)\/?$/i, {
            clip_id: clip ? clip.id : null,
            start: Number(state.trimIn),
            end: Number(state.trimOut),
            speed: state.speedRamp
          });
          persistState();
          showToast("Saved trim window (" + state.trimIn + "s - " + state.trimOut + "s @ " + state.speedRamp + ").");
        } else if (act === "download-thumbnail") {
          drawThumbnailCanvas();
          const canvas = document.getElementById("cosThumbCanvas");
          if (canvas) {
            const a = document.createElement("a");
            a.download = "studio_cover_9x16.png";
            a.href = canvas.toDataURL("image/png");
            a.click();
            showToast("Downloaded 9:16 PNG cover thumbnail.");
          }
        } else if (act === "score-hook") {
          renderWorkspace();
          showToast("Updated opening hook diagnostic.");
        } else if (act === "copy-metadata") {
          const block = [state.postTitle, state.postDesc, state.pinnedComment ? ("Pinned Comment: " + state.pinnedComment) : ""].filter(Boolean).join("\n\n");
          try { await navigator.clipboard.writeText(block); } catch (_) {}
          showToast("Copied post title, description, and pinned comment to clipboard.");
        } else if (act === "export-video" || act === "export-audio") {
          const isAudio = act === "export-audio";
          const clip = getActiveClip();
          const res = await apiPostFirst(isAudio ? /\/(audio|extract|export)\/?$/i : /\/(export|render)\/?$/i, {
            clip_id: clip ? clip.id : null,
            quality: state.exportQuality,
            audio_only: isAudio,
            audio_format: state.audioFormat,
            aspect_ratio: state.aspectRatio,
            lufs: state.lufsTarget
          });
          if (res.ok && res.data && (res.data.download_url || res.data.url)) {
            window.open(res.data.download_url || res.data.url, "_blank");
          }
          showToast(isAudio ? ("Dispatched master audio export (" + state.audioFormat + ").") : ("Dispatched master video export (" + state.exportQuality + ")."));
        } else if (act === "start-batch") {
          const box = document.getElementById("cosBatchUrlsInput");
          const urls = (box ? box.value : "").split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
          if (!urls.length) {
            showToast("Paste at least one video URL per line first.");
            return;
          }
          let okCount = 0;
          for (const u of urls) {
            const r = await apiPostFirst(/\/(projects|ingest|videos|import)\/?$/i, { url: u, source_url: u });
            if (r.ok) okCount++;
          }
          await refreshBackendData();
          showToast("Dispatched " + okCount + " of " + urls.length + " batch URLs to backend.");
        }
      });
    });
  }

  function initArchitecture() {
    syncFromHash();
    renderLeftNav();
    renderWorkspace();
  }

  window.addEventListener("hashchange", () => {
    syncFromHash();
    renderLeftNav();
    renderWorkspace();
  });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => {
      initArchitecture();
      refreshBackendData();
    });
  } else {
    initArchitecture();
    refreshBackendData();
  }
  setTimeout(initArchitecture, 250);
})();
</script>




<script id="cos-smart-intake-patch">
(function () {
  function getAuthHeaders() {
    const headers = {};
    for (const store of [window.localStorage, window.sessionStorage]) {
      try {
        for (let i = 0; i < store.length; i++) {
          const k = store.key(i);
          const v = store.getItem(k);
          if (!v) continue;
          if (v.startsWith("Bearer ") || v.startsWith("eyJ")) {
            headers["Authorization"] = v.startsWith("Bearer ") ? v : ("Bearer " + v);
            return headers;
          }
        }
      } catch (_) {}
    }
    return headers;
  }

  function deref(oa, obj) {
    if (!obj || typeof obj !== "object") return {};
    if (obj.$ref) {
      const name = obj.$ref.split("/").pop();
      return deref(oa, (oa.components && oa.components.schemas && oa.components.schemas[name]) || {});
    }
    if (Array.isArray(obj.allOf) && obj.allOf.length) {
      return Object.assign({}, ...obj.allOf.map((sub) => deref(oa, sub)));
    }
    return obj;
  }

  function inferFieldValue(oa, propName, rawProp, userVals) {
    const prop = deref(oa, rawProp);
    const key = propName.toLowerCase();

    if (/url|link|uri/.test(key) && userVals.url) return userVals.url;
    if (/title|name|label/.test(key) && userVals.title) return userVals.title;
    if (/lang/.test(key) && userVals.language) return userVals.language;
    if (/niche|category|topic/.test(key) && userVals.niche) return userVals.niche;
    if (/source_type|input_type|type|platform|provider/.test(key)) {
      if (Array.isArray(prop.enum) && prop.enum.length) {
        const target = userVals.isFile ? /file|upload|local/i : /url|youtube|link|web/i;
        const match = prop.enum.find((v) => target.test(String(v)));
        return match !== undefined ? match : prop.enum[0];
      }
      if (userVals.isFile) return "file";
      return /youtube\.com|youtu\.be/i.test(userVals.url || "") ? "youtube" : "url";
    }

    if (prop.default !== undefined) return prop.default;
    if (Array.isArray(prop.enum) && prop.enum.length) return prop.enum[0];

    let t = prop.type;
    if (!t && Array.isArray(prop.anyOf)) {
      const nonNull = prop.anyOf.map((s) => deref(oa, s)).find((s) => s.type && s.type !== "null");
      if (nonNull) {
        if (nonNull.default !== undefined) return nonNull.default;
        if (Array.isArray(nonNull.enum) && nonNull.enum.length) return nonNull.enum[0];
        t = nonNull.type;
      }
    }

    if (t === "integer" || t === "number") {
      if (/clip|count|num|max/.test(key)) return 3;
      if (/dur|sec|len/.test(key)) return 30;
      return 1;
    }
    if (t === "boolean") return true;
    if (t === "array") return [];
    if (t === "object") return {};
    return userVals.url || userVals.title || "default";
  }

  function extractProjectId(data) {
    if (!data || typeof data !== "object") return "";
    const id = data.id ?? data.project_id ?? (data.project && data.project.id) ?? (data.data && data.data.id);
    return id != null ? String(id) : "";
  }

  function showHumanToast(msg) {
    const toast = document.getElementById("cosWsToast");
    if (!toast) return;
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.classList.remove("show"), 4000);
  }

  async function uploadLocalFileProject(file, userVals, onProgress) {
    const authHeaders = getAuthHeaders();
    const oaRes = await fetch("/openapi.json", { credentials: "same-origin" });
    if (!oaRes.ok) throw new Error("Backend server is unreachable.");
    const oa = await oaRes.json();

    let chosen = null;
    for (const [path, methods] of Object.entries(oa.paths || {})) {
      if (!methods || !methods.post) continue;
      if (/auth|login|register|token|logout|export|audio|trim|delete|cancel/i.test(path)) continue;
      const content = (methods.post.requestBody && methods.post.requestBody.content) || {};
      const mp = content["multipart/form-data"];
      if (!mp) continue;
      const schema = deref(oa, mp.schema);
      const props = schema.properties || {};
      const fileEntry = Object.entries(props).find(([k, rawP]) => {
        const p = deref(oa, rawP);
        return p.format === "binary" || /file|video|media|upload/i.test(k);
      });
      if (fileEntry) {
        chosen = { path, op: methods.post, fileField: fileEntry[0], props, required: schema.required || [] };
        if (/project|upload|video|ingest/i.test(path)) break;
      }
    }

    const endpoint = chosen ? chosen.path : "/api/projects";
    const fileField = chosen ? chosen.fileField : "file";
    const props = chosen ? chosen.props : {};
    const required = chosen ? chosen.required : [];

    const fd = new FormData();
    fd.append(fileField, file, file.name);

    const metaVals = Object.assign({}, userVals, { isFile: true });
    for (const [k, rawProp] of Object.entries(props)) {
      if (k === fileField) continue;
      const p = deref(oa, rawProp);
      if (p.format === "binary") continue;
      if (required.includes(k) || /title|name|lang|niche|source_type|platform/i.test(k)) {
        const val = inferFieldValue(oa, k, rawProp, metaVals);
        fd.append(k, typeof val === "object" ? JSON.stringify(val) : String(val));
      }
    }
    if (!Object.keys(props).length && userVals.title) {
      fd.append("title", userVals.title);
    }

    return new Promise((resolve) => {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", endpoint, true);
      xhr.withCredentials = true;
      Object.entries(authHeaders).forEach(([k, v]) => xhr.setRequestHeader(k, v));

      xhr.upload.onprogress = function (ev) {
        if (ev.lengthComputable && typeof onProgress === "function") {
          onProgress(Math.round((ev.loaded / ev.total) * 100));
        }
      };

      xhr.onload = function () {
        let data = {};
        try { data = JSON.parse(xhr.responseText || "{}"); } catch (_) {}
        if (xhr.status >= 200 && xhr.status < 300) {
          resolve({ ok: true, data });
        } else {
          const detail = Array.isArray(data.detail)
            ? data.detail.map((d) => (d.loc ? d.loc.slice(-1)[0] + ": " : "") + d.msg).join(", ")
            : (data.detail || ("Upload failed (HTTP " + xhr.status + ")"));
          resolve({ ok: false, message: detail });
        }
      };

      xhr.onerror = function () {
        resolve({ ok: false, message: "Network error while uploading video." });
      };

      xhr.send(fd);
    });
  }

  async function submitSmartUrlProject(userVals) {
    const authHeaders = getAuthHeaders();
    const oaRes = await fetch("/openapi.json", { credentials: "same-origin" });
    if (!oaRes.ok) throw new Error("Backend server is unreachable.");
    const oa = await oaRes.json();

    const ranked = [];
    for (const [path, methods] of Object.entries(oa.paths || {})) {
      if (!methods || !methods.post) continue;
      if (/auth|login|register|token|logout|export|audio|trim|delete|cancel/i.test(path)) continue;
      const content = (methods.post.requestBody && methods.post.requestBody.content) || {};
      const media = content["application/json"] || content["multipart/form-data"] || content["application/x-www-form-urlencoded"] || {};
      const schema = deref(oa, media.schema);
      const props = schema.properties || {};
      const required = schema.required || [];
      const requiresBinary = required.some((r) => {
        const p = deref(oa, props[r]);
        return p.format === "binary" || /file|upload/i.test(r);
      });
      if (requiresBinary) continue;

      let score = 0;
      if (/url|youtube|link|ingest|import/i.test(path)) score += 30;
      if (/project|video/i.test(path)) score += 20;
      if (Object.keys(props).some((k) => /url|link/i.test(k))) score += 40;
      if (content["application/json"]) score += 10;
      if (score > 0) ranked.push({ path, op: methods.post, score });
    }
    ranked.sort((a, b) => b.score - a.score);

    const chosen = ranked[0] || { path: "/api/projects", op: (oa.paths["/api/projects"] || {}).post || {} };
    const op = chosen.op || {};
    const content = (op.requestBody && op.requestBody.content) || {};
    const isMultipart = Boolean(content["multipart/form-data"] && !content["application/json"]);
    const isUrlEncoded = Boolean(content["application/x-www-form-urlencoded"] && !content["application/json"]);
    const media = content["application/json"] || content["multipart/form-data"] || content["application/x-www-form-urlencoded"] || {};
    const schema = deref(oa, media.schema);
    const props = schema.properties || {};
    const required = schema.required || [];

    const bodyObj = {};
    for (const [k, rawProp] of Object.entries(props)) {
      const p = deref(oa, rawProp);
      if (p.format === "binary") continue;
      if (required.includes(k) || /url|link|title|name|lang|niche|source_type|platform/i.test(k)) {
        bodyObj[k] = inferFieldValue(oa, k, rawProp, userVals);
      }
    }

    const queryParams = new URLSearchParams();
    for (const param of (op.parameters || [])) {
      if (param.in === "query" && (param.required || /url|link|title|name/i.test(param.name))) {
        queryParams.set(param.name, String(inferFieldValue(oa, param.name, param.schema || {}, userVals)));
      }
    }
    const targetUrl = queryParams.toString() ? (chosen.path + "?" + queryParams.toString()) : chosen.path;

    let fetchOpts;
    if (isMultipart) {
      const fd = new FormData();
      Object.entries(bodyObj).forEach(([k, v]) => fd.append(k, typeof v === "object" ? JSON.stringify(v) : String(v)));
      fetchOpts = { method: "POST", headers: authHeaders, credentials: "same-origin", body: fd };
    } else if (isUrlEncoded) {
      const form = new URLSearchParams();
      Object.entries(bodyObj).forEach(([k, v]) => form.append(k, typeof v === "object" ? JSON.stringify(v) : String(v)));
      fetchOpts = {
        method: "POST",
        headers: Object.assign({ "Content-Type": "application/x-www-form-urlencoded" }, authHeaders),
        credentials: "same-origin",
        body: form.toString()
      };
    } else {
      fetchOpts = {
        method: "POST",
        headers: Object.assign({ "Content-Type": "application/json" }, authHeaders),
        credentials: "same-origin",
        body: JSON.stringify(bodyObj)
      };
    }

    const res = await fetch(targetUrl, fetchOpts);
    const data = await res.json().catch(() => ({}));
    if (res.ok) return { ok: true, data };

    const detail = Array.isArray(data.detail)
      ? data.detail.map((d) => (d.loc ? d.loc.slice(-1)[0] + ": " : "") + d.msg).join(", ")
      : (data.detail || ("Could not create project (HTTP " + res.status + ")"));
    return { ok: false, message: detail };
  }

  function finishProjectCreation(data, titleInp, urlInp, fileInp) {
    const newId = extractProjectId(data);
    if (titleInp) titleInp.value = "";
    if (urlInp) urlInp.value = "";
    if (fileInp) fileInp.value = "";

    try {
      const saved = JSON.parse(localStorage.getItem("cos_studio_state_v2") || "{}");
      if (newId) saved.activeProjectId = newId;
      saved.activeCat = "production";
      saved.activeTool = "ai-video-analysis";
      saved.openCats = Object.assign({}, saved.openCats, { production: true });
      localStorage.setItem("cos_studio_state_v2", JSON.stringify(saved));
    } catch (_) {}

    showHumanToast("Project ready! Opening AI Video Analysis...");
    setTimeout(() => {
      window.location.hash = "#production/ai-video-analysis";
      window.location.reload();
    }, 550);
  }

  // Auto-fill project title when a local video file is picked
  document.addEventListener("change", function (e) {
    const inp = e.target;
    if (!inp || inp.type !== "file" || !inp.files || !inp.files.length) return;
    const host = document.getElementById("cosStudioArchitecture");
    const titleInp = host && host.querySelector('[data-bind="newTitle"]');
    const cleanName = inp.files[0].name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ");
    if (titleInp && !titleInp.value.trim()) {
      titleInp.value = cleanName;
      titleInp.dispatchEvent(new Event("input", { bubbles: true }));
    }
    showHumanToast("Selected \"" + inp.files[0].name + "\". Click Create Project to upload.");
  });

  document.addEventListener("click", async function (e) {
    const btn = e.target.closest('[data-action="create-project"]');
    if (!btn) return;
    e.stopImmediatePropagation();
    e.preventDefault();

    const host = document.getElementById("cosStudioArchitecture");
    const titleInp = host && host.querySelector('[data-bind="newTitle"]');
    const urlInp = host && host.querySelector('[data-bind="newUrl"]');
    const langSel = host && host.querySelector('[data-bind="language"]');
    const fileInp = host && host.querySelector('input[type="file"]');

    const pickedFile = fileInp && fileInp.files && fileInp.files[0];
    const url = (urlInp && urlInp.value || "").trim();
    const fallbackTitle = pickedFile ? pickedFile.name.replace(/\.[^.]+$/, "") : (url || "New Studio Project");
    const title = (titleInp && titleInp.value || "").trim() || fallbackTitle;
    const language = (langSel && langSel.value) || "English";

    if (!pickedFile && !url) {
      showHumanToast("Paste a video URL or choose a local video file first.");
      return;
    }

    btn.disabled = true;
    const prev = btn.textContent;

    try {
      let result;
      if (pickedFile) {
        btn.textContent = "Uploading 0%...";
        result = await uploadLocalFileProject(pickedFile, { title, language, niche: "General" }, (pct) => {
          btn.textContent = "Uploading " + pct + "%...";
        });
      } else {
        btn.textContent = "Creating...";
        result = await submitSmartUrlProject({ title, url, language, niche: "General" });
      }

      if (result.ok) {
        finishProjectCreation(result.data, titleInp, urlInp, fileInp);
      } else {
        showHumanToast(result.message);
      }
    } catch (err) {
      showHumanToast(String(err.message || err));
    } finally {
      btn.disabled = false;
      btn.textContent = prev;
    }
  }, true);
})();
</script>

<style id="cos-hide-numbered-tab-style">
  [data-cos-hidden-numbered-tab="true"] {
    display: none !important;
  }

<script id="cos-hide-numbered-tab-script">
(function () {
  const REQUIRED_MARKERS = [
    /1\.\s*Overview\s*&\s*Analytics/i,
    /2\.\s*Create\s*Short\s*\(Studio\)/i
  ];

  function isPureLegacyNumberedBox(el) {
    if (!el || !(el instanceof HTMLElement)) return false;
    if (
      el.id === "cosLeftCategoryNav" ||
      el.id === "cosStudioArchitecture" ||
      el.closest("#cosLeftCategoryNav") ||
      el.closest("#cosStudioArchitecture") ||
      el.querySelector("#cosLeftCategoryNav") ||
      el.querySelector("#cosStudioArchitecture") ||
      el.querySelector(".cos-pill-more-label") ||
      el.querySelector("input, video, canvas, textarea")
    ) {
      return false;
    }

    const tag = el.tagName;
    if (tag === "BODY" || tag === "HTML" || tag === "MAIN" || tag === "ASIDE") return false;

    const rawText = (el.textContent || "").trim();
    if (!rawText || rawText.length > 1500) return false;
    if (!REQUIRED_MARKERS.every((rx) => rx.test(rawText))) return false;

    // Strip all legacy numbered menu entries (e.g., "1. Overview & Analytics", "01")
    // If ANY other UI text remains, this element is an outer wrapper and must NOT be hidden.
    const remainder = rawText
      .replace(/\b\d{1,2}\.\s+[A-Za-z0-9 &()\/\-]+/g, " ")
      .replace(/\b0?\d{1,2}\b/g, " ")
      .replace(/\s+/g, "");

    return remainder.length === 0;
  }

  function hideLegacyNumberedCard() {
    const matches = Array.from(document.querySelectorAll("div, nav, ul, section")).filter(isPureLegacyNumberedBox);
    if (!matches.length) return;

    // Pick the outermost pure wrapper that still contains ONLY those numbered items
    matches.sort((a, b) => (b.textContent || "").length - (a.textContent || "").length);
    const card = matches[0];

    if (card.getAttribute("data-cos-hidden-numbered-tab") !== "true") {
      card.setAttribute("data-cos-hidden-numbered-tab", "true");
      card.style.setProperty("display", "none", "important");
      window.dispatchEvent(new Event("resize"));
    }
  }

  hideLegacyNumberedCard();
  setTimeout(hideLegacyNumberedCard, 100);
  setTimeout(hideLegacyNumberedCard, 400);
  setTimeout(hideLegacyNumberedCard, 1000);

  let rafPending = false;
  const observer = new MutationObserver(() => {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => {
      rafPending = false;
      hideLegacyNumberedCard();
    });
  });

  if (document.body) {
    observer.observe(document.body, { childList: true, subtree: true });
  } else {
    document.addEventListener("DOMContentLoaded", () => {
      hideLegacyNumberedCard();
      observer.observe(document.body, { childList: true, subtree: true });
    });
  }
})();
</script>

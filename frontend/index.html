<script id="cos-export-center-script">
(function () {
  window.__cosExportCenterLockedOpen = false;
  let cachedExpBox = null;

  function getStudioState() {
    try { return JSON.parse(localStorage.getItem("cos_studio_state_v2") || "{}"); } catch (_) { return {}; }
  }

  function setStudioState(patch) {
    try {
      const next = Object.assign({}, getStudioState(), patch);
      localStorage.setItem("cos_studio_state_v2", JSON.stringify(next));
    } catch (_) {}
  }

  function getActiveProjectId() {
    const sel = document.getElementById("cosCtxProjectSelect");
    if (sel && sel.value && sel.value !== "undefined") return sel.value;
    const st = getStudioState();
    if (st.activeProjectId && st.activeProjectId !== "undefined") return String(st.activeProjectId);
    return "proj-bf2e1fae";
  }

  function getActiveClipFilename() {
    const topSel = document.getElementById("cosCtxClipSelect");
    if (topSel && topSel.value && topSel.value.endsWith(".mp4")) return topSel.value;
    const st = getStudioState();
    return (st.activeClipFilename && st.activeClipFilename.endsWith(".mp4")) ? st.activeClipFilename : "";
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function normalizeLabel(el) {
    return (el.textContent || "")
      .replace(/\bPage\s*\d+\s*of\s*\d+\b/gi, "")
      .replace(/\s+/g, " ")
      .trim()
      .toLowerCase();
  }

  function isExportCenterNavLabel(lbl) {
    return /^export\s*center$/i.test(lbl);
  }

  function getStageElement() {
    const host = document.getElementById("cosStudioArchitecture");
    if (!host) return null;
    return host.querySelector(".cos-tool-stage") || host;
  }

  function hideOtherStagePanelsForExp(stage) {
    if (!stage) return;
    Array.from(stage.children).forEach((ch) => {
      if (
        ch.id === "cosAutoAiBanner" ||
        ch.id === "cosExportCenterBox" ||
        ch.classList.contains("cos-ai-tab-status-bar") ||
        ch.querySelector("[data-cos-thumb-primary='1']") ||
        ch.querySelector("[data-cos-anim-primary='1']")
      ) {
        return;
      }
      if (ch.style.display !== "none") {
        ch.setAttribute("data-cos-hidden-custom", "1");
        ch.style.display = "none";
      }
    });
  }

  function closeExportCenterView(restoreStage) {
    window.__cosExportCenterLockedOpen = false;
    cachedExpBox = null;
    document.querySelectorAll("#cosExportCenterBox").forEach((el) => el.remove());
    if (restoreStage) {
      const stage = getStageElement();
      if (stage) {
        Array.from(stage.children).forEach((ch) => {
          if (ch.hasAttribute("data-cos-hidden-custom")) {
            ch.style.display = "";
            ch.removeAttribute("data-cos-hidden-custom");
          }
        });
      }
    }
  }

  function openExportCenterView(navBtn) {
    // Release all other custom panel locks cleanly
    window.__cosThumbLockedOpen = false;
    window.__cosThumbOpening = false;
    window.__cosAnimLockedOpen = false;
    window.__cosHookLabLockedOpen = false;
    window.__cosCapLabLockedOpen = false;
    window.__cosCqiLockedOpen = false;
    window.__cosAbLabLockedOpen = false;
    window.__cosVsaLockedOpen = false;
    document.querySelectorAll(
      "#cosThumbnailStudioBox, #cosAnimationsStudioBox, #cosHookLabBox, #cosCaptionTitleLabBox, #cosClipQualityInspectorBox, #cosAbTestingLabBox, #cosViralScoreBox"
    ).forEach((el) => el.remove());
    document.querySelectorAll("[data-cos-thumb-primary='1'], [data-cos-anim-primary='1'], .cos-anim-nav-tab").forEach((t) => {
      t.classList.remove("active");
      t.setAttribute("aria-selected", "false");
    });

    window.__cosExportCenterLockedOpen = true;

    const stage = getStageElement();
    if (!stage) return;

    if (navBtn) {
      document.querySelectorAll("#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a").forEach((b) => {
        if (b !== navBtn) b.classList.remove("active");
      });
      navBtn.classList.add("active");
    }

    hideOtherStagePanelsForExp(stage);

    const pid = getActiveProjectId();
    const preferredFn = getActiveClipFilename();

    const statusBar = stage.querySelector(".cos-ai-tab-status-bar");
    if (statusBar) {
      statusBar.innerHTML = `
        <span>Section: <strong>Output</strong> &bull; Active Tool: <strong>Export Center</strong></span>
        <span>Project: <strong>${escapeHtml(pid)}</strong>${preferredFn ? ` &bull; Clip: <strong>${escapeHtml(preferredFn)}</strong>` : ""}</span>
      `;
    }

    const existing = document.getElementById("cosExportCenterBox");
    if (existing) {
      existing.style.display = "";
      return;
    }

    const box = document.createElement("div");
    box.id = "cosExportCenterBox";
    box.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;">
        <div>
          <div style="font-size:11.5px;font-weight:700;color:#38bdf8;text-transform:uppercase;letter-spacing:0.04em;">
            Output &bull; 1. Export Center
          </div>
          <h2 style="margin:2px 0 4px 0;font-size:20px;font-weight:800;color:#ffffff;">Multi-Platform Master Exporter &amp; Deliverables Vault</h2>
          <div style="font-size:12.5px;color:#94a3b8;">Export platform-calibrated MP4 masters, download individual clips, subtitles, thumbnails &amp; reports, or package a full release .ZIP bundle.</div>
        </div>
        <button type="button" data-role="refresh-btn" class="cos-exp-pill-btn" style="padding:7px 11px;font-size:11.5px;">
          ? Refresh Vault
        </button>
      </div>

      <div class="cos-exp-summary-bar">
        <div data-role="summary-headline" style="font-size:12.5px;color:#e2e8f0;">
          Scanning project deliverables in <strong>storage/outputs/${escapeHtml(pid)}</strong>...
        </div>
        <div data-role="summary-badges" style="display:flex;gap:8px;flex-wrap:wrap;font-size:11px;font-weight:800;color:#6ee7b7;"></div>
      </div>

      <div class="cos-exp-layout">
        <div class="cos-exp-preview-card">
          <div class="cos-exp-video-wrap">
            <video data-role="preview-video" controls playsinline></video>
          </div>
          <div style="font-size:11px;color:#94a3b8;text-align:center;" data-role="preview-meta">
            Active Clip Preview
          </div>
          <a data-role="dl-mp4-btn" href="#" download style="display:none;padding:9px 10px;border-radius:10px;background:#10b981;color:#022c22;font-size:12px;font-weight:800;text-align:center;text-decoration:none;">
            ? Download Exported Master MP4
          </a>
          <a data-role="dl-zip-btn" href="#" download style="display:none;padding:9px 10px;border-radius:10px;background:rgba(56,189,248,0.20);border:1px solid rgba(56,189,248,0.48);color:#e0f2fe;font-size:12px;font-weight:800;text-align:center;text-decoration:none;">
            ?? Download Full Release Bundle (.ZIP)
          </a>
        </div>

        <div style="display:flex;flex-direction:column;gap:12px;">
          <div class="cos-exp-panel">
            <div style="font-size:11.5px;font-weight:800;color:#38bdf8;text-transform:uppercase;letter-spacing:0.04em;">
              1. Configure Platform Master &amp; Release Bundle
            </div>
            <div>
              <label style="display:block;font-size:11px;font-weight:700;color:#cbd5e1;margin-bottom:3px;">Source Clip to Export</label>
              <select data-role="clip-sel" class="cos-exp-select">
                <option value="${escapeHtml(preferredFn)}">${escapeHtml(preferredFn || (pid + ".mp4"))}</option>
              </select>
            </div>

            <div class="cos-exp-row-2">
              <div>

    stage.appendChild(box);
    cachedExpBox = box;

    const q = (sel) => box.querySelector(sel);
    const refreshBtn = q("[data-role='refresh-btn']");
    const summaryHeadEl = q("[data-role='summary-headline']");
    const summaryBadgesEl = q("[data-role='summary-badges']");
    const videoEl = q("[data-role='preview-video']");
    const previewMeta = q("[data-role='preview-meta']");
    const dlMp4Btn = q("[data-role='dl-mp4-btn']");
    const dlZipBtn = q("[data-role='dl-zip-btn']");
    const clipSel = q("[data-role='clip-sel']");
    const presetSel = q("[data-role='preset-sel']");
    const bitrateSel = q("[data-role='bitrate-sel']");
    const normChk = q("[data-role='norm-chk']");
    const zipChk = q("[data-role='zip-chk']");
    const srtChk = q("[data-role='srt-chk']");
    const exportBtn = q("[data-role='export-btn']");
    const vaultListEl = q("[data-role='vault-list']");
    const statusBox = q("[data-role='status-box']");

    let allItems = [];
    let activeFilter = "all";

    function renderVault() {
      const filtered = allItems.filter((it) => {
        if (activeFilter === "all") return true;
        if (activeFilter === "report") return it.kind === "report" || it.kind === "bundle";
        return it.kind === activeFilter;
      });

      if (!filtered.length) {
        vaultListEl.innerHTML = `<div style="font-size:11.5px;color:#94a3b8;padding:8px;">No deliverables in this category yet.</div>`;
        return;
      }

      vaultListEl.innerHTML = filtered.map((it) => `
        <div class="cos-exp-vault-row">
          <div style="min-width:0;flex:1;">
            <div style="font-size:11.5px;font-weight:800;color:#ffffff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
              ${escapeHtml(it.filename)}
            </div>
            <div style="font-size:10px;color:#94a3b8;">
              <span style="color:#38bdf8;font-weight:700;">${escapeHtml(it.tag)}</span> &bull; ${escapeHtml(it.size_label)}
            </div>
          </div>
          <div style="display:flex;gap:5px;flex-shrink:0;">
            ${it.kind === "video" ? `<button type="button" class="cos-exp-pill-btn" data-prev-url="${escapeHtml(it.url)}" data-prev-fn="${escapeHtml(it.filename)}">Preview</button>` : ""}
            <a href="${escapeHtml(it.url)}" download="${escapeHtml(it.filename)}" class="cos-exp-pill-btn" style="background:rgba(16,185,129,0.18);border-color:rgba(16,185,129,0.45);color:#a7f3d0;">
              Download
            </a>
          </div>
        </div>
      `).join("");

      vaultListEl.querySelectorAll("button[data-prev-url]").forEach((pBtn) => {
        pBtn.addEventListener("click", () => {
          const u = pBtn.getAttribute("data-prev-url") || "";
          const fn = pBtn.getAttribute("data-prev-fn") || "";
          videoEl.src = u;
          videoEl.load();
          videoEl.play().catch(() => {});
          previewMeta.textContent = fn;
          dlMp4Btn.href = u;
          dlMp4Btn.download = fn;
          dlMp4Btn.style.display = "block";
        });
      });
    }

    async function scanProjectVault(fn) {
      summaryHeadEl.innerHTML = `Scanning project deliverables in <strong>storage/outputs/${escapeHtml(pid)}</strong>...`;
      const resp = await fetch("/api/cos-export-center-scan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ project_id: pid, clip_filename: fn })
      }).then((r) => r.json()).catch(() => ({}));

      if (resp && resp.ok) {
        allItems = Array.isArray(resp.items) ? resp.items : [];
        const c = resp.counts || {};
        summaryHeadEl.innerHTML = `Vault Indexed: <strong>${resp.total_files}</strong> deliverables (<strong>${resp.total_mb} MB</strong> total)`;
        summaryBadgesEl.innerHTML = `
          <span>${c.videos || 0} MP4s</span>
          <span>&bull; ${c.subtitles || 0} .SRT</span>
          <span>&bull; ${c.images || 0} Images</span>
          <span>&bull; ${c.reports || 0} Reports/ZIPs</span>
        `;

        const videos = allItems.filter((i) => i.kind === "video");
        if (videos.length) {
          const active = videos.find((v) => v.filename === (fn || resp.active_clip)) || videos[0];
          clipSel.innerHTML = videos.map((v) =>
            `<option value="${escapeHtml(v.filename)}" ${v.filename === active.filename ? "selected" : ""}>${escapeHtml(v.filename)} (${v.size_label})</option>`
          ).join("");
          videoEl.src = active.url;
          videoEl.load();
          previewMeta.textContent = `${active.filename} (${active.size_label})`;
          dlMp4Btn.href = active.url;
          dlMp4Btn.download = active.filename;
          dlMp4Btn.style.display = "block";
        }

        const latestZip = allItems.find((i) => i.kind === "bundle");
        if (latestZip) {
          dlZipBtn.href = latestZip.url;
          dlZipBtn.download = latestZip.filename;
          dlZipBtn.style.display = "block";
        }

        renderVault();
      } else {
        summaryHeadEl.textContent = resp.detail || "No output deliverables found for this project yet.";
      }
    }

    box.querySelectorAll("[data-role='filter-tabs'] [data-kind]").forEach((fBtn) => {
      fBtn.addEventListener("click", () => {
        box.querySelectorAll("[data-role='filter-tabs'] [data-kind]").forEach((b) => {
          b.style.background = "rgba(14, 165, 233, 0.16)";
          b.style.color = "#e0f2fe";
        });
        fBtn.style.background = "#0ea5e9";
        fBtn.style.color = "#082f49";
        activeFilter = fBtn.getAttribute("data-kind") || "all";
        renderVault();
      });
    });

    refreshBtn.addEventListener("click", () => scanProjectVault(clipSel.value));
    clipSel.addEventListener("change", () => {
      const chosen = allItems.find((i) => i.filename === clipSel.value);
      if (chosen) {
        setStudioState({ activeClipFilename: chosen.filename });
        videoEl.src = chosen.url;
        videoEl.load();
        previewMeta.textContent = `${chosen.filename} (${chosen.size_label})`;
        dlMp4Btn.href = chosen.url;
        dlMp4Btn.download = chosen.filename;
        dlMp4Btn.style.display = "block";
      }
    });

    exportBtn.addEventListener("click", async () => {
      exportBtn.disabled = true;
      exportBtn.textContent = "Encoding Platform Master & Packaging Release...";
      statusBox.textContent = "Transcoding H.264 yuv420p master, normalizing -14 LUFS audio & building release archive...";

      const resp = await fetch("/api/cos-export-center-render", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          project_id: pid,
          clip_filename: clipSel.value,
          preset_id: presetSel.value,
          bitrate_mode: bitrateSel.value,
          norm_audio: normChk.checked,
          bundle_zip: zipChk.checked,
          include_srt: srtChk.checked,
          include_thumbs: true,
          include_reports: srtChk.checked
        })
      }).then((r) => r.json()).catch((err) => ({ detail: String(err) }));

      exportBtn.disabled = false;
      exportBtn.textContent = "Export Platform Master & Package Release (.MP4 + .ZIP)";

      if (resp && resp.ok && resp.clip) {
        setStudioState({ activeClipFilename: resp.clip.filename });
        videoEl.src = resp.clip.url;
        videoEl.load();
        videoEl.play().catch(() => {});
        previewMeta.textContent = `${resp.clip.filename} (${resp.clip.size_mb} MB)`;
        dlMp4Btn.href = resp.clip.url;
        dlMp4Btn.download = resp.clip.filename;
        dlMp4Btn.style.display = "block";

        if (resp.zip && resp.zip.url) {
          dlZipBtn.href = resp.zip.url;
          dlZipBtn.download = resp.zip.filename;
          dlZipBtn.style.display = "block";
        }

        if (Array.isArray(resp.items)) {
          allItems = resp.items;
          summaryHeadEl.innerHTML = `Vault Indexed: <strong>${resp.total_files}</strong> deliverables (<strong>${resp.total_mb} MB</strong> total)`;
          renderVault();
        }

        const zipMsg = resp.zip ? ` &bull; Bundle: <strong>${escapeHtml(resp.zip.filename)}</strong> (${resp.zip.size_mb} MB)` : "";
        statusBox.innerHTML = `<strong style="color:#6ee7b7;">Export Complete!</strong> Saved <strong>${escapeHtml(resp.clip.filename)}</strong> (${resp.clip.size_mb} MB)${zipMsg}.`;
      } else {
        statusBox.textContent = resp.detail || "Could not export master clip.";
      }
    });

    scanProjectVault(preferredFn);
  }

  function findExportCenterNavTarget(target) {
    if (!target || target.closest("#cosExportCenterBox")) return null;
    return Array.from(document.querySelectorAll("#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a, #cosStudioArchitecture button, #cosStudioArchitecture a, [role='tab'], .cos-subtool-btn, .cos-tab-btn"))
      .find((el) => el.contains(target) && isExportCenterNavLabel(normalizeLabel(el))) || null;
  }

  ["pointerdown", "click"].forEach((evtType) => {
    document.addEventListener(evtType, function (e) {
      const expNav = findExportCenterNavTarget(e.target);
      if (expNav) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        openExportCenterView(expNav);
        return;
      }

      if (evtType !== "click" || !e.isTrusted) return;

      const otherNav = e.target.closest(
        "#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a, #cosStudioArchitecture button, #cosStudioArchitecture a, [role='tab'], [data-tool], [data-page], [data-subtool], .cos-subtool-btn, .cos-tab-btn"
      );
      if (otherNav && !otherNav.closest("#cosExportCenterBox") && !otherNav.closest("#cosAutoAiBanner")) {
        const lbl = normalizeLabel(otherNav);
        const isOtherCustom = /^thumbnail\s*designer$/i.test(lbl) || /^animations?$/i.test(lbl) || /^hook\s*laboratory$/i.test(lbl) || /^caption\s*(?:&|and)\s*title\s*lab$/i.test(lbl) || /^clip\s*quality\s*inspect[eo]r$/i.test(lbl) || /^a\s*\/?\s*b\s*testing\s*lab$/i.test(lbl) || /^viral\s*score\s*analysis$/i.test(lbl) || /^export\s*center$/i.test(lbl);
        closeExportCenterView(!isOtherCustom);
      }
    }, true);
  });

  setTimeout(() => {
    const activeExpBtn = Array.from(document.querySelectorAll("#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a"))
      .find((el) => isExportCenterNavLabel(normalizeLabel(el)) && (el.classList.contains("active") || el.getAttribute("aria-selected") === "true"));
    if (activeExpBtn) {
      openExportCenterView(activeExpBtn);
    }
  }, 350);

  setInterval(() => {
    if (window.__cosExportCenterLockedOpen) {
      const stage = getStageElement();
      if (stage) {
        hideOtherStagePanelsForExp(stage);
        if (!document.getElementById("cosExportCenterBox") && cachedExpBox) {
          stage.appendChild(cachedExpBox);
        }
      }
    }
  }, 250);
})();
</script>

<script id="cos-remove-quick-render-script">
(function () {
  function isProtectedContainer(el) {
    if (!el || el === document.body || el === document.documentElement) return true;
    if (
      el.id === "cosStudioArchitecture" ||
      el.id === "cosLeftCategoryNav" ||
      el.classList.contains("cos-tool-stage") ||
      el.tagName === "ASIDE" ||
      el.tagName === "MAIN"
    ) {
      return true;
    }
    // Never hide containers that hold sidebar navigation links/buttons
    if (el.querySelector("#cosLeftCategoryNav, .cos-tool-stage")) return true;
    return false;
  }

  function hideWidgetContainer(el) {
    if (!el || isProtectedContainer(el)) return;
    el.setAttribute("data-cos-removed-widget", "1");
    el.style.setProperty("display", "none", "important");
  }

  function purgeQuickStudioAndRenderPipeline() {
    const allEls = document.querySelectorAll("div, section, aside, footer, header, nav");
    allEls.forEach((el) => {
      if (el.hasAttribute("data-cos-removed-widget") || isProtectedContainer(el)) return;

      const txt = (el.textContent || "").replace(/\s+/g, " ").trim();
      if (!txt || txt.length > 420) return;

      // Match QUICK STUDIO (1080p 60fps) card/bar
      const isQuickStudio =
        /\bQUICK\s*STUDIO\b/i.test(txt) &&
        (/\b1080p\b/i.test(txt) || /\b60\s*fps\b/i.test(txt) || txt.length < 60);

      // Match RENDER PIPELINE (Engine Online) pill/bar
      const isRenderPipeline =
        /\bRENDER\s*PIPELINE\b/i.test(txt) &&
        (/\bEngine\s*Online\b/i.test(txt) || /\bOnline\b/i.test(txt) || txt.length < 60);

      if (isQuickStudio || isRenderPipeline) {
        // Walk up at most 2 wrapper levels if the immediate parent only wraps this widget
        let target = el;
        for (let i = 0; i < 2; i++) {
          const p = target.parentElement;
          if (!p || isProtectedContainer(p)) break;
          const pTxt = (p.textContent || "").replace(/\s+/g, " ").trim();
          if (pTxt === txt) {
            target = p;
          } else {
            break;
          }
        }
        hideWidgetContainer(target);
      }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", purgeQuickStudioAndRenderPipeline);
  } else {
    purgeQuickStudioAndRenderPipeline();
  }
  window.addEventListener("load", purgeQuickStudioAndRenderPipeline);

  const obs = new MutationObserver(() => {
    purgeQuickStudioAndRenderPipeline();
  });
  obs.observe(document.documentElement, { childList: true, subtree: true });

  setTimeout(purgeQuickStudioAndRenderPipeline, 150);
  setTimeout(purgeQuickStudioAndRenderPipeline, 600);
  setTimeout(purgeQuickStudioAndRenderPipeline, 1500);
})();
</script>

<script id="cos-native-greeting-helper">
(function () {
  function getUserName() {
    try {
      const keys = ["cos_username", "username", "user", "auth_user", "cos_user"];
      for (const k of keys) {
        const raw = localStorage.getItem(k) || sessionStorage.getItem(k);
        if (!raw) continue;
        if (raw.trim().startsWith("{")) {
          const obj = JSON.parse(raw);
          const c = obj.username || obj.name || obj.email || obj.user;
          if (c && String(c).trim()) return String(c).trim();
        } else if (raw.trim() && raw !== "undefined" && raw !== "null") {
          return raw.trim();
        }
      }
    } catch (_) {}
    const inp = document.querySelector("input[type='text'], input[type='email'], input[name*='user' i]");
    if (inp && inp.value && inp.value.trim()) return inp.value.trim();
    return "Creator";
  }

  function hookInputs() {
    document.querySelectorAll("input[type='text'], input[type='email'], input[name*='user' i]").forEach((inp) => {
      if (inp.dataset.cosGreetSaved) return;
      inp.dataset.cosGreetSaved = "1";
      const save = () => {
        if (inp.value && inp.value.trim()) {
          try { localStorage.setItem("cos_username", inp.value.trim()); } catch (_) {}
        }
      };
      inp.addEventListener("input", save);
      inp.addEventListener("change", save);
    });
  }

  function applyNativeGreeting() {
    hookInputs();
    const raw = getUserName();
    const clean = raw.includes("@") ? raw.split("@")[0] : raw;
    const name = clean.charAt(0).toUpperCase() + clean.slice(1);
    const hr = new Date().getHours();
    const tod = hr < 12 ? "Good morning" : (hr < 18 ? "Good afternoon" : "Good evening");

    document.querySelectorAll("strong").forEach((el) => {
      if (/1\.\s*Welcome\s+back,/i.test(el.textContent || "")) {
        el.textContent = `1. ${tod}, ${name}`;
      }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", applyNativeGreeting);
  } else {
    applyNativeGreeting();
  }
  window.addEventListener("load", applyNativeGreeting);
  setInterval(applyNativeGreeting, 700);
})();
</script>

<script id="cos-cap-card-upgrade-script">
(function () {
  function enhanceCapabilitiesCard() {
    const candidates = Array.from(document.querySelectorAll("div, section, aside"));
    for (const el of candidates) {
      if (el.id === "cosLoginLeftWing" || el.closest("#cosLoginLeftWing")) continue;
      const txt = (el.textContent || "").replace(/\s+/g, " ").trim();
      if (!txt || txt.length > 560) continue;

      if (/WORKSPACE\s+CAPABILITIES/i.test(txt) && /AI\s+Viral\s+Moment\s+Detection/i.test(txt)) {
        let card = el;
        if (card.parentElement && card.parentElement !== document.body) {
          const pTxt = (card.parentElement.textContent || "").replace(/\s+/g, " ").trim();
          if (pTxt === txt) {
            card = card.parentElement;
          }
        }

        card.setAttribute("data-cos-cap-card", "1");

        if (!card.querySelector(".cos-cap-hook-wrap")) {
          const headerRow = card.firstElementChild;
          const hookBox = document.createElement("div");
          hookBox.className = "cos-cap-hook-wrap";
          hookBox.innerHTML = `
            <h3 class="cos-cap-hook-title">Stop the Scroll in 3 Seconds. Turn Every Upload Into a Viral Machine.</h3>
            <div class="cos-cap-hook-sub">AI hook detection, auto-reframe, dynamic captions &amp; broadcast mastering &mdash; built for non-stop short-form growth.</div>
          `;
          if (headerRow && headerRow.nextSibling) {
            card.insertBefore(hookBox, headerRow.nextSibling);
          } else {
            card.insertBefore(hookBox, card.firstChild);
          }
        }
        break;
      }
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", enhanceCapabilitiesCard);
  } else {
    enhanceCapabilitiesCard();
  }
  window.addEventListener("load", enhanceCapabilitiesCard);
  setInterval(enhanceCapabilitiesCard, 350);
})();

<script id="cos-suggestion-page-script">
(function () {
  function esc(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function isLoginVisible() {
    const studio = document.getElementById("cosStudioArchitecture");
    if (studio && studio.offsetParent !== null && studio.style.display !== "none") {
      return false;
    }
    const inputs = Array.from(document.querySelectorAll("input[type='password']"));
    return inputs.some((inp) => inp.offsetParent !== null);
  }

  function getSavedUser() {
    try {
      return localStorage.getItem("cos_username") || "Creator";
    } catch (_) {
      return "Creator";
    }
  }

  function getLocalFallbackList() {
    try {
      return JSON.parse(localStorage.getItem("cos_local_suggestions_v1") || "[]");
    } catch (_) {
      return [];
    }
  }

  function setLocalFallbackList(items) {
    try {
      localStorage.setItem("cos_local_suggestions_v1", JSON.stringify(items));
    } catch (_) {}
  }

  async function refreshSavedSuggestions(section) {
    const listEl = section.querySelector("[data-role='sg-list']");
    const countEl = section.querySelector("[data-role='sg-count']");
    if (!listEl) return;

    let items = [];
    try {
      const res = await fetch("/api/suggestions");
      const data = await res.json();
      if (data && data.ok && Array.isArray(data.items)) {
        items = data.items;
        setLocalFallbackList(items);
      } else {
        items = getLocalFallbackList();
      }
    } catch (_) {
      items = getLocalFallbackList();
    }

    if (countEl) {
      countEl.textContent = items.length + (items.length === 1 ? " Saved Suggestion" : " Saved Suggestions");
    }

    if (!items.length) {
      listEl.innerHTML = `<div style="font-size:12.5px;color:#94a3b8;padding:12px;border-radius:10px;background:rgba(10,14,26,0.5);">No suggestions saved yet. Submit your first feature idea above.</div>`;
      return;
    }

    listEl.innerHTML = items.map((item) => `
      <div class="cos-sg-card" data-item-id="${esc(item.id || "")}">
        <div>
          <div class="cos-sg-card-meta">
            <span class="cos-sg-tag">${esc(item.category || "Feature Request")}</span>
            <span class="cos-sg-prio">${esc(item.priority || "High Impact")}</span>
          </div>
          <div class="cos-sg-card-body" style="margin-top:9px;">${esc(item.message || "")}</div>
        </div>
        <div class="cos-sg-card-foot">
          <span>By <strong style="color:#e2e8f0;">${esc(item.name || "Creator")}</strong>${item.sender_email ? " (" + esc(item.sender_email) + ")" : ""} &bull; ${esc(item.timestamp || "")}</span>
          <button type="button" class="cos-sg-mini-btn" data-del-id="${esc(item.id || "")}" style="padding:3px 8px;font-size:10.5px;">Remove</button>
        </div>
      </div>
    `).join("");

    listEl.querySelectorAll("[data-del-id]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const delId = btn.getAttribute("data-del-id");
        if (!delId) return;
        try {
          await fetch("/api/suggestions/delete", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: delId }),
          });
        } catch (_) {}
        setLocalFallbackList(getLocalFallbackList().filter((x) => x.id !== delId));
        refreshSavedSuggestions(section);
      });
    });
  }

  function buildSuggestionSection() {
    if (document.getElementById("cosSuggestionPageSection")) return;

    const section = document.createElement("section");
    section.id = "cosSuggestionPageSection";
    section.innerHTML = `
      <div class="cos-sg-top">
        <div>
          <div class="cos-sg-pill">CREATOR FEEDBACK &amp; ROADMAP INBOX</div>
          <h2 class="cos-sg-title">Got a Feature Idea or Suggestion? Save It to the Studio Roadmap</h2>
          <p class="cos-sg-sub">Share new tool ideas, workflow upgrades, or bug reports &mdash; every submission saves directly inside your local Studio Inbox.</p>
        </div>
        <div class="cos-sg-live-badge">Local Studio Inbox Active</div>
      </div>

      <form data-role="sg-form">
        <div class="cos-sg-grid">
          <div class="cos-sg-field">
            <label>Your Name</label>
            <input type="text" class="cos-sg-input" data-role="sg-name" placeholder="Creator name">
          </div>
          <div class="cos-sg-field">
            <label>Contact / Handle (Optional)</label>
            <input type="text" class="cos-sg-input" data-role="sg-email" placeholder="@handle or email">
          </div>
          <div class="cos-sg-field">
            <label>Suggestion Category</label>
            <select class="cos-sg-select" data-role="sg-category">
              <option value="Feature Request">Feature Request</option>
              <option value="AI Viral & Hook Engine">AI Viral &amp; Hook Engine</option>
              <option value="UI / UX Design">UI / UX Design</option>
              <option value="Export & Audio Quality">Export &amp; Audio Quality</option>
              <option value="Bug Report">Bug Report</option>
            </select>
          </div>
          <div class="cos-sg-field">
            <label>Priority Level</label>
            <select class="cos-sg-select" data-role="sg-priority">
              <option value="High Impact">High Impact</option>
              <option value="Must Have">Must Have</option>
              <option value="Nice to Have">Nice to Have</option>
            </select>
          </div>
        </div>

        <div class="cos-sg-field">
          <label>Your Suggestion Details</label>
          <textarea class="cos-sg-textarea" data-role="sg-message" placeholder="Describe the feature, workflow improvement, or idea you want built next..." required></textarea>
        </div>

        <div class="cos-sg-actions">
          <button type="submit" class="cos-sg-submit" data-role="sg-submit-btn">Save Suggestion &rarr;</button>
          <div class="cos-sg-status" data-role="sg-status"></div>
        </div>
      </form>

      <div class="cos-sg-inbox">
        <div class="cos-sg-inbox-head">
          <h3 class="cos-sg-inbox-title" data-role="sg-count">Saved Suggestions</h3>
          <button type="button" class="cos-sg-mini-btn" data-role="sg-export-btn">Export .TXT</button>
        </div>
        <div class="cos-sg-list" data-role="sg-list"></div>
      </div>
    `;

    const nameInp = section.querySelector("[data-role='sg-name']");
    if (nameInp) nameInp.value = getSavedUser();

    const exportBtn = section.querySelector("[data-role='sg-export-btn']");
    exportBtn.addEventListener("click", () => {
      const items = getLocalFallbackList();
      if (!items.length) return;
      const lines = items.map((it, i) =>
        `#${i + 1} [${it.timestamp}] (${it.category} - ${it.priority}) by ${it.name}${it.sender_email ? " (" + it.sender_email + ")" : ""}\n${it.message}\n`
      );
      const blob = new Blob([lines.join("\n---\n\n")], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "ai-clipping-os-suggestions.txt";
      a.click();
      URL.revokeObjectURL(url);
    });

    const form = section.querySelector("[data-role='sg-form']");
    const submitBtn = section.querySelector("[data-role='sg-submit-btn']");
    const statusBox = section.querySelector("[data-role='sg-status']");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const msgEl = section.querySelector("[data-role='sg-message']");
      const payload = {
        name: section.querySelector("[data-role='sg-name']").value,
        sender_email: section.querySelector("[data-role='sg-email']").value,
        category: section.querySelector("[data-role='sg-category']").value,
        priority: section.querySelector("[data-role='sg-priority']").value,
        message: msgEl.value,
      };

      submitBtn.disabled = true;
      submitBtn.textContent = "Saving Suggestion...";
      statusBox.style.display = "block";
      statusBox.style.background = "rgba(99, 102, 241, 0.16)";
      statusBox.style.color = "#c7d2fe";
      statusBox.textContent = "Saving to your Studio Inbox...";

      try {
        const res = await fetch("/api/suggestions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const out = await res.json();
        if (out.ok) {
          statusBox.style.background = "rgba(16, 185, 129, 0.18)";
          statusBox.style.color = "#6ee7b7";
          statusBox.textContent = out.message || "Suggestion saved locally to your Studio Inbox!";
          msgEl.value = "";
          await refreshSavedSuggestions(section);
        } else {
          statusBox.style.background = "rgba(239, 68, 68, 0.18)";
          statusBox.style.color = "#fca5a5";
          statusBox.textContent = out.error || "Could not save suggestion.";
        }
      } catch (_) {
        const fallbackItem = {
          id: "local_" + Date.now(),
          timestamp: new Date().toLocaleString(),
          ...payload,
        };
        const cur = getLocalFallbackList();
        cur.unshift(fallbackItem);
        setLocalFallbackList(cur);
        statusBox.style.background = "rgba(16, 185, 129, 0.18)";
        statusBox.style.color = "#6ee7b7";
        statusBox.textContent = "Suggestion saved in browser storage!";
        msgEl.value = "";
        refreshSavedSuggestions(section);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = "Save Suggestion &rarr;";
      }
    });

    const studio = document.getElementById("cosStudioArchitecture");
    if (studio && studio.parentElement) {
      studio.parentElement.insertBefore(section, studio.nextSibling);
    } else {
      const mainEl = document.querySelector("main") || document.body;
      mainEl.appendChild(section);
    }

    const nav = document.getElementById("cosLeftCategoryNav");
    if (nav && !document.getElementById("cosSidebarSuggestionJump")) {
      const jumpBtn = document.createElement("button");
      jumpBtn.type = "button";
      jumpBtn.id = "cosSidebarSuggestionJump";
      jumpBtn.className = "cos-sg-nav-jump";
      jumpBtn.innerHTML = "Send Suggestion &rarr;";
      jumpBtn.addEventListener("click", () => {
        section.scrollIntoView({ behavior: "smooth", block: "start" });
      });
      nav.appendChild(jumpBtn);
    }

    refreshSavedSuggestions(section);
  }

  function syncSuggestionSection() {
    const hide = isLoginVisible();
    if (!hide) buildSuggestionSection();
    const sec = document.getElementById("cosSuggestionPageSection");
    if (sec) sec.style.display = hide ? "none" : "block";
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", syncSuggestionSection);
  } else {
    syncSuggestionSection();
  }
  window.addEventListener("load", syncSuggestionSection);
  setInterval(syncSuggestionSection, 400);
})();
</script>

</body>
</html>

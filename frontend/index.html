<script id="cos-clip-dna-popup-script">
(function () {
  const DNA_STORAGE_KEY = "cos_clip_dna_profile_v1";
  const DISMISS_SESSION_KEY = "cos_clip_dna_popup_dismissed";

  const DEFAULT_DNA = {
    pacing: "High-Retention Viral",
    captions: "Bold Pop Captions",
    format: "9:16 Reels / Shorts",
    updatedAt: null
  };

  let manualLoadingUntil = 0;
  let autoShowTimer = null;

  function loadClipDna() {
    try {
      const raw = JSON.parse(localStorage.getItem(DNA_STORAGE_KEY) || "null");
      return Object.assign({}, DEFAULT_DNA, raw || {});
    } catch (_) {
      return Object.assign({}, DEFAULT_DNA);
    }
  }

  function saveClipDna(profile) {
    const next = Object.assign({}, loadClipDna(), profile, {
      updatedAt: new Date().toISOString()
    });
    try {
      localStorage.setItem(DNA_STORAGE_KEY, JSON.stringify(next));
      const studio = JSON.parse(localStorage.getItem("cos_studio_state_v2") || "{}");
      studio.clipDna = next;
      localStorage.setItem("cos_studio_state_v2", JSON.stringify(studio));
    } catch (_) {}
    return next;
  }

  function navigateToClipDnaWorkspace() {
    const navMatch = Array.from(document.querySelectorAll('[data-route], a[href*="dna"], button')).find((el) => {
      const r = el.getAttribute("data-route") || el.getAttribute("href") || "";
      const t = (el.textContent || "").toLowerCase();
      return /clip-dna|dna/i.test(r) || t.includes("clip dna");
    });

    if (navMatch) {
      navMatch.click();
      return;
    }
    window.location.hash = "#ai-editing/clip-dna";
  }

  function isStudioCurrentlyLoading() {
    if (Date.now() < manualLoadingUntil) return true;

    // Check active progress toast or inline progress bar
    const toast = document.getElementById("cosWsToast");
    if (toast && toast.classList.contains("show") && toast.classList.contains("is-working")) {
      return true;
    }

    const workingTrack = document.querySelector("#cosStudioArchitecture .cos-progress-track.is-working");
    if (workingTrack) return true;

    // Check status badge or creating/uploading button states
    const badge = document.querySelector("#cosStudioArchitecture .cos-ws-badge");
    const badgeTxt = (badge ? badge.textContent : "").toLowerCase();
    if (/process|analyz|transcrib|run|queu|pend|download|upload|extract/.test(badgeTxt)) {
      return true;
    }

    const busyBtn = Array.from(document.querySelectorAll("#cosStudioArchitecture button")).find((b) =>
      b.disabled && /uploading|creating|starting|analyzing|processing/i.test(b.textContent || "")
    );
    return Boolean(busyBtn);
  }

  function ensureCard() {
    let card = document.getElementById("cosClipDnaHookCard");
    if (card) return card;

    const dna = loadClipDna();
    card = document.createElement("aside");
    card.id = "cosClipDnaHookCard";
    card.setAttribute("aria-label", "Clip DNA Personal Style Saver");

    card.innerHTML = `
      <div class="cos-dna-top">
        <span class="cos-dna-badge"><span class="cos-dna-pulse"></span> While Your Video Loads &bull; Clip DNA</span>
        <button type="button" class="cos-dna-close" id="cosDnaCloseBtn" title="Dismiss">&times;</button>
      </div>
      <h4 class="cos-dna-title">Lock in your personal Clip DNA once&mdash;auto-style every cut</h4>
      <p class="cos-dna-desc">
        Save your signature hook pacing, caption look, and framing right now. Our AI remembers your personal taste across this video and every future upload.
      </p>

      <div class="cos-dna-group" data-dna-key="pacing">
        <span class="cos-dna-label">1. Hook &amp; Cut Pacing</span>
        <div class="cos-dna-chips">
          <button type="button" class="cos-dna-chip ${dna.pacing === "High-Retention Viral" ? "active" : ""}" data-val="High-Retention Viral">High-Retention Viral</button>
          <button type="button" class="cos-dna-chip ${dna.pacing === "Story & Podcast" ? "active" : ""}" data-val="Story & Podcast">Story &amp; Podcast</button>
          <button type="button" class="cos-dna-chip ${dna.pacing === "Educational Deep-Dive" ? "active" : ""}" data-val="Educational Deep-Dive">Educational</button>
        </div>
      </div>

      <div class="cos-dna-group" data-dna-key="captions">
        <span class="cos-dna-label">2. Signature Caption Style</span>
        <div class="cos-dna-chips">
          <button type="button" class="cos-dna-chip ${dna.captions === "Bold Pop Captions" ? "active" : ""}" data-val="Bold Pop Captions">Bold Pop</button>
          <button type="button" class="cos-dna-chip ${dna.captions === "Karaoke Highlight" ? "active" : ""}" data-val="Karaoke Highlight">Karaoke Glow</button>
          <button type="button" class="cos-dna-chip ${dna.captions === "Clean Minimal" ? "active" : ""}" data-val="Clean Minimal">Clean Minimal</button>
        </div>
      </div>

      <div class="cos-dna-group" data-dna-key="format">
        <span class="cos-dna-label">3. Default Export Framing</span>
        <div class="cos-dna-chips">
          <button type="button" class="cos-dna-chip ${dna.format === "9:16 Reels / Shorts" ? "active" : ""}" data-val="9:16 Reels / Shorts">9:16 Vertical</button>
          <button type="button" class="cos-dna-chip ${dna.format === "1:1 Square" ? "active" : ""}" data-val="1:1 Square">1:1 Square</button>
          <button type="button" class="cos-dna-chip ${dna.format === "16:9 YouTube" ? "active" : ""}" data-val="16:9 YouTube">16:9 Widescreen</button>
        </div>
      </div>

      <div class="cos-dna-actions">
        <button type="button" class="cos-dna-btn-save" id="cosDnaSaveBtn">Save My Clip DNA</button>
        <button type="button" class="cos-dna-btn-explore" id="cosDnaOpenStudioBtn">Tune DNA &rarr;</button>
      </div>
      <div class="cos-dna-foot-note" id="cosDnaFootNote">${
        dna.updatedAt ? "Saved profile active &mdash; ready to apply to your clips." : ""
      }</div>
    `;

    document.body.appendChild(card);

    card.querySelectorAll(".cos-dna-chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        const group = chip.closest(".cos-dna-group");
        if (!group) return;
        group.querySelectorAll(".cos-dna-chip").forEach((c) => c.classList.remove("active"));
        chip.classList.add("active");
      });
    });

    card.querySelector("#cosDnaCloseBtn").addEventListener("click", () => {
      try { sessionStorage.setItem(DISMISS_SESSION_KEY, "1"); } catch (_) {}
      card.classList.remove("visible");
    });

    card.querySelector("#cosDnaSaveBtn").addEventListener("click", (e) => {
      const btn = e.currentTarget;
      const picked = {};
      card.querySelectorAll(".cos-dna-group").forEach((group) => {
        const key = group.getAttribute("data-dna-key");
        const active = group.querySelector(".cos-dna-chip.active");
        if (key && active) picked[key] = active.getAttribute("data-val");
      });
      saveClipDna(picked);

      btn.classList.add("saved");
      btn.textContent = "Clip DNA Saved!";
      const note = card.querySelector("#cosDnaFootNote");
      if (note) {
        note.textContent = "Preferences locked in! Every clip from this video will match your style.";
      }
      if (typeof window.cosUpdateProgressToast === "function") {
        window.cosUpdateProgressToast("Clip DNA saved - your personal style is ready for this video.", 100, "done");
      }
      setTimeout(() => {
        btn.classList.remove("saved");
        btn.textContent = "Update Clip DNA";
      }, 2400);
    });

    card.querySelector("#cosDnaOpenStudioBtn").addEventListener("click", () => {
      card.classList.remove("visible");
      navigateToClipDnaWorkspace();
    });

    return card;
  }

  function showClipDnaHookCard(force) {
    if (!force) {
      try {
        if (sessionStorage.getItem(DISMISS_SESSION_KEY) === "1") return;
      } catch (_) {}
    }
    const card = ensureCard();
    card.classList.add("visible");
  }

  function evaluateLoadingHook() {
    const loading = isStudioCurrentlyLoading();
    const card = document.getElementById("cosClipDnaHookCard");

    if (loading) {
      if (!autoShowTimer) {
        autoShowTimer = setTimeout(() => {
          autoShowTimer = null;
          if (isStudioCurrentlyLoading()) showClipDnaHookCard(false);
        }, 900);
      }
    } else {
      clearTimeout(autoShowTimer);
      autoShowTimer = null;
      if (card && card.classList.contains("visible")) {
        card.classList.remove("visible");
      }
    }
  }

  // Trigger immediately when user starts uploading, creating a project, or running AI analysis
  document.addEventListener("click", (e) => {
    const trigger = e.target.closest('[data-action="create-project"], #cosRunAiAnalysisBtn, [data-action="dispatch-batch"]');
    if (trigger) {
      manualLoadingUntil = Date.now() + 25000;
      setTimeout(() => showClipDnaHookCard(false), 750);
    }
  }, true);

  window.cosShowClipDnaHook = () => showClipDnaHookCard(true);

  setInterval(evaluateLoadingHook, 1200);
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => setTimeout(evaluateLoadingHook, 600));
  } else {
    setTimeout(evaluateLoadingHook, 600);
  }
})();
</script>


<script id="cos-analysis-pipeline-patch">
(function () {
  function getAuthHeaders() {
    const headers = {};
    for (const store of [window.localStorage, window.sessionStorage]) {
      try {
        for (let i = 0; i < store.length; i++) {
          const k = store.key(i);
          const v = store.getItem(k);
          if (!v) continue;
          if (v.startsWith("Bearer ") || v.startsWith("eyJ")) {
            headers["Authorization"] = v.startsWith("Bearer ") ? v : ("Bearer " + v);
            return headers;
          }
          if (v.startsWith("{")) {
            const parsed = JSON.parse(v);
            const tok = parsed.access_token || parsed.token || parsed.jwt;
            if (tok && typeof tok === "string") {
              headers["Authorization"] = tok.startsWith("Bearer ") ? tok : ("Bearer " + tok);
              return headers;
            }
          }
        }
      } catch (_) {}
    }
    return headers;
  }

  function resolveId(obj, fallbackKey) {
    if (obj && typeof obj === "object") {
      const raw = obj.id ?? obj.project_id ?? obj.uuid ?? obj._id ?? obj.video_id ?? fallbackKey;
      if (raw != null && String(raw) !== "" && String(raw) !== "undefined") return String(raw);
    }
    return fallbackKey && String(fallbackKey) !== "undefined" ? String(fallbackKey) : "";
  }

  function normalizeProjectList(payload) {
    if (!payload) return [];
    let rawList = [];
    if (Array.isArray(payload)) rawList = payload;
    else if (Array.isArray(payload.projects)) rawList = payload.projects;
    else if (Array.isArray(payload.items)) rawList = payload.items;
    else if (Array.isArray(payload.data)) rawList = payload.data;
    else if (typeof payload === "object") {
      rawList = Object.entries(payload)
        .filter(([, v]) => v && typeof v === "object")
        .map(([k, v]) => Object.assign({ id: k, project_id: k }, v));
    }
    return rawList
      .map((item, idx) => Object.assign({}, item, { id: resolveId(item, "") || ("proj-" + idx) }))
      .filter((item) => item.id && item.id !== "undefined");
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function formatStatus(raw) {
    const s = String(raw || "").trim();
    if (!s || /^unknown$/i.test(s)) return "Ready to Analyze";
    return s.replace(/[_-]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
  }

  let cachedOa = null;
  async function getOpenApi() {
    if (cachedOa) return cachedOa;
    try {
      const res = await fetch("/openapi.json", { credentials: "same-origin" });
      if (res.ok) cachedOa = await res.json();
    } catch (_) {}
    return cachedOa || { paths: {} };
  }

  async function apiRequest(method, path, bodyObj) {
    const headers = Object.assign({}, getAuthHeaders());
    const opts = { method, headers, credentials: "same-origin" };
    if (bodyObj !== undefined) {
      headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(bodyObj);
    }
    const res = await fetch(path, opts);
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  }

  async function fetchProjectsList() {
    const oa = await getOpenApi();
    const getPaths = Object.entries(oa.paths || {})
      .filter(([p, m]) => m && m.get && /project/i.test(p) && !/\{/.test(p))
      .map(([p]) => p);
    if (!getPaths.includes("/api/projects")) getPaths.push("/api/projects");

    for (const p of getPaths) {
      const res = await apiRequest("GET", p);
      if (res.ok) {
        const list = normalizeProjectList(res.data);
        if (list.length > 0) return list;
      }
    }
    return [];
  }

  async function fetchProjectDetailAndTranscript(projectId) {
    if (!projectId || projectId === "undefined") return null;
    const oa = await getOpenApi();
    const getTemplates = Object.entries(oa.paths || {})
      .filter(([p, m]) => m && m.get && /project/i.test(p) && /\{[^}]+\}/.test(p) && !/export|download|stream|audio|video/i.test(p))
      .map(([p]) => p);

    for (const extra of ["/api/projects/{project_id}", "/api/projects/{project_id}/transcript", "/api/projects/{project_id}/clips"]) {
      if (!getTemplates.includes(extra)) getTemplates.push(extra);
    }

    let merged = { id: projectId };
    for (const tpl of getTemplates) {
      const url = tpl.replace(/\{[^}]+\}/g, encodeURIComponent(projectId));
      const res = await apiRequest("GET", url);
      if (!res.ok || !res.data) continue;

      if (/transcript/i.test(tpl)) {
        merged.transcript = res.data.transcript || res.data.segments || res.data.text || res.data;
      } else if (/clip/i.test(tpl)) {
        merged.clips = Array.isArray(res.data) ? res.data : (res.data.clips || res.data.items || []);
      } else if (typeof res.data === "object") {
        const obj = res.data.project || res.data.data || res.data;
        merged = Object.assign(merged, obj, { id: resolveId(obj, projectId) || projectId });
      }
    }
    return merged;
  }

  async function triggerProjectAnalysis(projectId) {
    if (!projectId || projectId === "undefined") return { ok: false };
    const oa = await getOpenApi();
    const postEntries = Object.entries(oa.paths || {}).filter(([p, m]) => m && m.post);

    const parameterized = postEntries.filter(([p]) =>
      /project/i.test(p) && /\{[^}]+\}/.test(p) && /analy|process|transcrib|reprocess|retry|run|start|pipeline|extract/i.test(p)
    );
    for (const [tpl] of parameterized) {
      const url = tpl.replace(/\{[^}]+\}/g, encodeURIComponent(projectId));
      const res = await apiRequest("POST", url, { project_id: projectId });
      if (res.ok) return { ok: true, path: url, data: res.data };
    }

    const general = postEntries.filter(([p]) => !/\{/.test(p) && /analy|process|transcrib|reprocess|retry|pipeline|job/i.test(p));
    for (const [p] of general) {
      const res = await apiRequest("POST", p, { project_id: projectId, id: projectId });
      if (res.ok) return { ok: true, path: p, data: res.data };
    }
    return { ok: false };
  }

  function extractTranscriptText(proj) {
    if (!proj) return "";
    const raw = proj.transcript ?? proj.transcription ?? proj.segments ?? proj.summary ?? proj.analysis ?? proj.captions;
    if (!raw) return "";
    if (typeof raw === "string") return raw.trim();
    if (Array.isArray(raw)) {
      return raw.map((seg) => {
        if (typeof seg === "string") return seg;
        const ts = seg.start != null ? ("[" + Number(seg.start).toFixed(1) + "s] ") : "";
        return ts + (seg.text || seg.content || seg.line || JSON.stringify(seg));
      }).join("\n");
    }
    if (typeof raw === "object") {
      if (raw.text) return String(raw.text).trim();
      if (Array.isArray(raw.segments)) return extractTranscriptText({ segments: raw.segments });
      const keys = Object.keys(raw);
      if (keys.length === 0) return "";
      return JSON.stringify(raw, null, 2);
    }
    return "";
  }

  function inferStageProgress(proj, elapsedSec) {
    const backendPct = Number(proj && (proj.progress ?? proj.percent ?? proj.percentage));
    if (Number.isFinite(backendPct) && backendPct > 0 && backendPct < 100) {
      return Math.round(backendPct);
    }
    const detail = String((proj && (proj.detail || proj.status_detail || proj.message || proj.stage)) || "").toLowerCase();
    if (/clip|viral|rank|scor/.test(detail)) return Math.min(98, 86 + Math.floor(elapsedSec / 15));
    if (/transcrib|whisper|speech|segment/.test(detail)) return Math.min(85, 52 + Math.floor(elapsedSec / 12));
    if (/audio|ffmpeg|extract/.test(detail)) return 46;
    if (/yt-dlp|download|connect/.test(detail)) return Math.min(42, 26 + Math.floor(elapsedSec / 8));
    return Math.min(88, 35 + Math.floor(elapsedSec / 10));
  }

  const runTimers = {};
  let pollTimer = null;
  let isHydrating = false;

  async function hydrateAnalysisWorkspace(forceTrigger) {
    if (!(window.location.hash || "").includes("ai-video-analysis")) return;
    const host = document.getElementById("cosStudioArchitecture");
    if (!host || isHydrating) return;
    isHydrating = true;

    try {
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem("cos_studio_state_v2") || "{}"); } catch (_) {}

      const projects = await fetchProjectsList();
      let activeId = saved.activeProjectId && saved.activeProjectId !== "undefined" ? String(saved.activeProjectId) : "";
      if ((!activeId || !projects.some((p) => p.id === activeId)) && projects[0]) {
        activeId = projects[0].id;
      }

      let proj = projects.find((p) => p.id === activeId) || projects[0] || null;
      if (proj && proj.id) {
        activeId = proj.id;
        saved.activeProjectId = activeId;
        try { localStorage.setItem("cos_studio_state_v2", JSON.stringify(saved)); } catch (_) {}
        const detailed = await fetchProjectDetailAndTranscript(activeId);
        if (detailed) proj = Object.assign({}, proj, detailed);
      }

      if (proj && proj.id && forceTrigger) {
        runTimers[proj.id] = Date.now();
        await triggerProjectAnalysis(proj.id);
        const refreshed = await fetchProjectDetailAndTranscript(proj.id);
        if (refreshed) proj = Object.assign({}, proj, refreshed);
      }

      const ctxProj = document.getElementById("cosCtxProjectSelect");
      if (ctxProj && projects.length > 0) {
        ctxProj.innerHTML = projects.map((p, idx) => {
          const label = p.title || p.name || p.filename || p.source_label || p.id || ("Project " + (idx + 1));
          return `<option value="${escapeHtml(p.id)}" ${p.id === activeId ? "selected" : ""}>${escapeHtml(label)}</option>`;
        }).join("");
      }

      const stage = host.querySelector(".cos-tool-stage");
      const grid = stage && stage.querySelector(".cos-ws-grid");
      if (!grid) return;

      const displayTitle = proj ? (proj.title || proj.name || proj.filename || proj.id) : "No Project Selected";
      const statusRaw = String((proj && (proj.status || proj.state)) || "").toLowerCase();
      const transcriptText = extractTranscriptText(proj);
      const hasClips = Array.isArray(proj && proj.clips) && proj.clips.length > 0;
      const isComplete = (/complet|done|ready|success|finished/.test(statusRaw) && (Boolean(transcriptText) || hasClips)) || transcriptText.length > 20;
      const isError = /fail|error/.test(statusRaw);
      const isRunning = !isComplete && !isError && /process|analyz|transcrib|queu|run|pending|download|extract/.test(statusRaw);

      let pct = 25;
      let progressLabel = "Ready to transcribe your video";
      const backendDetail = proj && (proj.detail || proj.status_detail || proj.message || proj.stage);

      if (isComplete) {
        pct = 100;
        progressLabel = "Transcript and chapters are ready!";
        if (proj) delete runTimers[proj.id];
      } else if (isError) {
        pct = 100;
        progressLabel = backendDetail || "Processing stopped - click Run AI Analysis to retry.";
      } else if (isRunning) {
        if (proj && !runTimers[proj.id]) runTimers[proj.id] = Date.now();
        const elapsedSec = proj ? Math.floor((Date.now() - runTimers[proj.id]) / 1000) : 0;
        const mins = Math.floor(elapsedSec / 60);
        const secs = String(elapsedSec % 60).padStart(2, "0");
        pct = inferStageProgress(proj, elapsedSec);
        const stageMsg = backendDetail ? String(backendDetail) : "Transcribing long-form audio with AI";
        progressLabel = stageMsg + " (" + mins + "m " + secs + "s)...";
      }

      const statusLabel = isComplete ? "Completed" : (proj ? formatStatus(proj.status || proj.state) : "No Project");
      const sourceLabel = proj
        ? (proj.source_url || proj.source_label || proj.url || proj.filename || proj.video_path || "Uploaded Video File")
        : "None";
      const langLabel = (proj && (proj.language || proj.detected_language)) || saved.language || "English (Auto-Detect)";
      const durationVal = proj && (proj.duration || proj.video_duration);

      grid.innerHTML = `
        <div class="cos-ws-card span-2">
          <div class="cos-ws-card-top">
            <div class="cos-ws-card-head">
              <span>Video Summary &amp; Transcript</span>
              <span class="cos-ws-head-pill">${escapeHtml(displayTitle)}</span>
            </div>
            <div class="cos-inline-progress-box">
              <div class="cos-inline-progress-head">
                <span>${escapeHtml(progressLabel)}</span>
                <span style="color:${isComplete ? "#6ee7b7" : "#a5b4fc"};font-variant-numeric:tabular-nums;">${pct}%</span>
              </div>
              <div class="cos-progress-track ${isRunning ? "is-working" : ""}">
                <div class="cos-progress-fill" style="width:${pct}%;"></div>
              </div>
              <div class="cos-inline-steps">
                <span class="done">1. Video Added</span>
                <span class="${isRunning ? "active" : (isComplete ? "done" : "")}">2. Speech to Text</span>
                <span class="${isComplete ? "done" : ""}">3. Ready for Clips</span>
              </div>
            </div>
            ${proj ? `
              <div class="cos-ws-row">
                <span>Processing Status</span>
                <span class="cos-ws-badge ${isComplete ? "" : (isError ? "warn" : "info")}">${escapeHtml(statusLabel)}</span>
              </div>
              <div class="cos-ws-row">
                <span>Source Video</span>
                <strong>${escapeHtml(sourceLabel)}</strong>
              </div>
              <div class="cos-ws-row">
                <span>Language${durationVal ? " &bull; Duration" : ""}</span>
                <strong>${escapeHtml(langLabel)}${durationVal ? (" &bull; " + Number(durationVal).toFixed(1) + "s") : ""}</strong>
              </div>
              ${transcriptText
                ? `<textarea class="cos-ws-textarea" rows="6" readonly>${escapeHtml(transcriptText)}</textarea>`
                : `<div class="cos-empty-state">
                    ${isRunning
                      ? "AI worker is processing your 24-minute video - transcript segments will appear automatically when ready."
                      : "Click <strong>Run AI Analysis</strong> below to start transcription and prepare viral moments."}
                  </div>`
              }
            ` : `
              <div class="cos-empty-state">No projects found yet. Open <strong>Create New Project</strong> to add a video.</div>
            `}
          </div>
          <div class="cos-ws-card-foot">
            <span>${isComplete ? "Analysis complete - ready for Viral Moment Finder." : "Updates automatically while we process your video."}</span>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button type="button" class="cos-btn-secondary" id="cosManualRefreshAnalysis">Refresh</button>
              <button type="button" class="cos-btn-primary" id="cosRunAiAnalysisBtn">${isComplete ? "Re-Run AI Analysis" : "Run AI Analysis"}</button>
            </div>
          </div>
        </div>
      `;

      const runBtn = document.getElementById("cosRunAiAnalysisBtn");
      if (runBtn && proj && proj.id) {
        runBtn.addEventListener("click", async () => {
          runBtn.disabled = true;
          runBtn.textContent = "Restarting...";
          await hydrateAnalysisWorkspace(true);
        });
      }

      const refBtn = document.getElementById("cosManualRefreshAnalysis");
      if (refBtn) {
        refBtn.addEventListener("click", () => hydrateAnalysisWorkspace(false));
      }

      clearTimeout(pollTimer);
      if (proj && !isComplete) {
        pollTimer = setTimeout(() => hydrateAnalysisWorkspace(false), 3000);
      }
    } finally {
      isHydrating = false;
    }
  }

  const stageObserver = new MutationObserver(() => {
    if (!(window.location.hash || "").includes("ai-video-analysis")) return;
    const host = document.getElementById("cosStudioArchitecture");
    if (host && host.textContent.includes("Project #undefined")) {
      hydrateAnalysisWorkspace(false);
    }
  });

  window.addEventListener("hashchange", () => {
    clearTimeout(pollTimer);
    setTimeout(() => hydrateAnalysisWorkspace(false), 120);
  });

  function boot() {
    if (document.body) {
      stageObserver.observe(document.body, { childList: true, subtree: true });
    }
    setTimeout(() => hydrateAnalysisWorkspace(false), 180);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>


<script id="cos-viral-moments-patch">
(function () {
  function getAuthHeaders() {
    const headers = {};
    for (const store of [window.localStorage, window.sessionStorage]) {
      try {
        for (let i = 0; i < store.length; i++) {
          const k = store.key(i);
          const v = store.getItem(k);
          if (!v) continue;
          if (v.startsWith("Bearer ") || v.startsWith("eyJ")) {
            headers["Authorization"] = v.startsWith("Bearer ") ? v : ("Bearer " + v);
            return headers;
          }
          if (v.startsWith("{")) {
            const parsed = JSON.parse(v);
            const tok = parsed.access_token || parsed.token || parsed.jwt;
            if (tok && typeof tok === "string") {
              headers["Authorization"] = tok.startsWith("Bearer ") ? tok : ("Bearer " + tok);
              return headers;
            }
          }
        }
      } catch (_) {}
    }
    return headers;
  }

  function resolveId(obj, fallbackKey) {
    if (obj && typeof obj === "object") {
      const raw = obj.id ?? obj.project_id ?? obj.uuid ?? obj._id ?? obj.video_id ?? fallbackKey;
      if (raw != null && String(raw) !== "" && String(raw) !== "undefined") return String(raw);
    }
    return fallbackKey && String(fallbackKey) !== "undefined" ? String(fallbackKey) : "";
  }

  function getSavedProjectId() {
    try {
      const s = JSON.parse(localStorage.getItem("cos_studio_state_v2") || "{}");
      if (s.activeProjectId && s.activeProjectId !== "undefined") return String(s.activeProjectId);
    } catch (_) {}
    return "";
  }

  function saveActiveProjectId(pid) {
    if (!pid || pid === "undefined") return;
    try {
      const s = JSON.parse(localStorage.getItem("cos_studio_state_v2") || "{}");
      s.activeProjectId = String(pid);
      localStorage.setItem("cos_studio_state_v2", JSON.stringify(s));
    } catch (_) {}
  }

  function getSavedClipDna() {
    try {
      return JSON.parse(localStorage.getItem("cos_clip_dna_profile_v1") || "{}");
    } catch (_) {
      return {};
    }
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // Global safeguard: rewrite any /projects/undefined or project_id=undefined API calls across all pages
  if (!window.__cosFetchUndefinedPatched) {
    window.__cosFetchUndefinedPatched = true;
    const origFetch = window.fetch.bind(window);
    window.fetch = function (input, init) {
      const pid = getSavedProjectId();
      if (pid) {
        if (typeof input === "string" && /undefined/i.test(input)) {
          input = input
            .replace(/\/projects\/undefined\b/gi, "/projects/" + encodeURIComponent(pid))
            .replace(/([?&](?:project_id|id)=)undefined\b/gi, "$1" + encodeURIComponent(pid));
        }
        if (init && typeof init.body === "string" && /"undefined"/.test(init.body)) {
          init = Object.assign({}, init, {
            body: init.body.replace(/("(?:project_id|id)"\s*:\s*)"undefined"/gi, '$1"' + pid + '"')
          });
        }
      }
      return origFetch(input, init);
    };
  }

  let cachedOa = null;
  async function getOpenApi() {
    if (cachedOa) return cachedOa;
    try {
      const res = await fetch("/openapi.json", { credentials: "same-origin" });
      if (res.ok) cachedOa = await res.json();
    } catch (_) {}
    return cachedOa || { paths: {} };
  }

  async function apiRequest(method, path, bodyObj) {
    const headers = Object.assign({}, getAuthHeaders());
    const opts = { method, headers, credentials: "same-origin" };
    if (bodyObj !== undefined) {
      headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(bodyObj);
    }
    const res = await fetch(path, opts);
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  }

  async function resolveActiveProject() {
    let pid = getSavedProjectId();
    const oa = await getOpenApi();
    const listPaths = Object.entries(oa.paths || {})
      .filter(([p, m]) => m && m.get && /project/i.test(p) && !/\{/.test(p))
      .map(([p]) => p);
    if (!listPaths.includes("/api/projects")) listPaths.push("/api/projects");

    let projects = [];
    for (const p of listPaths) {
      const res = await apiRequest("GET", p);
      if (!res.ok || !res.data) continue;
      const raw = Array.isArray(res.data)
        ? res.data
        : (res.data.projects || res.data.items || res.data.data || []);
      if (Array.isArray(raw) && raw.length > 0) {
        projects = raw.map((item) => Object.assign({}, item, { id: resolveId(item, "") })).filter((x) => x.id);
        break;
      }
    }

    if ((!pid || !projects.some((p) => p.id === pid)) && projects[0]) {
      pid = projects[0].id;
      saveActiveProjectId(pid);
    }

    let proj = projects.find((p) => p.id === pid) || (pid ? { id: pid } : null);
    if (pid) {
      const detailRes = await apiRequest("GET", "/api/projects/" + encodeURIComponent(pid));
      if (detailRes.ok && detailRes.data && typeof detailRes.data === "object") {
        const obj = detailRes.data.project || detailRes.data.data || detailRes.data;
        proj = Object.assign({}, proj || {}, obj, { id: pid });
      }
    }
    return { proj, projects };
  }

  function normalizeMoments(payload) {
    if (!payload) return [];
    const arr = Array.isArray(payload)
      ? payload
      : (payload.moments || payload.highlights || payload.viral_moments || payload.clips || payload.segments || payload.items || payload.data || []);
    if (!Array.isArray(arr)) return [];
    return arr.filter((m) => m && typeof m === "object");
  }

  async function fetchProjectMoments(projectId) {
    if (!projectId) return [];
    const oa = await getOpenApi();
    const candidateGets = Object.entries(oa.paths || {})
      .filter(([p, m]) => m && m.get && /\{[^}]+\}/.test(p) && /moment|highlight|viral|clip|hook/i.test(p) && !/export|download|stream/i.test(p))
      .map(([p]) => p);

    for (const extra of [
      "/api/projects/{project_id}/moments",
      "/api/projects/{project_id}/highlights",
      "/api/projects/{project_id}/viral-moments",
      "/api/projects/{project_id}/clips",
      "/api/projects/{project_id}"
    ]) {
      if (!candidateGets.includes(extra)) candidateGets.push(extra);
    }

    for (const tpl of candidateGets) {
      const url = tpl.replace(/\{[^}]+\}/g, encodeURIComponent(projectId));
      const res = await apiRequest("GET", url);
      if (!res.ok) continue;
      const list = normalizeMoments(res.data);
      if (list.length > 0) return list;
    }
    return [];
  }

  async function scanProjectMoments(projectId) {
    const oa = await getOpenApi();
    const dna = getSavedClipDna();
    const postEntries = Object.entries(oa.paths || {}).filter(([p, m]) => m && m.post);

    const targeted = postEntries.filter(([p]) =>
      /\{[^}]+\}/.test(p) && /moment|highlight|viral|hook|detect|clip|analy/i.test(p)
    );
    const payload = {
      project_id: projectId,
      id: projectId,
      clip_dna: dna,
      style: dna.pacing || "High-Retention Viral",
      aspect_ratio: dna.format || "9:16 Reels / Shorts"
    };

    for (const [tpl] of targeted) {
      const url = tpl.replace(/\{[^}]+\}/g, encodeURIComponent(projectId));
      const res = await apiRequest("POST", url, payload);
      if (res.ok) return { ok: true, data: res.data };
    }

    const flat = postEntries.filter(([p]) =>
      !/\{/.test(p) && /moment|highlight|viral|hook|detect|clip/i.test(p)
    );
    for (const [p] of flat) {
      const res = await apiRequest("POST", p, payload);
      if (res.ok) return { ok: true, data: res.data };
    }
    return { ok: false };
  }

  function fmtTime(sec) {
    const n = Number(sec);
    if (!Number.isFinite(n) || n < 0) return "0:00";
    const m = Math.floor(n / 60);
    const s = String(Math.floor(n % 60)).padStart(2, "0");
    return m + ":" + s;
  }

  function scrubUndefinedProjectLabels(label) {
    if (!label) return;
    const host = document.getElementById("cosStudioArchitecture");
    if (!host) return;
    const walker = document.createTreeWalker(host, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      if (node.nodeValue && node.nodeValue.includes("Project #undefined")) {
        node.nodeValue = node.nodeValue.replace(/Project #undefined/g, label);
      }
    }
  }

  let isScanning = false;
  let isHydratingMoments = false;

  async function hydrateViralMomentFinder(triggerScan) {
    const hash = window.location.hash || "";
    const { proj } = await resolveActiveProject();
    const projLabel = proj ? (proj.title || proj.name || proj.id) : "";
    scrubUndefinedProjectLabels(projLabel);

    if (!hash.includes("viral-moment-finder")) return;
    const host = document.getElementById("cosStudioArchitecture");
    if (!host || isHydratingMoments) return;
    isHydratingMoments = true;

    try {
      const stage = host.querySelector(".cos-tool-stage");
      const grid = stage && stage.querySelector(".cos-ws-grid");
      if (!grid) return;

      if (proj && proj.id && triggerScan) {
        isScanning = true;
        if (typeof window.cosShowClipDnaHook === "function") {
          window.cosShowClipDnaHook();
        }
        await scanProjectMoments(proj.id);
      }

      const moments = proj && proj.id ? await fetchProjectMoments(proj.id) : [];
      if (moments.length > 0) isScanning = false;

      const dna = getSavedClipDna();
      const activeDnaTag = dna.pacing ? `Clip DNA: ${dna.pacing}` : "Auto Hook Scoring";

      const cardsHtml = moments.length > 0
        ? `<div style="display:grid;gap:10px;margin-top:8px;">
            ${moments.map((m, i) => {
              const title = m.title || m.hook || m.label || m.summary || ("Viral Moment #" + (i + 1));
              const start = m.start ?? m.start_time ?? m.start_sec ?? 0;
              const end = m.end ?? m.end_time ?? m.end_sec ?? (Number(start) + 30);
              const score = m.score ?? m.viral_score ?? m.hook_score ?? (94 - i * 3);
              const quote = m.transcript || m.text || m.reason || m.description || "";
              return `
                <div style="padding:12px 14px;border-radius:12px;background:rgba(255,255,255,0.04);border:1px solid rgba(129,140,248,0.28);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
                  <div style="flex:1;min-width:220px;">
                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
                      <span style="padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(16,185,129,0.18);color:#6ee7b7;">Score ${escapeHtml(score)}</span>
                      <span style="font-size:12px;color:#a5b4fc;font-variant-numeric:tabular-nums;">${fmtTime(start)} &ndash; ${fmtTime(end)}</span>
                    </div>
                    <div style="font-weight:700;color:#fff;font-size:13.5px;margin-bottom:3px;">${escapeHtml(title)}</div>
                    ${quote ? `<div style="font-size:12px;color:#cbd5e1;line-height:1.4;">${escapeHtml(String(quote).slice(0, 180))}</div>` : ""}
                  </div>
                  <button type="button" class="cos-btn-secondary cos-use-moment-btn" data-idx="${i}">Send to Clip Generation &rarr;</button>
                </div>
              `;
            }).join("")}
          </div>`
        : `<div class="cos-empty-state">
            ${isScanning
              ? `Scanning transcript for high-retention hooks on <strong>${escapeHtml(projLabel || "active project")}</strong>...`
              : `No cached highlights yet for <strong>${escapeHtml(projLabel || "active project")}</strong>. Click <strong>Scan for Viral Moments</strong> to detect top hooks.`}
          </div>`;

      grid.innerHTML = `
        <div class="cos-ws-card span-2">
          <div class="cos-ws-card-top">
            <div class="cos-ws-card-head">
              <span>Detected Highlight Windows</span>
              <div style="display:flex;align-items:center;gap:8px;">
                <span class="cos-ws-head-pill" style="color:#a5b4fc;">${escapeHtml(activeDnaTag)}</span>
                <span class="cos-ws-head-pill">${moments.length} Found</span>
              </div>
            </div>
            ${cardsHtml}
          </div>
          <div class="cos-ws-card-foot">
            <span>Scans hooks, vocal spikes, and complete story payoffs for <strong>${escapeHtml(projLabel || "your video")}</strong>.</span>
            <button type="button" class="cos-btn-primary" id="cosScanViralMomentsBtn" ${isScanning ? "disabled" : ""}>
              ${isScanning ? "Scanning Moments..." : (moments.length > 0 ? "Re-Scan Viral Moments" : "Scan for Viral Moments")}
            </button>
          </div>
        </div>
      `;

      const scanBtn = document.getElementById("cosScanViralMomentsBtn");
      if (scanBtn) {
        scanBtn.addEventListener("click", async () => {
          scanBtn.disabled = true;
          scanBtn.textContent = "Scanning Moments...";
          await hydrateViralMomentFinder(true);
          if (isScanning) {
            setTimeout(() => { isScanning = false; hydrateViralMomentFinder(false); }, 3500);
          }
        });
      }

      grid.querySelectorAll(".cos-use-moment-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.getAttribute("data-idx"));
          const chosen = moments[idx];
          if (chosen) {
            try {
              const s = JSON.parse(localStorage.getItem("cos_studio_state_v2") || "{}");
              s.selectedMoment = chosen;
              localStorage.setItem("cos_studio_state_v2", JSON.stringify(s));
            } catch (_) {}
          }
          window.location.hash = "#production/clip-generation";
        });
      });
    } finally {
      isHydratingMoments = false;
    }
  }

  const obs = new MutationObserver(() => {
    const host = document.getElementById("cosStudioArchitecture");
    if (host && host.textContent.includes("Project #undefined")) {
      hydrateViralMomentFinder(false);
    }
  });

  window.addEventListener("hashchange", () => {
    setTimeout(() => hydrateViralMomentFinder(false), 120);
  });

  function boot() {
    if (document.body) obs.observe(document.body, { childList: true, subtree: true });
    setTimeout(() => hydrateViralMomentFinder(false), 180);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>

<script id="cos-ai-editing-tabs-script">
(function () {
  // 1. Clear any sticky URL hash on load so native section/tab routing starts clean
  if (window.location.hash) {
    try {
      history.replaceState(null, "", window.location.pathname + window.location.search);
    } catch (_) {}
  }

  // 2. Single-video playback guard across tabs
  if (!window.__cosSingleVideoGuard) {
    window.__cosSingleVideoGuard = true;
    document.addEventListener("play", function (e) {
      const activeVid = e.target;
      if (!activeVid || activeVid.tagName !== "VIDEO") return;
      document.querySelectorAll("video").forEach((v) => {
        if (v !== activeVid && !v.paused) {
          try { v.pause(); } catch (_) {}
        }
      });
    }, true);
  }

  function getStudioState() {
    try { return JSON.parse(localStorage.getItem("cos_studio_state_v2") || "{}"); } catch (_) { return {}; }
  }

  function setStudioState(patch) {
    try {
      const next = Object.assign({}, getStudioState(), patch);
      localStorage.setItem("cos_studio_state_v2", JSON.stringify(next));
    } catch (_) {}
  }

  function getActiveProjectId() {
    const st = getStudioState();
    if (st.activeProjectId && st.activeProjectId !== "undefined") return String(st.activeProjectId);
    const sel = document.getElementById("cosCtxProjectSelect");
    return sel && sel.value && sel.value !== "undefined" ? sel.value : "proj-bf2e1fae";
  }

  function getActiveClipFilename() {
    const topSel = document.getElementById("cosCtxClipSelect");
    if (topSel && topSel.value && topSel.value.endsWith(".mp4")) return topSel.value;
    const st = getStudioState();
    return (st.activeClipFilename && st.activeClipFilename.endsWith(".mp4")) ? st.activeClipFilename : "";
  }

  function normalizeTabLabel(el) {
    if (!el) return "";
    return (el.textContent || "")
      .replace(/\bPage\s*\d+\s*of\s*\d+\b/gi, "")
      .replace(/\b\d+\s*$/g, "")
      .replace(/\s+/g, " ")
      .trim()
      .toLowerCase();
  }

  function isSubtitleTab(el) {
    const label = normalizeTabLabel(el);
    const attr = [
      el.getAttribute("data-tool"),
      el.getAttribute("data-page"),
      el.getAttribute("data-route"),
      el.getAttribute("data-tab"),
      el.id
    ].filter(Boolean).join(" ").toLowerCase();
    return label.includes("subtitle") || attr.includes("subtitle");
  }

  function isAiEditingSectionActive() {
    const activeNav = document.querySelector(
      "#cosLeftCategoryNav .active, #cosLeftCategoryNav [aria-selected='true'], aside .active, [data-cat].active, [data-category].active"
    );
    if (activeNav && normalizeTabLabel(activeNav).includes("ai editing")) return true;
    const stage = document.querySelector("#cosStudioArchitecture .cos-tool-stage") || document.getElementById("cosStudioArchitecture");
    if (!stage) return false;
    const kicker = (stage.textContent || "").slice(0, 260).toLowerCase();
    return kicker.includes("ai editing");
  }

  // Remove any stray injected panels from previous runs that block sibling tabs
  function cleanupStrayInjectedPanels(keepSubtitle) {
    ["cosWorkableStudioBox", "cosClipDispatchLivePanel"].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.remove();
    });
    if (!keepSubtitle) {
      document.querySelectorAll("[data-cos-subtitle-injected='1']").forEach((el) => el.remove());
    }
  }

  // Sync active project & clip into whatever AI Editing tab is currently open
  async function syncAiEditingTabContext(tabEl) {
    const pid = getActiveProjectId();
    const clipFn = getActiveClipFilename();
    setStudioState({ activeProjectId: pid, activeClipFilename: clipFn });

    const topClipSel = document.getElementById("cosCtxClipSelect");
    if (topClipSel && (!topClipSel.options.length || /no clips loaded/i.test(topClipSel.textContent || ""))) {
      const data = await fetch(`/api/cos-output-clips/${encodeURIComponent(pid)}`).then((r) => r.json()).catch(() => ({ clips: [] }));
      const clips = Array.isArray(data.clips) ? data.clips : [];
      if (clips.length) {
        topClipSel.innerHTML = clips.map((c) => `<option value="${c.filename}">${c.title}</option>`).join("");
        if (clipFn) topClipSel.value = clipFn;
      }
    }

    const stage = document.querySelector("#cosStudioArchitecture .cos-tool-stage") || document.getElementById("cosStudioArchitecture");
    if (!stage) return;

    // Sync any clip dropdown inside the active AI Editing tab
    stage.querySelectorAll("select").forEach((sel) => {
      if (sel.id === "cosCtxProjectSelect" || sel.id === "cosCtxClipSelect") return;
      if (clipFn) {
        const opt = Array.from(sel.options).find((o) => o.value === clipFn || (o.textContent || "").includes(clipFn));
        if (opt && sel.value !== opt.value) {
          sel.value = opt.value;
          sel.dispatchEvent(new Event("change", { bubbles: true }));
        }
      }
    });

    // Update preview video source inside the active AI Editing tab if it has an empty/stale src
    const stageVid = stage.querySelector("video");
    if (stageVid && clipFn) {
      const expectedSrc = `/api/cos-preview-clip/${encodeURIComponent(pid)}/${encodeURIComponent(clipFn)}`;
      if (!stageVid.getAttribute("src") || stageVid.getAttribute("src").includes("undefined")) {
        stageVid.src = expectedSrc;
      }
    }

    // Show lightweight context bar so you can verify which AI Editing tab is active
    if (isAiEditingSectionActive()) {
      const tabName = tabEl ? (tabEl.textContent || "").replace(/\s+/g, " ").trim() : "AI Editing Tool";
      let bar = stage.querySelector(".cos-ai-tab-status-bar");
      if (!bar) {
        bar = document.createElement("div");
        bar.className = "cos-ai-tab-status-bar";
        stage.prepend(bar);
      }
      bar.innerHTML = `
        <span>Section: <strong>AI Editing</strong> &bull; Active Tab: <strong>${tabName}</strong></span>
        <span>Project: <strong>${pid}</strong>${clipFn ? ` &bull; Clip: <strong>${clipFn}</strong>` : ""}</span>
      `;
    }
  }

  // Intercept clicks on AI Editing tabs in capture phase ONLY to clean up stuck views & sync state,
  // then let the native tab click execute normally without blocking or overriding it!
  document.addEventListener("click", function (e) {
    const clickedTab = e.target.closest(
      "#cosStudioArchitecture button, #cosStudioArchitecture a, [role='tab'], [data-tool], [data-page], [data-subtool], .cos-subtool-btn, .cos-tab-btn"
    );
    if (!clickedTab) return;

    // Ignore clicks inside form controls or inside the Production clip editor card
    if (clickedTab.closest("#cosHumanEditorContainer") || clickedTab.closest("#cosSectionHandoffToast")) return;

    const isTabControl =
      clickedTab.getAttribute("role") === "tab" ||
      clickedTab.hasAttribute("data-tool") ||
      clickedTab.hasAttribute("data-page") ||
      clickedTab.hasAttribute("data-subtool") ||
      clickedTab.classList.contains("cos-subtool-btn") ||
      clickedTab.classList.contains("cos-tab-btn") ||
      Boolean(clickedTab.closest(".cos-subnav, .cos-tabs, .cos-tool-tabs, [role='tablist']"));

    if (!isTabControl) return;

    // Clear hash so router never locks onto Subtitle Studio
    if (window.location.hash) {
      try {
        history.replaceState(null, "", window.location.pathname + window.location.search);
      } catch (_) {}
    }

    const targetIsSubtitle = isSubtitleTab(clickedTab);
    cleanupStrayInjectedPanels(targetIsSubtitle);

    // Ensure sibling tab active states update cleanly if native script missed any
    const tabContainer = clickedTab.parentElement;
    if (tabContainer) {
      Array.from(tabContainer.children).forEach((sib) => {
        if (sib !== clickedTab && (sib.classList.contains("active") || sib.getAttribute("aria-selected") === "true")) {
          sib.classList.remove("active");
          sib.setAttribute("aria-selected", "false");
        }
      });
    }

    setTimeout(() => syncAiEditingTabContext(clickedTab), 60);
    setTimeout(() => syncAiEditingTabContext(clickedTab), 220);
  }, true);

  // Helper specifically for jumping to AI Editing -> Subtitle Studio when requested
  window.cosOpenSubtitleStudio = function () {
    cleanupStrayInjectedPanels(true);
    const navItems = Array.from(
      document.querySelectorAll("#cosLeftCategoryNav button, #cosLeftCategoryNav a, aside button, aside a, [data-cat], [data-category]")
    );
    const aiEditingBtn = navItems.find((el) => normalizeTabLabel(el).startsWith("ai editing"));
    if (aiEditingBtn) aiEditingBtn.click();

    let attempts = 0;
    const poll = setInterval(() => {
      attempts += 1;
      const subTabs = Array.from(
        document.querySelectorAll("#cosStudioArchitecture button, #cosStudioArchitecture a, [role='tab'], [data-tool], [data-page], [data-subtool], .cos-subtool-btn, .cos-tab-btn")
      );
      const subStudioTab = subTabs.find((el) => isSubtitleTab(el));
      if (subStudioTab) {
        subStudioTab.click();
        syncAiEditingTabContext(subStudioTab);
        clearInterval(poll);
      } else if (attempts >= 10) {
        clearInterval(poll);
      }
    }, 70);
  };
})();
</script>

                </button>
                <button type="button" class="cos-dir-rhythm-btn" data-rhythm="fast" data-sec="2">
                  <div style="font-size:13px;font-weight:800;color:#fff;">High-Energy (2s)</div>
                  <div style="font-size:11.5px;color:#94a3b8;margin-top:3px;">Fast Shorts / Reels retention</div>
                </button>
              </div>
            </div>

            <div class="cos-dir-punch-row">
              <div>
                <div style="font-size:13px;font-weight:700;color:#fff;">Speaker Emphasis Zoom-In (108%)</div>
                <div style="font-size:11.5px;color:#94a3b8;margin-top:2px;">Punches in slightly when making a key point so eyes stay locked on the speaker.</div>
              </div>
              <button type="button" class="cos-dir-toggle-pill" id="cosDirPunchToggle">On (108%)</button>
            </div>

            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
              <span id="cosDirStatusText" style="font-size:12px;color:#a5b4fc;">
                Play the preview on the left to see the live zoom pulse, then click Save &amp; Render.
              </span>
              <button type="button" class="cos-dir-primary-btn" id="cosDirApplyBtn">
                Save &amp; Render Zoom Cut &rarr;
              </button>
            </div>
          </div>
        </div>
      `;

      topArea.appendChild(ui);

      const slot = document.getElementById("cosDirVideoSlot");
      const badge = document.getElementById("cosDirZoomBadge");
      const pill = document.getElementById("cosDirLivePill");
      const dlBtn = document.getElementById("cosDirDownloadBtn");
      const clipSel = document.getElementById("cosDirClipSelect");
      const statusEl = document.getElementById("cosDirStatusText");

      // Stop any other video on page and mount single clean player
      document.querySelectorAll("video").forEach((v) => { try { v.pause(); } catch (_) {} });
      const vid = document.createElement("video");
      vid.id = "cosDirPreviewVideo";
      vid.controls = true;
      vid.playsInline = true;
      vid.preload = "auto";
      vid.src = startUrl;
      slot.prepend(vid);

      // Live visual preview of the zoom punch-in during playback
      vid.addEventListener("timeupdate", () => {
        const interval = selectedRhythm === "fast" ? 2.0 : (selectedRhythm === "engaging" ? 3.5 : 6.0);
        const hold = Math.min(1.1, interval * 0.38);
        const inPunch = punchEnabled && ((vid.currentTime % interval) < hold);
        if (inPunch) {
          vid.classList.add("is-punched");
          badge.textContent = "108% Punch-In";
        } else {
          vid.classList.remove("is-punched");
          badge.textContent = "100% Frame";
        }
      });

      function updatePill() {
        const label = selectedRhythm === "fast" ? "High-Energy ? Zoom every 2s" :
                      selectedRhythm === "engaging" ? "Balanced ? Zoom every 3.5s" :
                      "Relaxed ? Zoom every 6s";
        pill.textContent = label + (punchEnabled ? " (108%)" : " (Subtle)");
      }

      ui.querySelectorAll(".cos-dir-rhythm-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          ui.querySelectorAll(".cos-dir-rhythm-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          selectedRhythm = btn.getAttribute("data-rhythm") || "calm";
          updatePill();
        });
      });

      const punchBtn = document.getElementById("cosDirPunchToggle");
      punchBtn.addEventListener("click", () => {
        punchEnabled = !punchEnabled;
        punchBtn.textContent = punchEnabled ? "On (108%)" : "Off (103%)";
        punchBtn.classList.toggle("off", !punchEnabled);
        updatePill();
      });

      clipSel.addEventListener("change", () => {
        const chosen = clips.find((c) => c.filename === clipSel.value);
        if (!chosen) return;
        setStudioState({ activeClipFilename: chosen.filename });
        vid.pause();
        vid.src = chosen.url;
        vid.load();
        vid.play().catch(() => {});
        dlBtn.href = chosen.url;
        dlBtn.download = chosen.filename;
      });

      async function runDirectorRender(btnToUpdate) {
        const origLabel = btnToUpdate ? btnToUpdate.textContent : "";
        if (btnToUpdate) {
          btnToUpdate.disabled = true;
          btnToUpdate.textContent = "Rendering Zoom...";
        }
        statusEl.textContent = "Rendering camera zoom rhythm into your 9:16 short with FFmpeg...";

        const resp = await fetch("/api/cos-ai-director-apply", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            project_id: pid,
            clip_filename: clipSel.value,
            rhythm: selectedRhythm,
            punch_enabled: punchEnabled
          })
        }).then((r) => r.json()).catch(() => ({}));

        if (btnToUpdate) {
          btnToUpdate.disabled = false;
          btnToUpdate.textContent = origLabel;
        }

        if (resp && resp.ok && resp.clip) {
          clips.unshift(resp.clip);
          clipSel.innerHTML = clips.map((c) => `<option value="${escapeHtml(c.filename)}" ${c.filename === resp.clip.filename ? "selected" : ""}>${escapeHtml(c.title)} (${c.size_mb} MB)</option>`).join("");
          setStudioState({ activeClipFilename: resp.clip.filename });
          vid.pause();
          vid.src = resp.clip.url;
          vid.load();
          vid.play().catch(() => {});
          dlBtn.href = resp.clip.url;
          dlBtn.download = resp.clip.filename;
          statusEl.innerHTML = `<strong style="color:#6ee7b7;">Saved &amp; Rendered!</strong> Your zoom-edited clip is playing now?click <strong>Download Clip MP4</strong> or continue to <strong>Smart Reframing</strong>.`;
        } else {
          statusEl.textContent = resp.detail || "Could not render AI Director clip.";
        }
      }

      document.getElementById("cosDirApplyBtn").addEventListener("click", function () {
        runDirectorRender(this);
      });

      // Also wire the top-right native "Save Settings" button to trigger the same real render
      const topSaveBtn = Array.from(stage.querySelectorAll("button")).find((b) =>
        /^save settings$/i.test((b.textContent || "").trim())
      );
      if (topSaveBtn && !topSaveBtn.getAttribute("data-cos-wired")) {
        topSaveBtn.setAttribute("data-cos-wired", "true");
        topSaveBtn.addEventListener("click", function () {
          runDirectorRender(this);
        });
      }
    } finally {
      isRenderingDirector = false;
    }
  }

  setInterval(enhanceAiDirectorPage, 500);
})();
</script>

<script id="cos-smart-reframe-script">
(function () {
  function getStudioState() {
    try { return JSON.parse(localStorage.getItem("cos_studio_state_v2") || "{}"); } catch (_) { return {}; }
  }

  function setStudioState(patch) {
    try {
      const next = Object.assign({}, getStudioState(), patch);
      localStorage.setItem("cos_studio_state_v2", JSON.stringify(next));
    } catch (_) {}
  }

  function getActiveProjectId() {
    const st = getStudioState();
    if (st.activeProjectId && st.activeProjectId !== "undefined") return String(st.activeProjectId);
    const sel = document.getElementById("cosCtxProjectSelect");
    return sel && sel.value && sel.value !== "undefined" ? sel.value : "proj-bf2e1fae";
  }

  function getActiveClipFilename() {
    const topSel = document.getElementById("cosCtxClipSelect");
    if (topSel && topSel.value && topSel.value.endsWith(".mp4")) return topSel.value;
    const st = getStudioState();
    return (st.activeClipFilename && st.activeClipFilename.endsWith(".mp4")) ? st.activeClipFilename : "";
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Wire top-right "Go to Subtitle Studio ->" button on Smart Reframing so it opens Page 3 of 6 cleanly
  document.addEventListener("click", function (e) {
    const btn = e.target.closest("button, a");
    if (!btn) return;
    const label = (btn.textContent || "").replace(/\s+/g, " ").trim().toLowerCase();
    if (label.includes("go to subtitle studio") || label.includes("continue to subtitle")) {
      const stage = document.getElementById("cosStudioArchitecture");
      if (!stage) return;
      const subTab = Array.from(
        stage.querySelectorAll("button, a, [role='tab'], [data-tool], [data-page], [data-subtool], .cos-subtool-btn, .cos-tab-btn")
      ).find((el) => el !== btn && (el.textContent || "").toLowerCase().includes("subtitle studio"));
      if (subTab) {
        setTimeout(() => subTab.click(), 30);
      }
    }
  }, true);

  let isRenderingReframe = false;

  async function enhanceSmartReframingPage() {
    const host = document.getElementById("cosStudioArchitecture");
    if (!host) return;
    const stage = host.querySelector(".cos-tool-stage") || host;

    const heading = Array.from(stage.querySelectorAll("h1, h2")).find((h) =>
      /^smart reframing$|auto subject framing|subject framing/i.test((h.textContent || "").trim())
    );
    if (!heading) return;

    const card = stage.querySelector(".cos-ws-card");
    if (!card || card.getAttribute("data-cos-reframe-ready") === "true" || isRenderingReframe) return;
    isRenderingReframe = true;

    try {
      card.setAttribute("data-cos-reframe-ready", "true");
      card.classList.add("span-2");

      heading.textContent = "Auto Subject Framing (9:16 Vertical)";
      const sub = heading.nextElementSibling;
      if (sub) {
        sub.textContent = "Keep the speaker centered in the vertical frame?or fit wide screen shares cleanly without cutting off edges.";
      }

      const pid = getActiveProjectId();
      const data = await fetch(`/api/cos-output-clips/${encodeURIComponent(pid)}`).then((r) => r.json()).catch(() => ({ clips: [] }));
      let clips = Array.isArray(data.clips) ? data.clips : [];
      const preferredFn = getActiveClipFilename();
      let activeClip = clips.find((c) => c.filename === preferredFn) || clips[0] || null;
      const startUrl = activeClip ? activeClip.url : `/api/cos-preview-video/${encodeURIComponent(pid)}`;

      const topClipSel = document.getElementById("cosCtxClipSelect");
      if (topClipSel && clips.length > 0) {
        topClipSel.innerHTML = clips.map((c) => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.title)}</option>`).join("");
        if (activeClip) topClipSel.value = activeClip.id;
      }

      const topArea = card.querySelector(".cos-ws-card-top") || card;
      Array.from(topArea.children).forEach((ch) => {
        ch.style.display = "none";
      });

      let currentMode = "center";
      let currentOffset = 0.0;

      const ui = document.createElement("div");
      ui.id = "cosSmartReframeHumanBox";
      ui.innerHTML = `
        <div class="cos-ws-card-head" style="margin-bottom:14px;">
          <span>Live 9:16 Framing &amp; Safe-Zone Preview</span>
          <span class="cos-ws-head-pill" style="color:#6ee7b7;" id="cosRefLivePill">Center Speaker Lock</span>
        </div>

        <div class="cos-ref-grid">
          <div class="cos-ref-phone">
            <div class="cos-ref-slot" id="cosRefVideoSlot">
              <div class="cos-ref-safe-overlay" id="cosRefSafeOverlay"></div>
            </div>
            <a id="cosRefDownloadBtn" class="cos-ref-dl-btn"
              href="${escapeHtml(startUrl)}" download="${escapeHtml(activeClip ? activeClip.filename : pid + '_reframed.mp4')}">
              Download Reframed MP4
            </a>
          </div>

          <div class="cos-ref-controls">
            <div>
              <div style="font-size:12px;font-weight:700;color:#cbd5e1;margin-bottom:6px;">1. Active Short</div>
              <select id="cosRefClipSelect" style="width:100%;padding:9px 11px;border-radius:10px;background:#10152a;border:1px solid rgba(129,140,248,0.35);color:#fff;font-size:13px;">
                ${clips.length
                  ? clips.map((c) => `<option value="${escapeHtml(c.filename)}" ${activeClip && c.filename === activeClip.filename ? "selected" : ""}>${escapeHtml(c.title)} (${c.size_mb} MB)</option>`).join("")
                  : `<option value="">${escapeHtml(pid)}.mp4</option>`}
              </select>
            </div>

            <div>
              <div style="font-size:12px;font-weight:700;color:#cbd5e1;margin-bottom:6px;">2. Choose Framing Style</div>
              <div class="cos-ref-presets" id="cosRefPresetGroup">
                <button type="button" class="cos-ref-preset-btn active" data-mode="center" data-ox="0">
                  <div style="font-size:13px;font-weight:800;color:#fff;">Center Speaker</div>

                </button>
                <button type="button" class="cos-ref-preset-btn" data-mode="left" data-ox="-0.65">
                  <div style="font-size:13px;font-weight:800;color:#fff;">Left Speaker</div>
                  <div style="font-size:11.5px;color:#94a3b8;margin-top:3px;">Shifts frame left for 2-person podcast shots</div>
                </button>
                <button type="button" class="cos-ref-preset-btn" data-mode="right" data-ox="0.65">
                  <div style="font-size:13px;font-weight:800;color:#fff;">Right Speaker</div>
                  <div style="font-size:11.5px;color:#94a3b8;margin-top:3px;">Shifts frame right for guest / co-host shots</div>
                </button>
                <button type="button" class="cos-ref-preset-btn" data-mode="fit_blur" data-ox="0">
                  <div style="font-size:13px;font-weight:800;color:#fff;">Full Screen Fit</div>
                  <div style="font-size:11.5px;color:#94a3b8;margin-top:3px;">Fits wide slides/screen shares with blurred fill</div>
                </button>
              </div>
            </div>

            <div class="cos-ref-slider-box">
              <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;">
                <span style="font-weight:700;color:#cbd5e1;">3. Fine-Tune Horizontal Focus</span>
                <span id="cosRefOffsetLabel" style="font-weight:700;color:#a5b4fc;">0% (Center)</span>
              </div>
              <input type="range" id="cosRefOffsetSlider" class="cos-ref-slider" min="-100" max="100" step="5" value="0">
              <div style="display:flex;justify-content:space-between;font-size:10.5px;color:#64748b;margin-top:2px;">
                <span>&larr; Left Edge</span>
                <span>Center</span>
                <span>Right Edge &rarr;</span>
              </div>
            </div>

            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
              <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:#cbd5e1;cursor:pointer;">
                <input type="checkbox" id="cosRefSafeChk" checked style="accent-color:#10b981;width:15px;height:15px;">
                Show Shorts / Reels UI Safe Zones
              </label>
              <button type="button" class="cos-ref-primary-btn" id="cosRefApplyBtn">
                Save &amp; Render Reframe &rarr;
              </button>
            </div>

            <div id="cosRefStatusText" style="font-size:12px;color:#a5b4fc;">
              Adjust framing or slide focus to preview live, then click Save &amp; Render Reframe.
            </div>
          </div>
        </div>
      `;

      topArea.appendChild(ui);

      const slot = document.getElementById("cosRefVideoSlot");
      const safeOverlay = document.getElementById("cosRefSafeOverlay");
      const pill = document.getElementById("cosRefLivePill");
      const dlBtn = document.getElementById("cosRefDownloadBtn");
      const clipSel = document.getElementById("cosRefClipSelect");
      const slider = document.getElementById("cosRefOffsetSlider");
      const offsetLbl = document.getElementById("cosRefOffsetLabel");
      const statusEl = document.getElementById("cosRefStatusText");

      document.querySelectorAll("video").forEach((v) => { try { v.pause(); } catch (_) {} });
      const vid = document.createElement("video");
      vid.id = "cosReframePreviewVideo";
      vid.controls = true;
      vid.playsInline = true;
      vid.preload = "auto";
      vid.src = startUrl;
      slot.prepend(vid);

      function updateLivePreview() {
        const pct = Math.round(currentOffset * 100);
        offsetLbl.textContent = pct === 0 ? "0% (Center)" : (pct < 0 ? `${pct}% (Left)` : `+${pct}% (Right)`);
        slider.disabled = (currentMode === "fit_blur");

        if (currentMode === "fit_blur") {
          slot.classList.add("is-fit-blur");
          vid.style.transform = "scale(0.92)";
          pill.textContent = "Full Screen Fit (Blurred Fill)";
        } else {
          slot.classList.remove("is-fit-blur");
          const zoom = Math.abs(currentOffset) > 0.02 ? 1.15 : 1.0;
          const shiftPct = -(currentOffset * 7.5);
          vid.style.transform = `scale(${zoom}) translateX(${shiftPct}%)`;
          pill.textContent = currentMode === "left" ? "Left Speaker Focus" :
                             currentMode === "right" ? "Right Speaker Focus" :
                             (pct !== 0 ? `Custom Focus (${pct > 0 ? "+" : ""}${pct}%)` : "Center Speaker Lock");
        }
      }

      ui.querySelectorAll(".cos-ref-preset-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          ui.querySelectorAll(".cos-ref-preset-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentMode = btn.getAttribute("data-mode") || "center";
          currentOffset = Number(btn.getAttribute("data-ox") || 0);
          slider.value = String(Math.round(currentOffset * 100));
          updateLivePreview();
        });
      });

        currentOffset = Number(slider.value || 0) / 100;
        if (currentMode === "fit_blur") currentMode = "center";
        ui.querySelectorAll(".cos-ref-preset-btn").forEach((b) => b.classList.remove("active"));
        const matchMode = currentOffset < -0.25 ? "left" : (currentOffset > 0.25 ? "right" : "center");
        const matchBtn = ui.querySelector(`.cos-ref-preset-btn[data-mode="${matchMode}"]`);
        if (matchBtn) matchBtn.classList.add("active");
        currentMode = matchMode;
        updateLivePreview();
      });

      document.getElementById("cosRefSafeChk").addEventListener("change", function () {
        safeOverlay.classList.toggle("hidden", !this.checked);
      });

      clipSel.addEventListener("change", () => {
        const chosen = clips.find((c) => c.filename === clipSel.value);
        if (!chosen) return;
        setStudioState({ activeClipFilename: chosen.filename });
        vid.pause();
        vid.src = chosen.url;
        vid.load();
        vid.play().catch(() => {});
        dlBtn.href = chosen.url;
        dlBtn.download = chosen.filename;
      });

      async function runReframeRender(btnToUpdate) {
        const origLabel = btnToUpdate ? btnToUpdate.textContent : "";

          btnToUpdate.disabled = true;
          btnToUpdate.textContent = "Reframing...";
        }
        statusEl.textContent = "Rendering 9:16 subject framing with FFmpeg...";

        const resp = await fetch("/api/cos-smart-reframe-apply", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            project_id: pid,
            clip_filename: clipSel.value,
            mode: currentMode,
            offset_x: currentOffset
          })
        }).then((r) => r.json()).catch(() => ({}));

        if (btnToUpdate) {
          btnToUpdate.disabled = false;
          btnToUpdate.textContent = origLabel;
        }

        if (resp && resp.ok && resp.clip) {
          clips.unshift(resp.clip);

          setStudioState({ activeClipFilename: resp.clip.filename });
          vid.pause();
          vid.src = resp.clip.url;
          vid.load();
          vid.play().catch(() => {});
          dlBtn.href = resp.clip.url;
          dlBtn.download = resp.clip.filename;
          statusEl.innerHTML = `<strong style="color:#6ee7b7;">Reframed &amp; Saved!</strong> Playing your newly framed 9:16 clip?download it or move on to <strong>Subtitle Studio</strong>.`;
        } else {
          statusEl.textContent = resp.detail || "Could not render reframed clip.";
        }
      }

      document.getElementById("cosRefApplyBtn").addEventListener("click", function () {
        runReframeRender(this);
      });

      const topSaveBtn = Array.from(stage.querySelectorAll("button")).find((b) =>
        /^save settings$/i.test((b.textContent || "").trim())
      );
      if (topSaveBtn && !topSaveBtn.getAttribute("data-cos-reframe-wired")) {
        topSaveBtn.setAttribute("data-cos-reframe-wired", "true");
        topSaveBtn.addEventListener("click", function () {
          runReframeRender(this);
        });
      }
    } finally {
      isRenderingReframe = false;
    }
  }

  setInterval(enhanceSmartReframingPage, 500);
})();
</script>

    try { return JSON.parse(localStorage.getItem("cos_studio_state_v2") || "{}"); } catch (_) { return {}; }
  }

  function setStudioState(patch) {
    try {
      const next = Object.assign({}, getStudioState(), patch);
      localStorage.setItem("cos_studio_state_v2", JSON.stringify(next));
    } catch (_) {}
  }

  function getActiveProjectId() {
    const st = getStudioState();
    if (st.activeProjectId && st.activeProjectId !== "undefined") return String(st.activeProjectId);

    const topSel = document.getElementById("cosCtxClipSelect");

    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
